id: intimate-acoustic-tiny-desk
name: "Intimate Acoustic — single-room performance, close-up bias"
description: |
  Single-Location-Performance in einem hell beleuchteten, echten
  Buero-Raum, Kamera bleibt bei Gesicht und Haenden, Schnitt ruhig
  (kein Schnitt mitten in einer Phrase). Vorbild: NPR Tiny Desk und
  vergleichbare Live-Performance-Formate. Empfohlen fuer ruhige
  Akustik-Tracks, wo der Performer im Mittelpunkt steht und die Welt
  drum herum minimal bleibt.

references:
  - name: "NPR Music Tiny Desk Concert series"
    role: music_video
    notable_works:
      - "Wilco — Tiny Desk Concert (2016)"
    sources:
      - label: "NPR (Bob Boilen) — Wilco In 360: Behind The Scenes At NPR Music's Tiny Desk"
        url: "https://www.npr.org/sections/allsongs/2016/02/25/467952320/wilco-in-360-behind-the-scenes-at-npr-musics-tiny-desk"
      - label: "Pitzer College News — Behind the Camera of NPR's Tiny Desk Concerts (Maia Stern, 2025)"
        url: "https://www.pitzer.edu/news/maia-stern-tiny-desk-concerts"
      - label: "The Noise Gate by Podcast Movement — Video Podcast Tips from NPR's Tiny Desk Concerts (Maia Stern, 2025)"
        url: "https://noisegate.podcastmovement.com/p/video-podcast-tips-from-npr-s-tiny-desk-concerts"

section_arc:
  - role: establishing
    framing_hint: [ms, mcu]
    notes: "Sanfter Establishing-Shot des Performers im Raum — nicht WIDE, weil Welt-Kontext nebensaechlich ist."
  - role: detail
    framing_hint: [cu, ecu]
    notes: "Hand auf Saiten, Ausdruck im Gesicht, Texture-Beats."
  - role: reaction
    framing_hint: [mcu]
    notes: "Gelegentlich Mitspieler oder Zuhoerer."
  - role: resolve
    framing_hint: [ms]
    notes: "Rueck zur ruhigen Mittel-Distanz am Ende einer Phrase."

framing_mix:
  wide_pct: 0
  full_pct: 0
  ms_pct: 30
  mcu_pct: 25
  cu_pct: 30
  ecu_pct: 10
  ots_pct: 0
  pov_pct: 0
  insert_pct: 5
  aerial_pct: 0
  basis: inferred
  sources:
    - "https://www.pitzer.edu/news/maia-stern-tiny-desk-concerts"
    - "https://noisegate.podcastmovement.com/p/video-podcast-tips-from-npr-s-tiny-desk-concerts"

asl_range:
  min_s: 3.0
  max_s: 8.0
  typical_s: 5.0
  basis: inferred
  sources:
    - "https://noisegate.podcastmovement.com/p/video-podcast-tips-from-npr-s-tiny-desk-concerts"

camera:
  vocabulary:
    - "static wide hold on a tripod"
    - "monopod camera moving with the performer"
    - "face-and-hands framing on the instrument"
    - "hold the shot through a solo, no cut mid-phrase"
  basis: inferred
  sources:
    - "https://noisegate.podcastmovement.com/p/video-podcast-tips-from-npr-s-tiny-desk-concerts"
    - "https://www.pitzer.edu/news/maia-stern-tiny-desk-concerts"

lighting:
  description: |
    bright, even office light: natural window light supplemented by a
    lighting system that stays out of frame and evens out changing
    daylight without altering the look of the room.
  basis: inferred
  sources:
    - "https://noisegate.podcastmovement.com/p/video-podcast-tips-from-npr-s-tiny-desk-concerts"
    - "https://www.pitzer.edu/news/maia-stern-tiny-desk-concerts"

color:
  description: "Natural window and office colour; the room keeps its own look."
  basis: inferred
  sources:
    - "https://noisegate.podcastmovement.com/p/video-podcast-tips-from-npr-s-tiny-desk-concerts"
    - "https://www.pitzer.edu/news/maia-stern-tiny-desk-concerts"

craft_signature:
  - technique: "Real room, even light"
    directive: "Light the room evenly from window light plus unobtrusive fill, keep the office as it looks, and frame face and hands together."
    pipeline_levers: [visual_prompt, bible_look, bible_lighting]
    basis: inferred
    sources:
    - "https://noisegate.podcastmovement.com/p/video-podcast-tips-from-npr-s-tiny-desk-concerts"
    - "https://www.pitzer.edu/news/maia-stern-tiny-desk-concerts"
