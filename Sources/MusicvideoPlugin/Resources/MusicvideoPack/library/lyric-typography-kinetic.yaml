id: lyric-typography-kinetic
name: "Lyric Video — kinetic typography"
description: |
  Typografie-getriebenes Lyric-Video: Text-Animation synchron zum
  Song, Motion-Graphics statt Performance, Kompositions-Logik aus
  Schrift-Hierarchie statt Kamera-Bewegung. Fuer Releases ohne
  narrative Performance, mit starkem Songtext.

references:
  - name: "Lyric video tradition"
    role: music_video
    notable_works:
      - "Bob Dylan — Subterranean Homesick Blues (1965, cue cards with lyric words, filmed by D. A. Pennebaker for Dont Look Back)"
      - "Prince — Sign o' the Times (1987, words pulsing alongside abstract geometric shapes)"
      - "Talking Heads — (Nothing But) Flowers (1988, lyrics superimposed on the band members)"
      - "George Michael — Praying for Time (1990, lyrics on a black screen)"
    sources:
      - label: "Wikipedia — Lyric video"
        url: "https://en.wikipedia.org/wiki/Lyric_video"
      - label: "Wikipedia — Subterranean Homesick Blues"
        url: "https://en.wikipedia.org/wiki/Subterranean_Homesick_Blues"
      - label: "Pérez Rufí, Vivat Academia 144 (2018) — Lyric vídeos: el encuentro del videoclip con el diseño gráfico y la composición tipográfica"
        url: "https://vivatacademia.net/index.php/vivat/article/view/1071"
  - name: "Kinetic type in film titles"
    role: film
    notable_works:
      - "Saul Bass — North by Northwest main titles (1959, often credited as the first sequence to use kinetic type)"
    sources:
      - label: "Art of the Title — North by Northwest"
        url: "https://www.artofthetitle.com/title/north-by-northwest"

section_arc:
  - role: establishing
    framing_hint: [wide, insert]
    notes: "Titel- oder Intro-Card mit Track-Title + Artist-Name in dominanter Typografie."
  - role: reveal
    framing_hint: [insert, cu]
    notes: "Erste Lyric-Phrase animated reveal — kinetic-typography auf Beat."
  - role: performance
    framing_hint: [insert]
    notes: "Lyric-Phrasen folgen rhythmisch, Schrift-Hierarchie und Bewegungs-Typ wechseln pro Phrase-Funktion."
  - role: cutaway
    framing_hint: [insert]
    notes: "Akzent-Layer: abstrakte Form oder Textur hinter der Schrift."

framing_mix:
  wide_pct: 10
  full_pct: 5
  ms_pct: 10
  mcu_pct: 10
  cu_pct: 15
  ecu_pct: 10
  ots_pct: 0
  pov_pct: 0
  insert_pct: 40
  aerial_pct: 0
  basis: inferred
  sources:
    - "https://vivatacademia.net/index.php/vivat/article/view/1071"

asl_range:
  min_s: 0.3
  max_s: 4.0
  typical_s: 1.2
  basis: inferred
  sources:
    - "https://vivatacademia.net/index.php/vivat/article/view/1071"

camera:
  vocabulary:
    - "static composition with animated type"
    - "type-driven push-in"
    - "type-driven whip pan"
    - "match-cut on word-replacement"
    - "kinetic letter-reveal"
  basis: inferred
  sources:
    - "https://vivatacademia.net/index.php/vivat/article/view/1071"
    - "https://en.wikipedia.org/wiki/Lyric_video"

lighting:
  description: |
    flat motion-graphics background — single solid colour or black,
    with an occasional abstract-shape or footage plate behind the
    type.
  basis: inferred
  sources:
    - "https://vivatacademia.net/index.php/vivat/article/view/1071"
    - "https://en.wikipedia.org/wiki/Lyric_video"

color:
  description: "A flat, limited palette set by the background plate, with high contrast between type and ground."
  basis: inferred
  sources:
    - "https://vivatacademia.net/index.php/vivat/article/view/1071"
    - "https://en.wikipedia.org/wiki/Lyric_video"

craft_signature:
  - technique: "Type-led graphic plate"
    directive: "Use animated type synchronized to the song over a flat solid, black, or abstract-shape plate."
    pipeline_levers: [visual_prompt, bible_look, bible_lighting]
    basis: inferred
    sources:
    - "https://vivatacademia.net/index.php/vivat/article/view/1071"
    - "https://en.wikipedia.org/wiki/Lyric_video"
