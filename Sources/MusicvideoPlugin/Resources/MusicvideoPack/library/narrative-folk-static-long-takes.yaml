id: narrative-folk-static-long-takes
name: "Narrative Folk — static long takes, story over performance"
description: |
  Geschichten-getrieben, lange Einstellungen, ruhige Kamera, klarer
  Schauplatz-Wechsel pro Section. Vorbild: Michel Gondry und Spike
  Jonze aus dem Directors-Label-Kanon fuer narrative Musikvideos, in
  Folk- und Indie-Rock-Anwendungen.

references:
  - name: "Michel Gondry"
    role: director
    notable_works:
      - "Daft Punk — Around the World (platform set with five groups of choreographed characters)"
      - "Björk — Bachelorette"
      - "The White Stripes — Fell in Love with a Girl"
    sources:
      - label: "Wikipedia — Around the World (Daft Punk song)"
        url: "https://en.wikipedia.org/wiki/Around_the_World_(Daft_Punk_song)"
      - label: "Wikipedia — Directors Label"
        url: "https://en.wikipedia.org/wiki/Directors_Label"
      - label: "IMDb — The Work of Director Michel Gondry"
        url: "https://www.imdb.com/title/tt0384700/"
  - name: "Spike Jonze"
    role: director
    notable_works:
      - "Fatboy Slim — Praise You (guerrilla-style in front of the Fox Bruin Theater, US$800 budget; 1999 MTV VMA Best Direction)"
      - "The Pharcyde — Drop"
      - "Weezer — Buddy Holly"
    sources:
      - label: "Wikipedia — Praise You"
        url: "https://en.wikipedia.org/wiki/Praise_You"
      - label: "IMDb — The Work of Director Spike Jonze"
        url: "https://www.imdb.com/title/tt0386124/"

section_arc:
  - role: establishing
    framing_hint: [wide, full]
    notes: "Klarer Schauplatz-Anker pro Section — 1 Shot."
  - role: reveal
    framing_hint: [ms, mcu]
    notes: "Subject-Reveal, Charakter im Raum verankert."
  - role: detail
    framing_hint: [cu, insert]
    notes: "Story-Beats in Detail-Inserts (Brief, Hand, Objekt)."
  - role: resolve
    framing_hint: [ms, full]
    notes: "Rueck zum Mittel- oder Ganz-Body am Section-Ende."

framing_mix:
  wide_pct: 10
  full_pct: 10
  ms_pct: 30
  mcu_pct: 20
  cu_pct: 20
  ecu_pct: 0
  ots_pct: 5
  pov_pct: 0
  insert_pct: 5
  aerial_pct: 0
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Praise_You"
    - "https://en.wikipedia.org/wiki/Directors_Label"

asl_range:
  min_s: 3.0
  max_s: 12.0
  typical_s: 6.0
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Praise_You"
    - "https://en.wikipedia.org/wiki/Directors_Label"

camera:
  vocabulary:
    - "static hold"
    - "slow lateral track"
    - "gentle push-in"
    - "long-take handheld follow"
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Praise_You"
    - "https://en.wikipedia.org/wiki/Directors_Label"

lighting:
  description: |
    natural daylight where possible, soft motivated practicals indoors,
    bias toward overcast or golden-hour, low contrast, single key source.
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Praise_You"
    - "https://en.wikipedia.org/wiki/Directors_Label"

color:
  description: "Overcast or golden-hour natural colour with low contrast."
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Praise_You"
    - "https://en.wikipedia.org/wiki/Directors_Label"

craft_signature:
  - technique: "Natural single-source restraint"
    directive: "Use natural daylight or a soft motivated indoor practical, with overcast or golden-hour bias and low contrast."
    pipeline_levers: [visual_prompt, bible_look, bible_lighting]
    basis: inferred
    sources:
    - "https://en.wikipedia.org/wiki/Praise_You"
    - "https://en.wikipedia.org/wiki/Directors_Label"
