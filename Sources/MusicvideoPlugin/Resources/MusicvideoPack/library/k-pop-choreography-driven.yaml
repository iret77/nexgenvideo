id: k-pop-choreography-driven
name: "K-Pop / Mainstream Pop — choreography-driven set pieces"
description: |
  Choreographie-getriebene Performance-Videos in der K-Pop-Tradition
  (BLACKPINK, Stray Kids, Lisa). Klare Set-Pieces, gruppen-
  synchronisierte Tanz-Sequenzen, schnelle aber lesbare Cuts auf den
  Beat, Concept-Wechsel pro Section. Empfohlen fuer Mainstream-Pop-
  und K-Pop-Releases mit Tanz-Fokus.

references:
  - name: "Kyle Hanagami"
    role: choreographer
    notable_works:
      - "BLACKPINK — Kill This Love (choreography; 2020 iHeartRadio Music Award, Favorite Music Video Choreography)"
    sources:
      - label: "Kyle Hanagami — official site (credits, 2020 iHeartRadio Music Award for Kill This Love)"
        url: "https://www.kylehanagami.com/"
  - name: "Stray Kids and LISA (concept-driven K-pop music videos)"
    role: music_video
    notable_works:
      - "Stray Kids — 神메뉴 (God's Menu) M/V (2020, official upload by JYP Entertainment)"
      - "LISA — Rockstar (2024; MTV VMA nominations for Best K-Pop, Best Choreography (Sean Bankhead), Best Art Direction, Best Editing)"
    sources:
      - label: "JYP Entertainment (YouTube) — Stray Kids 神메뉴(God's Menu) M/V"
        url: "https://www.youtube.com/watch?v=TQTlCHxyuu8"
      - label: "Seoulbeats — Stray Kids Cook Up a Dizzying MV with 'God's Menu' (2020)"
        url: "https://seoulbeats.com/2020/06/stray-kids-cook-up-a-dizzying-mv-with-gods-menu/"
      - label: "TVLine — 2024 VMAs nominations (LISA Rockstar, Stray Kids LALALALA)"
        url: "https://tvline.com/lists/vmas-2024-nominations-full-list-nominees-mtv-video-music-awards"
  - name: "Han Sa-min (K-pop music video director)"
    role: director
    notable_works:
      - "BIGBANG — Love Song (4-point wire camera setup on four cranes)"
    sources:
      - label: "HallyuTones — Inside K-Pop: Behind The Lens With Director Han Sa-min (2025)"
        url: "https://hallyutones.com/2025/12/09/interview-inside-k-pop-behind-the-lens-with-director-han-sa-min/"

section_arc:
  - role: establishing
    framing_hint: [wide, full]
    notes: "Set-Piece-Reveal: Tanzgruppe in voller Choreografie sichtbar."
  - role: performance
    framing_hint: [ms, mcu]
    notes: "Mid-Group oder Lead-Performer in Mittel-Distanz, Beat-genau geschnitten."
  - role: reveal
    framing_hint: [cu, ecu]
    notes: "Augen-CU des Leads, Hand-Akzent, Schmuck-Detail auf Hit."
  - role: cutaway
    framing_hint: [insert, ots]
    notes: "Crew-Pose-Insert, Symbol-Frame, Logo-Element."

framing_mix:
  wide_pct: 15
  full_pct: 15
  ms_pct: 25
  mcu_pct: 15
  cu_pct: 15
  ecu_pct: 5
  ots_pct: 5
  pov_pct: 0
  insert_pct: 5
  aerial_pct: 0
  basis: inferred
  sources:
    - "https://seoulbeats.com/2020/06/stray-kids-cook-up-a-dizzying-mv-with-gods-menu/"

asl_range:
  min_s: 0.8
  max_s: 3.0
  typical_s: 1.5
  basis: inferred
  sources:
    - "https://seoulbeats.com/2020/06/stray-kids-cook-up-a-dizzying-mv-with-gods-menu/"

camera:
  vocabulary:
    - "transition cut precisely on the beat"
    - "camera following the members' eyelines"
    - "match-cut on choreographed beat"
  basis: inferred
  sources:
    - "https://seoulbeats.com/2020/06/stray-kids-cook-up-a-dizzying-mv-with-gods-menu/"

lighting:
  description: |
    set, colour palette and lighting are set per concept and change
    between sections: a chaotic array of settings, outfits and
    characters rather than one fixed stage.
  basis: inferred
  sources:
    - "https://seoulbeats.com/2020/06/stray-kids-cook-up-a-dizzying-mv-with-gods-menu/"
    - "https://hallyutones.com/2025/12/09/interview-inside-k-pop-behind-the-lens-with-director-han-sa-min/"

color:
  description: "A concept-specific colour palette that changes between sections."
  basis: inferred
  sources:
    - "https://seoulbeats.com/2020/06/stray-kids-cook-up-a-dizzying-mv-with-gods-menu/"
    - "https://hallyutones.com/2025/12/09/interview-inside-k-pop-behind-the-lens-with-director-han-sa-min/"

craft_signature:
  - technique: "Concept-specific palette per section"
    directive: "Give each section its own set, colour palette and lighting, and change them between sections instead of holding one stage look."
    pipeline_levers: [visual_prompt, bible_look, bible_lighting]
    basis: inferred
    sources:
    - "https://seoulbeats.com/2020/06/stray-kids-cook-up-a-dizzying-mv-with-gods-menu/"
    - "https://hallyutones.com/2025/12/09/interview-inside-k-pop-behind-the-lens-with-director-han-sa-min/"
