id: punk-diy-handheld
name: "Punk / Hardcore DIY — handheld vérité"
description: |
  DIY-Hardcore-Punk-Aesthetik: handgehaltene Camera, schnelle
  Cuts auf den Schlag, niedriges Budget als Stilmittel, Konzert-
  Vérité plus rohe Live-Performance. Auch fuer Grindcore-Verwandte.
  Fuer Hardcore-, Punk- und Grindcore-Tracks ohne Production-Lack.

references:
  - name: "Hardcore punk live documentation"
    role: music_video
    notable_works:
      - "The Decline of Western Civilization (1981, Penelope Spheeris; 16mm, live sets by Black Flag, X, Circle Jerks, Fear, the Germs)"
      - "Instrument (Jem Cohen, Fugazi; patchwork of Super 8, 16mm and video footage)"
    sources:
      - label: "Harvard Film Archive — The Decline of Western Civilization"
        url: "https://harvardfilmarchive.org/calendar/the-decline-of-western-civilization-2011-09"
      - label: "Harvard Film Archive — Instrument"
        url: "https://harvardfilmarchive.org/calendar/instrument-2017-04"
      - label: "Wikipedia — Hardcore punk"
        url: "https://en.wikipedia.org/wiki/Hardcore_punk"
  - name: "Grindcore lineage"
    role: music_video
    notable_works:
      - "Napalm Death — Scum (1987)"
      - "Grindcore tape-trading and DIY production network"
    sources:
      - label: "Wikipedia — Grindcore"
        url: "https://en.wikipedia.org/wiki/Grindcore"

section_arc:
  - role: establishing
    framing_hint: [wide, ms]
    notes: "Roher Welt-Anker: Pit, Probenraum, Strasse, Keller."
  - role: performance
    framing_hint: [ms, mcu]
    notes: "Band auf Beat, Schweiss, Bewegung, Mosh-Pit-Energy."
  - role: reveal
    framing_hint: [cu, ecu]
    notes: "Schrei-CU, Faust am Hals, blitzschnelle Hand-Inserts."
  - role: cutaway
    framing_hint: [insert, pov]
    notes: "Crowd-POV, Beton-Wand-Tag, Verschuettete-Bier-Insert."

framing_mix:
  wide_pct: 10
  full_pct: 10
  ms_pct: 25
  mcu_pct: 20
  cu_pct: 20
  ecu_pct: 10
  ots_pct: 0
  pov_pct: 5
  insert_pct: 0
  aerial_pct: 0
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Hardcore_punk"

asl_range:
  min_s: 0.3
  max_s: 3.0
  typical_s: 1.0
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Hardcore_punk"

camera:
  vocabulary:
    - "handheld punk shake"
    - "rapid pan into pit"
    - "snap zoom on scream"
    - "crash zoom on impact"
    - "deliberate blur and grain"
  basis: inferred
  sources:
    - "https://harvardfilmarchive.org/calendar/the-decline-of-western-civilization-2011-09"
    - "https://harvardfilmarchive.org/calendar/instrument-2017-04"

lighting:
  description: |
    available stage / venue lighting, single hard key, deep shadow
    blackout, occasional strobe / red wash, deliberately low-budget
    exposure (sometimes blown highlights, sometimes underexposed).
  basis: inferred
  sources:
    - "https://harvardfilmarchive.org/calendar/the-decline-of-western-civilization-2011-09"
    - "https://harvardfilmarchive.org/calendar/instrument-2017-04"

color:
  description: "Venue stage colour with an occasional red wash and deliberate exposure irregularity."
  basis: inferred
  sources:
    - "https://harvardfilmarchive.org/calendar/the-decline-of-western-civilization-2011-09"
    - "https://harvardfilmarchive.org/calendar/instrument-2017-04"

craft_signature:
  - technique: "Available venue light"
    directive: "Use available stage light, one hard key, deep blackout shadows, and occasional strobe or red wash."
    pipeline_levers: [visual_prompt, bible_look, bible_lighting]
    basis: inferred
    sources:
    - "https://harvardfilmarchive.org/calendar/the-decline-of-western-civilization-2011-09"
    - "https://harvardfilmarchive.org/calendar/instrument-2017-04"
