id: bedroom-pop-lofi-clairo
name: "Bedroom-Pop Lo-Fi — Clairo / Mac DeMarco school"
description: |
  Lo-Fi, einfache Aesthetik aus dem Bedroom-Pop: Self-Recording-
  Look, Macbook-Photo-Booth-Cam, ein Zimmer, sichtbare Imperfektion.
  Vorbild Clairo's "Pretty Girl" (2017, in 30 Minuten im Kinder-
  zimmer aufgenommen) und Mac DeMarco's Vintage-Bias. Fuer authentisch-
  intime Indie-Tracks ohne Production-Bombast.

references:
  - name: "Clairo (Claire Cottrill)"
    role: music_video
    notable_works:
      - "Pretty Girl (2017, self-recorded music video, Photo Booth on MacBook in childhood bedroom)"
      - "Diary 001 (2018)"
    sources:
      - label: "Wikipedia — Pretty Girl (Clairo song)"
        url: "https://en.wikipedia.org/wiki/Pretty_Girl_(Clairo_song)"
      - label: "The FADER — Clairo would like to leave her bedroom now, please"
        url: "https://www.thefader.com/2018/05/24/clairo-diary-001-pretty-girl-4ever-interview"
      - label: "Hypebeast — New Bedroom Pop Artists You Should Check Out (Clairo, Zack Villere, Rex Orange County)"
        url: "https://hypebeast.com/2018/10/best-bedroom-pop-music-clairo-zack-villere-rex-orange-county"
      - label: "Cherwell — The beauty of bedroom pop"
        url: "https://cherwell.org/2020/07/20/the-beauty-of-bedroom-pop/"
  - name: "Mac DeMarco"
    role: music_video
