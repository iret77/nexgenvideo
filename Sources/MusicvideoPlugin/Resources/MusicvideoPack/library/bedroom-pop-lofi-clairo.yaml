id: bedroom-pop-lofi-clairo
name: "Bedroom-Pop Lo-Fi — Clairo / Mac DeMarco school"
description: |
  Lo-Fi, einfache Aesthetik aus dem Bedroom-Pop: Self-Recording-
  Look, Macbook-Photo-Booth-Cam, ein Zimmer, sichtbare Imperfektion.
  Vorbild Clairo's "Pretty Girl" (2017, in 30 Minuten im Kinder-
  zimmer aufgenommen) und Mac DeMarcos zuhause aufgenommenes Salad
  Days. Fuer authentisch-intime Indie-Tracks ohne Production-Bombast.

references:
  - name: "Clairo (Claire Cottrill)"
    role: music_video
    notable_works:
      - "Pretty Girl (2017, self-directed music video, Photo Booth on MacBook in childhood bedroom, about 30 minutes)"
    sources:
      - label: "Wikipedia — Pretty Girl (Clairo song)"
        url: "https://en.wikipedia.org/wiki/Pretty_Girl_(Clairo_song)"
      - label: "Wikipedia — Bedroom pop (DIY music videos on YouTube, home-recorded lo-fi)"
        url: "https://en.wikipedia.org/wiki/Bedroom_pop"
      - label: "The FADER — Clairo would like to leave her bedroom now, please"
        url: "https://www.thefader.com/2018/05/24/clairo-diary-001-pretty-girl-4ever-interview"
  - name: "Mac DeMarco"
    role: music_video
    notable_works:
      - "Salad Days (album, recorded in his Brooklyn apartment on a Fostex A-8)"
    sources:
      - label: "Wikipedia — Salad Days (Mac DeMarco album)"
        url: "https://en.wikipedia.org/wiki/Salad_Days_(Mac_DeMarco_album)"

section_arc:
  - role: establishing
    framing_hint: [ms, mcu]
    notes: "Performer in seinem Raum — Bett, Schreibtisch, sichtbares Kabel-Spaghetti."
  - role: detail
    framing_hint: [cu, ecu]
    notes: "Imperfektionen werden gefeiert — Pickel, ungemachtes Haar, schiefe Brille."
  - role: cutaway
    framing_hint: [insert]
    notes: "Objekt-Insert: Tee, Kassette, Buch, Foto-Sammlung."
  - role: resolve
    framing_hint: [ms]
    notes: "Zurueck zur ruhigen Mittel-Distanz."

