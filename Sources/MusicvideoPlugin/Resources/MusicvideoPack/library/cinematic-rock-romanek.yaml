id: cinematic-rock-romanek
name: "Cinematic Rock — Romanek / Sigismondi school"
description: |
  Konzeptionell, bildstark, Story-driven, oft duester oder
  introspektiv. Vorbild: Mark Romanek (Nine Inch Nails, Johnny Cash —
  Hurt) und Floria Sigismondi (Marilyn Manson, The Cure). Empfohlen
  fuer Rock-/Alt-Tracks mit erzaehlerischem Kern und visuell starkem
  Konzept.

references:
  - name: "Mark Romanek"
    role: director
    notable_works:
      - "Nine Inch Nails — Closer (1994, 19th-century laboratory set, slightly out-of-date film stock with granular grain)"
      - "Johnny Cash — Hurt (2003, filmed at the run-down House of Cash museum, vanitas imagery)"
      - "Audioslave — Cochise"
      - "Janet Jackson — Got 'til It's Gone"
    sources:
      - label: "Wikipedia — Mark Romanek"
        url: "https://en.wikipedia.org/wiki/Mark_Romanek"
      - label: "Wikipedia — Mark Romanek videography"
        url: "https://en.wikipedia.org/wiki/Mark_Romanek_videography"
      - label: "Wikipedia — Closer (Nine Inch Nails song)"
        url: "https://en.wikipedia.org/wiki/Closer_(Nine_Inch_Nails_song)"
      - label: "Wikipedia — Hurt (Nine Inch Nails song)"
        url: "https://en.wikipedia.org/wiki/Hurt_(Nine_Inch_Nails_song)"
  - name: "Floria Sigismondi"
    role: director
    notable_works:
      - "Marilyn Manson — The Beautiful People"
      - "The Cure — The 13th"
      - "David Bowie — Little Wonder"
    sources:
      - label: "Wikipedia — Floria Sigismondi"
        url: "https://en.wikipedia.org/wiki/Floria_Sigismondi"

section_arc:
  - role: establishing
    framing_hint: [wide, full]
    notes: "Konzept-Welt-Anker pro Section, oft surreal komponiert — 1 Shot."
  - role: reveal
    framing_hint: [mcu, ms]
    notes: "Performer im Konzept verankert, oft frontal."
  - role: detail
    framing_hint: [ecu, cu]
    notes: "Symbol-Inserts, Augen, Haende, Texturen."
  - role: cutaway
    framing_hint: [insert]
    notes: "Konzept-Symbole, Objekte als Metaphern."
  - role: resolve
    framing_hint: [ms, full]
    notes: "Rueck zum Performer am Section-Ende."

framing_mix:
  wide_pct: 10
  full_pct: 10
  ms_pct: 20
  mcu_pct: 20
  cu_pct: 20
  ecu_pct: 10
  ots_pct: 0
  pov_pct: 0
  insert_pct: 10
  aerial_pct: 0
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Mark_Romanek"

asl_range:
  min_s: 2.0
  max_s: 8.0
  typical_s: 4.0
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Mark_Romanek"

camera:
  vocabulary:
    - "static hold"
    - "slow push-in"
    - "vertical crane"
    - "controlled slow-mo"
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Mark_Romanek"

lighting:
  description: |
    high-contrast key with deep shadows, often black-and-white or
    desaturated grade; single hard light source; symbolic motivated
    practicals.
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Mark_Romanek"

color:
  description: "Black-and-white or a restrained desaturated grade."
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Mark_Romanek"

craft_signature:
  - technique: "Single hard key"
    directive: "Use one hard motivated key, deep shadows, symbolic practicals, and black-and-white or desaturated grading."
    pipeline_levers: [visual_prompt, bible_look, bible_lighting]
    basis: inferred
    sources:
    - "https://en.wikipedia.org/wiki/Mark_Romanek"
