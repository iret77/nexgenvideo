id: vaporwave-synthwave-retro
name: "Vaporwave / Synthwave — retro-futurism aesthetic"
description: |
  Retro-futuristische 80er-Aesthetik fuer Synthwave und
  Vaporwave-Tracks: Neon-Grid, VHS-Distortion, Memphis-Geometrie,
  3D-gerenderte Objekte, Glitch-Art.
  Vaporwave skewt langsam-melancholisch / Internet-irony,
  Synthwave skewt schnell-heroisch / 80s-action-tribute. Fuer
  retro-elektronische, ambient-elektronische und Internet-Mikrogenre-
  Tracks.

references:
  - name: "Synthwave (visual genre)"
    role: music_video
    notable_works:
      - "Kavinsky — Nightcall (Drive 2011 soundtrack)"
      - "Carpenter Brut — Turbo Killer (2016 video, directed by Seth Ickerman)"
    sources:
      - label: "Wikipedia — Synthwave"
        url: "https://en.wikipedia.org/wiki/Synthwave"
      - label: "IMVDb — Carpenter Brut, Turbo Killer (2016)"
        url: "https://imvdb.com/video/carpenter-brut/turbo-killer"
  - name: "Vaporwave (visual genre)"
    role: music_video
    notable_works:
      - "Macintosh Plus — Floral Shoppe (2011)"
    sources:
      - label: "Wikipedia — Vaporwave"
        url: "https://en.wikipedia.org/wiki/Vaporwave"
      - label: "UC Press JPMS — Reconstructed Nostalgia: Aesthetic Commonalities and Self-Soothing in Chillwave, Synthwave, and Vaporwave"
        url: "https://online.ucpress.edu/jpms/article/33/1/70/116330/Reconstructed-NostalgiaAesthetic-Commonalities-and"

section_arc:
  - role: establishing
    framing_hint: [wide, aerial]
    notes: "Neon-Grid-Landschaft oder Wireframe-3D-Welt-Anker."
  - role: reveal
    framing_hint: [ms, mcu]
    notes: "Performer im neon Setpiece, VHS-tracking overlay."
  - role: detail
    framing_hint: [cu, insert]
    notes: "Glitch-Beat, geometrisches Symbol-Insert (Memphis, Ancient-Sculpture)."
  - role: cutaway
    framing_hint: [insert, pov]
    notes: "VHS-Header, 90s-Web-UI-Mockup, retro-Computer-Screen."

framing_mix:
  wide_pct: 20
  full_pct: 10
  ms_pct: 20
  mcu_pct: 15
  cu_pct: 10
  ecu_pct: 5
  ots_pct: 0
  pov_pct: 5
  insert_pct: 10
  aerial_pct: 5
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Synthwave"

asl_range:
  min_s: 2.0
  max_s: 8.0
  typical_s: 4.0
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Synthwave"

camera:
  vocabulary:
    - "VHS-distorted static hold"
    - "synthwave grid push-forward"
    - "glitch-cut on beat"
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Synthwave"

lighting:
  description: |
    magenta neon glow with gridlines and VHS tracking artefacts
    (synthwave); VHS degradation and glitch art over 1990s web-design
    imagery (vaporwave).
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Synthwave"

color:
  description: "Magenta neon on the synthwave branch; VHS-degraded colour on the vaporwave branch."
  basis: inferred
  sources:
    - "https://en.wikipedia.org/wiki/Synthwave"

craft_signature:
  - technique: "Degraded neon image"
    directive: "Use magenta neon, gridlines, and visible VHS tracking artefacts (synthwave), or VHS degradation and glitch art (vaporwave)."
    pipeline_levers: [visual_prompt, bible_look, bible_lighting]
    basis: inferred
    sources:
    - "https://en.wikipedia.org/wiki/Synthwave"
