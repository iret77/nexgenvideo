id: americana-desert-corbijn-joshua-tree
name: "Americana Desert — Corbijn Joshua-Tree school"
description: |
  Weite, archetypisch-amerikanische Wuesten-Landschaft als emotionaler
  Anker. Vorbild Anton Corbijns Mojave-Fotoshooting fuer U2s The
  Joshua Tree (Dezember 1986), die Wuesten-Kurzfilme der Joshua Tree
  Tour und die seither verbreitete Country-/Indie-Roadmovie-Aesthetik:
  Mojave-Vistas, Death Valley, Twentynine Palms, kleine Motels.
  Performer klein in der Welt, Architektur und Horizont tragen die
  Stimmung. Fuer Country-Rock, Indie-Folk, Americana-Tracks mit
  Roadmovie- oder Sehnsuchts-Bogen.

references:
  - name: "Anton Corbijn (U2 Joshua Tree visual era)"
    role: director
    notable_works:
      - "U2 — The Joshua Tree album photography (December 1986, Mojave Desert and Death Valley: Bodie, Harmony Motel in Twentynine Palms, Zabriskie Point for the cover photograph)"
      - "U2 — Joshua Tree Tour 2017/2019 (Corbijn's short films of desert landscapes, e.g. a slow tracking shot of a desert highway for Where the Streets Have No Name)"
    sources:
      - label: "Wikipedia — The Joshua Tree (album)"
        url: "https://en.wikipedia.org/wiki/The_Joshua_Tree"
      - label: "Wikipedia — The Joshua Tree Tour 2017"
        url: "https://en.wikipedia.org/wiki/The_Joshua_Tree_Tour_2017"
      - label: "uDiscoverMusic — The Joshua Tree: How U2 Became Rock's Hottest Ticket"
        url: "https://www.udiscovermusic.com/stories/u2-the-joshua-tree-album/"
      - label: "Albumism — Rediscover U2's 'The Joshua Tree' (1987)"
        url: "https://albumism.com/features/tribute-celebrating-35-years-of-u2-the-joshua-tree"
  - name: "Mojave and Joshua Tree desert music videos"
    role: music_video
    notable_works:
      - "Selena — Amor Prohibido (1994, Joshua Tree National Park)"
      - "Red Hot Chili Peppers — Give It Away (1991, Mojave Desert, black-and-white images)"
      - "Madonna — Frozen (1998, Cuddeback Lake, Mojave Desert)"
    sources:
      - label: "Alta Journal (Robert Ito, 2022) — desert music videos"
        url: "https://www.altaonline.com/culture/movies-tv-shows/g42125298/desert-music-videos-robert-ito-pop-culture/"

section_arc:
  - role: establishing
    framing_hint: [wide, aerial]
    notes: "Weite Wuesten-/Horizont-Aufnahme, oft mit einem markanten Element (Joshua Tree, Motel, Strommast)."
  - role: reveal
    framing_hint: [ms, mcu]
    notes: "Performer in der Landschaft eingeordnet, Mittel-Distanz."
  - role: detail
    framing_hint: [cu, ecu]
    notes: "Augen, Hand am Gitarrenhals, Sand, Wind-Haare — emotionale Naehe-Beats."
  - role: resolve
    framing_hint: [wide, full]
    notes: "Rueck zur Weite zum Schluss, Subject wieder klein in der Welt."

