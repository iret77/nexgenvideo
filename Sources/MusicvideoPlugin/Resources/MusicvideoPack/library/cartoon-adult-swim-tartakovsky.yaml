lighting:
  description: |
    flat cel-lit with bold outlines and limited colour palette, single
    colour-keyed background per scene, hard cast shadows for dramatic
    beats, deliberate use of black silhouette against bright colour
    fields (Tartakovsky signature).
  basis: inferred
  sources:
    - "https://variety.com/2024/film/global/genndy-tartakovsky-musical-series-1236036232/"

color:
  description: "A limited palette, one colour-keyed background, and black silhouettes against bright fields."
  basis: inferred
  sources:
