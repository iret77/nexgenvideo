id: cartoon-adult-swim-tartakovsky
name: "Cartoon Adult-Swim — Tartakovsky school"
description: |
  Westliche TV-Animation in der Tradition von Genndy Tartakovsky
  (Samurai Jack, Primal): limitierte 2D-Animation mit langen
  Haltepunkten und abrupten Pausen, Action, die wie eine Musiksequenz
  getaktet ist, klare Silhouetten, Kamerapositionen, die die Aktion
  lesbar halten, und kraeftige, nicht-naturalistische Farben.
  Empfohlen fuer Tracks mit cartoonigem, grafisch reduziertem Look.

references:
  - name: "Genndy Tartakovsky"
    role: director
    notable_works:
      - "Samurai Jack (2001-2017)"
      - "Genndy Tartakovsky's Primal (2019-)"
      - "Star Wars: Clone Wars (2003-2005)"
    sources:
      - label: "Rotten Tomatoes Editorial — Primal creator Genndy Tartakovsky revolutionized animated action"
        url: "https://editorial.rottentomatoes.com/article/primal-creator-genndy-tartakovsky-revolutionized-animated-action"
      - label: "Animation Obsessive — The Visual World of 'Samurai Jack'"
        url: "https://animationobsessive.substack.com/p/the-visual-world-of-samurai-jack"
      - label: "Animation Obsessive — How They Painted 'Samurai Jack'"
        url: "https://animationobsessive.substack.com/p/how-they-painted-samurai-jack"
      - label: "Museum of the Moving Image, Sloan Science & Film — Genndy Tartakovsky's Primal: Art Director Scott Wills"
        url: "https://scienceandfilm.org/articles/3346/genndy-tartakovskys-primal-art-director-scott-wills"

section_arc:
  - role: establishing
    framing_hint: [wide, full]
    notes: "Klar komponiertes Establishing — klare Silhouette, oft minimalistisches BG."
  - role: performance
    framing_hint: [ms, mcu]
    notes: "Charakter in Mittel-Distanz, Mimik klar lesbar."
  - role: reveal
    framing_hint: [cu, ecu]
    notes: "Augen-CU als Reaction-Beat, Gag- oder Schock-Pointe."
  - role: cutaway
    framing_hint: [insert, ots]
    notes: "Detail-Insert auf Prop, Sight-Gag oder Subtext-Element."

framing_mix:
  wide_pct: 15
  full_pct: 10
  ms_pct: 25
  mcu_pct: 20
  cu_pct: 15
  ecu_pct: 5
  ots_pct: 5
  pov_pct: 0
  insert_pct: 5
  aerial_pct: 0
  basis: inferred
  sources:
    - "https://editorial.rottentomatoes.com/article/primal-creator-genndy-tartakovsky-revolutionized-animated-action"

asl_range:
  min_s: 1.0
  max_s: 5.0
  typical_s: 2.5
  basis: inferred
  sources:
    - "https://editorial.rottentomatoes.com/article/primal-creator-genndy-tartakovsky-revolutionized-animated-action"

camera:
  vocabulary:
    - "static hold, camera placed where the action reads clearest"
    - "long hold between action beats"
    - "abrupt pause after a quick move"
    - "multi-panel composition for layered action"
  basis: inferred
  sources:
    - "https://editorial.rottentomatoes.com/article/primal-creator-genndy-tartakovsky-revolutionized-animated-action"
    - "https://animationobsessive.substack.com/p/the-visual-world-of-samurai-jack"

lighting:
  description: |
    characters either light against a dark ground or dark against a
    light ground, sometimes reduced to simple silhouettes against a
    single-colour background.
  basis: inferred
  sources:
    - "https://editorial.rottentomatoes.com/article/primal-creator-genndy-tartakovsky-revolutionized-animated-action"
    - "https://animationobsessive.substack.com/p/how-they-painted-samurai-jack"

color:
  description: "Bold, non-naturalistic colour (no green grass, no blue sky), with strong light-against-dark separation between character and ground."
  basis: inferred
  sources:
    - "https://animationobsessive.substack.com/p/the-visual-world-of-samurai-jack"
    - "https://scienceandfilm.org/articles/3346/genndy-tartakovskys-primal-art-director-scott-wills"
    - "https://editorial.rottentomatoes.com/article/primal-creator-genndy-tartakovsky-revolutionized-animated-action"

craft_signature:
  - technique: "Graphic silhouette staging"
    directive: "Stage characters light against dark or dark against light, as simple silhouettes against a single-colour background, in bold non-naturalistic colour."
    pipeline_levers: [visual_prompt, bible_look, bible_lighting]
    basis: inferred
    sources:
    - "https://editorial.rottentomatoes.com/article/primal-creator-genndy-tartakovsky-revolutionized-animated-action"
