id: mtv-80s-mulcahy-mallet
name: "80s MTV — Mulcahy / Mallet / MGMM era"
description: |
  Klassische 80er-MTV-Aesthetik in der Tradition von Russell Mulcahy
  ("Video Killed the Radio Star", Duran Duran-Klassiker) und David
  Mallet (Queen — Bohemian Rhapsody, David Bowie — Ashes to Ashes).
  Schnelle Cuts auf Beat, Tracking-Shots, Neon-Lichter, Wind-bewegte
  Stoffe, Spot-Color-Akzente, faux-widescreen. Empfohlen fuer
  retro-poppige Tracks oder bewusst nostalgische Performance-Konzepte.

references:
  - name: "Russell Mulcahy"
    role: director
    notable_works:
      - "The Buggles — Video Killed the Radio Star (1979, first video aired on MTV)"
      - "Duran Duran — Hungry Like the Wolf (1982)"
      - "Duran Duran — Rio (1982)"
      - "Bonnie Tyler — Total Eclipse of the Heart (1983)"
      - "Kim Carnes — Bette Davis Eyes (1981)"
    sources:
      - label: "Wikipedia — Russell Mulcahy"
        url: "https://en.wikipedia.org/wiki/Russell_Mulcahy"
      - label: "IMVDb — Russell Mulcahy music video credits by year"
        url: "https://imvdb.com/n/russell-mulcahy/videography-by-year"
      - label: "Billboard — Russell Mulcahy & Duran Duran's John Taylor look back on classic videos"
        url: "https://www.billboard.com/articles/news/6296755/russell-mulcahy-duran-duran-john-taylor-classic-videos"
      - label: "Duran Duran official — Director Russell Mulcahy and John Taylor look back"
        url: "https://duranduran.com/2014/director-russell-mulcahy-and-duran-durans-john-taylor-look-back-on-their-classic-music-videos/"
  - name: "David Mallet"
    role: director
    notable_works:
      - "Queen — Bohemian Rhapsody (1975)"
      - "David Bowie — Ashes to Ashes (1980)"
      - "Blondie — Heart of Glass"
      - "AC/DC — Highway to Hell"
    sources:
      - label: "Wikipedia — David Mallet (director)"
        url: "https://en.wikipedia.org/wiki/David_Mallet_(director)"
      - label: "Den of Geek — Video Killed The Radio Star DVD"
        url: "https://www.denofgeek.com/movies/video-killed-the-radio-star-dvd/"

