name: Original qualified bpy source
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-bpy-source
        with:
          directory: ${{ runner.temp }}/qualified-bpy-source
      - uses: actions/upload-artifact@v4
        with:
          name: managed-bpy-source-receipt-${{ github.sha }}
          overwrite: true
          path: ${{ runner.temp }}/qualified-bpy-source/bpy-source-receipt.json
          if-no-files-found: error
          retention-days: 30
