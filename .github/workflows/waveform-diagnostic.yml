name: Waveform diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/waveform-diagnostic.yml
      - Sources/NexGenVideo/Audio/AudioTrackReader.swift
      - Sources/NexGenVideo/Audio/WaveformExtractor.swift
      - Tests/NexGenVideoTests/Audio/WaveformExtractorTests.swift

permissions:
  contents: read

jobs:
  focused:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-xcode-27
      - uses: ./.github/actions/cache-swiftpm-dependencies
      - name: Build tests
        run: swift build --cache-path "$NGV_SWIFTPM_CACHE_PATH" --build-tests
      - name: Run bounded focused tests
        shell: bash
        run: |
          set -uo pipefail
          export NGV_WAVEFORM_DIAGNOSTIC=1
          export SWIFT_BACKTRACE=enable=yes,interactive=no,demangle=yes,cache=no

          run_filter() {
            local filter="$1"
            local label="$2"
            local expected="$3"
            local log="$RUNNER_TEMP/$label.log"

            swift test --cache-path "$NGV_SWIFTPM_CACHE_PATH" --skip-build --filter "$filter" >"$log" 2>&1 &
            local driver=$!
            for _ in {1..45}; do
              if ! kill -0 "$driver" 2>/dev/null; then
                wait "$driver"
                local code=$?
                cat "$log"
                if ! grep -F "$expected" "$log"; then
                  echo "::error::$label filter did not select its expected test"
                  return 1
                fi
                return "$code"
              fi
              sleep 1
            done

            ps -axo pid=,ppid=,state=,etime=,command= >"$RUNNER_TEMP/$label.processes.txt"
            while read -r pid; do
              sample "$pid" 3 -mayDie -file "$RUNNER_TEMP/$label.$pid.sample.txt" || true
            done < <(awk '/NexGenVideoPackageTests|swiftpm-testing/ && !/awk/ {print $1}' "$RUNNER_TEMP/$label.processes.txt")
            pkill -TERM -P "$driver" 2>/dev/null || true
            kill -TERM "$driver" 2>/dev/null || true
            sleep 2
            pkill -KILL -P "$driver" 2>/dev/null || true
            kill -KILL "$driver" 2>/dev/null || true
            wait "$driver" 2>/dev/null || true
            cat "$log"
            echo "::error::$label exceeded 45 seconds"
            return 124
          }

          run_filter 'largeUnknownStreamsStayBounded' accumulator 'large unknown streams stay bounded and preserve peaks'
          run_filter 'monoFastPath' decoder 'already mono at 22050 Hz decodes through the fast path'
          run_filter 'trimmedExtractionFollowsTrackTimebase' trimmed 'trimmed extraction follows the audio track timebase'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waveform-diagnostic
          path: |
            ${{ runner.temp }}/accumulator.*
            ${{ runner.temp }}/decoder.*
            ${{ runner.temp }}/trimmed.*
          if-no-files-found: ignore
          retention-days: 3
