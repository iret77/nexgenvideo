name: Native Acceptance Probes

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Native probes or isolated owned-child and worker-sandbox components
        type: choice
        options: [native, owned-child, worker-sandbox, worker-memory]
        default: native
      owned_child_binary_run_id:
        description: Optional exact retained owned-child diagnostic binary
        type: string
        default: ''
      worker_sandbox_resume:
        description: Resume Python using the verified helper and native evidence from run 40394670788
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: native-acceptance-probes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.scope == 'native'
    runs-on: macrunner
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-xcode-27
      - name: Compile actual audio decoder and standalone accessibility probe
        run: |
          set -euo pipefail
          PROBE_BUILD="$RUNNER_TEMP/native-probes"
          mkdir -p "$PROBE_BUILD"
          xcrun swiftc -parse-as-library -swift-version 6 -target arm64-apple-macos26.0 \
            -module-name NexGenEngine -emit-module -emit-module-path "$PROBE_BUILD/NexGenEngine.swiftmodule" \
            -emit-object Engine/Sources/NexGenEngine/Audio/PCM.swift -o "$PROBE_BUILD/PCM.o"
          xcrun swiftc -parse-as-library -swift-version 6 -target arm64-apple-macos26.0 \
            -I "$PROBE_BUILD" "$PROBE_BUILD/PCM.o" Sources/NexGenVideo/Audio/AVFoundationAudioDecoder.swift \
            scripts/audio_decoder_probe.swift -o "$PROBE_BUILD/audio-decoder-probe"
          xcrun swiftc -parse-as-library -swift-version 6 -target arm64-apple-macos26.0 \
            scripts/storyboard_accessibility_probe.swift -o "$PROBE_BUILD/storyboard-accessibility-probe"
          tar -czf "$RUNNER_TEMP/native-probes.tar.gz" -C "$PROBE_BUILD" audio-decoder-probe storyboard-accessibility-probe
      - uses: actions/upload-artifact@v4
        with:
          name: native-acceptance-probes-binaries
          path: ${{ runner.temp }}/native-probes.tar.gz
          if-no-files-found: error
          retention-days: 1

  probe:
    needs: build
    # ci-lint: allow-CI005 Isolated audio and accessibility diagnosis on the macOS 26 production floor.
    runs-on: macos-26
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-acceptance-probes-binaries
          path: ${{ runner.temp }}
      - name: Require the production runtime and restore probes
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          tar -xzf "$RUNNER_TEMP/native-probes.tar.gz" -C "$RUNNER_TEMP"
      - name: Measure exact decoder duration and final audio
        id: audio
        continue-on-error: true
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          root = Path(os.environ["RUNNER_TEMP"])
          with (root / "audio-decoder-probe.log").open("w") as log:
              result = subprocess.run([str(root / "audio-decoder-probe"), str(root / "audio-decoder-probe.json")],
                                      stdin=subprocess.DEVNULL, stdout=log, stderr=log, timeout=60, check=False)
          raise SystemExit(result.returncode)
          PYTHON
      - name: Measure storyboard accessibility extraction
        id: accessibility
        continue-on-error: true
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          root = Path(os.environ["RUNNER_TEMP"])
          with (root / "storyboard-accessibility-probe.log").open("w") as log:
              result = subprocess.run([str(root / "storyboard-accessibility-probe"), str(root / "storyboard-accessibility-probe.json")],
                                      stdin=subprocess.DEVNULL, stdout=log, stderr=log, timeout=60, check=False)
          raise SystemExit(result.returncode)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-probes-evidence
          path: |
            ${{ runner.temp }}/audio-decoder-probe.json
            ${{ runner.temp }}/audio-decoder-probe.log
            ${{ runner.temp }}/storyboard-accessibility-probe.json
            ${{ runner.temp }}/storyboard-accessibility-probe.log
            ${{ runner.temp }}/storyboard-probe-*.png
          if-no-files-found: error
          retention-days: 3
      - name: Require both probe steps to complete
        if: always()
        env:
          AUDIO_OUTCOME: ${{ steps.audio.outcome }}
          ACCESSIBILITY_OUTCOME: ${{ steps.accessibility.outcome }}
        run: test "$AUDIO_OUTCOME" = success && test "$ACCESSIBILITY_OUTCOME" = success

  owned-child:
    if: inputs.scope == 'owned-child'
    runs-on: macrunner
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve the original interpreter before selection
        run: |
          mkdir -p "$RUNNER_TEMP/owned-child"
          python3 -I - <<'PY' > "$RUNNER_TEMP/owned-child/original-python.json"
          import json, os, shutil, sys
          required = ('waitid', 'P_PID', 'WEXITED', 'WNOHANG', 'WNOWAIT', 'CLD_EXITED')
          print(json.dumps({'executable': sys.executable, 'version': sys.version,
                            'pathSelection': shutil.which('python3'),
                            'interfaces': {key: hasattr(os, key) for key in required}}))
          PY
      - uses: ./.github/actions/setup-native-test-python
      - uses: ./.github/actions/setup-xcode-27
      - name: Verify output capture on the failed producer platform
        if: inputs.owned_child_binary_run_id == ''
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_run_macos_tests.py -v 2>&1 \
            | tee "$RUNNER_TEMP/owned-child/capture-tests.log"
      - name: Compile reviewed owned-child implementation and diagnostic
        if: inputs.owned_child_binary_run_id == ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/owned-child"
          xcrun clang -std=c11 -Wall -Wextra -Werror -target arm64-apple-macos26.0 \
            -I Sources/BpySupervisorPOSIX/include \
            Sources/BpySupervisorPOSIX/OwnedChild.c scripts/bpy_owned_child_probe.c \
            -lproc -o "$RUNNER_TEMP/owned-child/probe"
      - name: Verify retained binary and original capture evidence
        if: inputs.owned_child_binary_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.owned_child_binary_run_id }}
        run: |
          python3 scripts/resume_bpy_owned_child_probe.py --run-id "$ORIGINAL_RUN" \
            --output "$RUNNER_TEMP/owned-child"
      - name: Record exact source, environment and signal lifecycle
        run: |
          python3 scripts/run_bpy_owned_child_probe.py "$RUNNER_TEMP/owned-child"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-child-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/owned-child
            ${{ runner.temp }}/native-test-python.json
          if-no-files-found: error
          retention-days: 7

  sandbox-source:
    if: inputs.scope == 'worker-sandbox' || inputs.scope == 'worker-memory'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Refuse replayed component attempts
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify isolated component provenance checks
        run: python3 -m unittest discover -s scripts -p 'test_bpy_worker_*probe.py' -v
      - name: Bind the original successful app producer
        env:
          GH_TOKEN: ${{ github.token }}
          NGV_SANDBOX_RESUME_PYTHON: ${{ inputs.worker_sandbox_resume }}
          NGV_SANDBOX_MEMORY_PROBE: ${{ inputs.scope == 'worker-memory' }}
        run: python3 scripts/bpy_worker_sandbox_probe.py bind --output "$RUNNER_TEMP/sandbox-identity"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-sandbox-identity
          path: ${{ runner.temp }}/sandbox-identity
          if-no-files-found: error
          retention-days: 30

  sandbox-build:
    if: inputs.scope == 'worker-sandbox' && !inputs.worker_sandbox_resume
    needs: sandbox-source
    runs-on: macrunner
    timeout-minutes: 3
    steps:
      - name: Refuse replayed component attempts
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@v4
      - name: Compile only the isolated native component probe
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sandbox-binaries"
          xcodebuild -version | tee "$RUNNER_TEMP/sandbox-binaries/xcode.log"
          test "$(xcodebuild -version | awk 'NR == 1 {split($2,v,"."); print v[1]}')" -ge 27
          xcrun clang --version | tee "$RUNNER_TEMP/sandbox-binaries/clang.log"
          xcrun clang -std=c11 -Wall -Wextra -Werror -target arm64-apple-macos26.0 \
            scripts/bpy_worker_sandbox_probe.c -o "$RUNNER_TEMP/sandbox-binaries/probe"
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/sandbox-binaries/probe"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "sandbox-binaries"
          receipt = {"sourceSHA": os.environ["GITHUB_SHA"],
              "execution": {"runID": int(os.environ["GITHUB_RUN_ID"]), "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"])},
              "binarySHA256": hashlib.sha256((root / "probe").read_bytes()).hexdigest(),
              "probeSourceSHA256": hashlib.sha256(Path("scripts/bpy_worker_sandbox_probe.c").read_bytes()).hexdigest()}
          (root / "build.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: worker-sandbox-binaries
          path: ${{ runner.temp }}/sandbox-binaries
          if-no-files-found: error
          retention-days: 30

  sandbox-runtime:
    if: >-
      ${{ !cancelled() && needs.sandbox-source.result == 'success' &&
      (needs.sandbox-build.result == 'success' ||
      (inputs.worker_sandbox_resume && needs.sandbox-build.result == 'skipped')) }}
    needs: [sandbox-source, sandbox-build]
    # ci-lint: allow-CI005 Prove the isolated worker policy on the macOS 26 product floor.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Refuse replayed component attempts
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: worker-sandbox-identity
          path: sandbox-identity
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.worker_sandbox_resume }}
        with:
          name: worker-sandbox-binaries
          path: sandbox-binaries
      - name: Exercise native controls and real bpy in the isolated worker fixture
        env:
          GH_TOKEN: ${{ github.token }}
          NGV_SANDBOX_RESUME_PYTHON: ${{ inputs.worker_sandbox_resume }}
          NGV_SANDBOX_MEMORY_PROBE: ${{ inputs.scope == 'worker-memory' }}
        run: |
          set -euo pipefail
          binaries=sandbox-binaries
          if test "$NGV_SANDBOX_RESUME_PYTHON" = true; then
            binaries=sandbox-identity/retained-binaries
          fi
          chmod +x "$binaries/probe"
          python3 scripts/bpy_worker_sandbox_probe.py observe --identity sandbox-identity \
            --binaries "$binaries" --output "$RUNNER_TEMP/worker-sandbox"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-sandbox-component-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/worker-sandbox/*.json
            ${{ runner.temp }}/worker-sandbox/*.log
            ${{ runner.temp }}/worker-sandbox/failed-original-app.zip
            ${{ runner.temp }}/worker-sandbox/python-sandbox/result.json
            ${{ runner.temp }}/worker-sandbox/python-sandbox/render.png
            ${{ runner.temp }}/worker-sandbox/python-sandbox/scene.blend
            ${{ runner.temp }}/worker-sandbox/python-control/result.json
            ${{ runner.temp }}/worker-sandbox/python-control/render.png
            ${{ runner.temp }}/worker-sandbox/python-control/scene.blend
            sandbox-binaries/build.json
            sandbox-binaries/*.log
            sandbox-identity/retained-binaries/build.json
          if-no-files-found: error
          retention-days: 30
