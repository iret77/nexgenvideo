name: Managed bpy runtime acceptance

on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: true
      app_zip:
        type: string
        required: true
      distribution:
        type: boolean
        required: true
      runtime_run_id:
        type: string
        default: ''
      expected_source_sha:
        type: string
        default: ''
      app_artifact_id:
        type: string
        default: ''
      app_artifact_sha256:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    runs-on: macrunner
    timeout-minutes: 43
    steps:
      - name: Reserve time for failure diagnostics and evidence upload
        run: echo "NGV_BPY_DIAGNOSTIC_DEADLINE=$(( $(date +%s) + 27 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Validate original app selectors
        env:
          ORIGINAL_RUN: ${{ inputs.runtime_run_id }}
          ORIGINAL_SOURCE: ${{ inputs.expected_source_sha }}
          ORIGINAL_ARTIFACT: ${{ inputs.app_artifact_id }}
          ORIGINAL_DIGEST: ${{ inputs.app_artifact_sha256 }}
          DISTRIBUTION: ${{ inputs.distribution }}
        run: |
          set -euo pipefail
          if [ -z "$ORIGINAL_RUN" ]; then
            test -z "$ORIGINAL_SOURCE$ORIGINAL_ARTIFACT$ORIGINAL_DIGEST"
          else
            test "$DISTRIBUTION" = false
            [[ "$ORIGINAL_RUN" =~ ^[1-9][0-9]*$ ]]
            [[ "$ORIGINAL_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$ORIGINAL_ARTIFACT" =~ ^[1-9][0-9]*$ ]]
            [[ "$ORIGINAL_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          fi
      - name: Record original App and current harness provenance
        env:
          APP_SOURCE: ${{ inputs.expected_source_sha || github.sha }}
          PRODUCER_RUN: ${{ inputs.runtime_run_id || github.run_id }}
          ORIGINAL_ARTIFACT: ${{ inputs.app_artifact_id }}
          ORIGINAL_DIGEST: ${{ inputs.app_artifact_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'evidence'
          output.mkdir(parents=True, exist_ok=True)
          paths = ['scripts/bpy_runtime_acceptance.py', 'scripts/run_macos_tests.py',
                   'scripts/app_host_zombie_diagnostic.py', 'scripts/verify_swift_test_output.py',
                   'scripts/reuse_bpy_binary_evidence.py', 'scripts/pinned_download.py',
                   '.github/workflows/bpy-runtime-acceptance.yml']
          if os.environ['ORIGINAL_ARTIFACT']:
              paths.append('scripts/bpy_metal_diagnostic.py')
          value = dict(schema='nexgenvideo/bpy-execution-provenance/1',
              appSourceSHA=os.environ['APP_SOURCE'], harnessSHA=os.environ['GITHUB_SHA'],
              producerRunID=int(os.environ['PRODUCER_RUN']), executionRunID=int(os.environ['GITHUB_RUN_ID']),
              executionAttempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
              originalArtifactID=os.environ['ORIGINAL_ARTIFACT'], originalArtifactSHA256=os.environ['ORIGINAL_DIGEST'],
              harnessFiles={p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths})
          (output / 'execution-provenance.json').write_text(json.dumps(value, sort_keys=True) + '\n')
          PY
      - uses: actions/download-artifact@v4
        if: inputs.runtime_run_id == ''
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/download
      - name: Retrieve the bound original CI app
        if: inputs.runtime_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.runtime_run_id }}
          ORIGINAL_SOURCE: ${{ inputs.expected_source_sha }}
          ORIGINAL_NAME: ${{ inputs.artifact }}
          ORIGINAL_ARTIFACT: ${{ inputs.app_artifact_id }}
          ORIGINAL_DIGEST: ${{ inputs.app_artifact_sha256 }}
        run: |
          set -euo pipefail
          [[ "$ORIGINAL_ARTIFACT" =~ ^[1-9][0-9]*$ ]]
          [[ "$ORIGINAL_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from reuse_bpy_binary_evidence import api, download
          identifier = int(os.environ['ORIGINAL_ARTIFACT'])
          artifact = api('/actions/artifacts/' + str(identifier))
          origin = artifact.get('workflow_run', {})
          if (artifact.get('id') != identifier or artifact.get('name') != os.environ['ORIGINAL_NAME']
              or artifact.get('expired') is not False
              or artifact.get('digest') != 'sha256:' + os.environ['ORIGINAL_DIGEST']
              or origin.get('id') != int(os.environ['ORIGINAL_RUN'])
              or origin.get('head_sha') != os.environ['ORIGINAL_SOURCE']):
              raise ValueError('Original App artifact identity changed before transfer')
          download(artifact, Path(os.environ['RUNNER_TEMP']) / 'original-app.zip')
          PY
          ditto -x -k "$RUNNER_TEMP/original-app.zip" "$RUNNER_TEMP/download"
      - uses: actions/download-artifact@v4
        if: inputs.runtime_run_id == ''
        with:
          name: managed-bpy-source-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/source
      - uses: ./.github/actions/prepare-bpy-source
        if: inputs.runtime_run_id == ''
        with:
          directory: ${{ runner.temp }}/source
          receipt: ${{ runner.temp }}/source/bpy-source-receipt.json
      - name: Prepare qualified source for the original CI app
        if: inputs.runtime_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_SOURCE: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/consume_bpy_distributable_source.py \
            --output-directory "$RUNNER_TEMP/source" --source-sha "$ORIGINAL_SOURCE" \
            --receipt "$RUNNER_TEMP/download/bpy-source/bpy-source-receipt.json"
      - name: Relocate the exact app and prepare denied resources
        env:
          APP_ZIP: ${{ inputs.app_zip }}
          DISTRIBUTION: ${{ inputs.distribution }}
          EXPECTED_SOURCE: ${{ inputs.expected_source_sha || github.sha }}
        run: |
          set -euo pipefail
          [ "$(sw_vers -productVersion | cut -d. -f1)" -ge 26 ]
          [ "$(uname -m)" = arm64 ]
          mkdir -p "$RUNNER_TEMP/relocated" "$RUNNER_TEMP/denied/foreign-project" \
            "$RUNNER_TEMP/fake-bin" "$RUNNER_TEMP/approved-input"
          ditto -x -k "$RUNNER_TEMP/download/$APP_ZIP" "$RUNNER_TEMP/relocated"
          APP="$RUNNER_TEMP/relocated/NexGenVideo.app"
          codesign --verify --strict --verbose=2 "$APP"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NGVSourceCommit' "$APP/Contents/Info.plist")" = "$EXPECTED_SOURCE" ]
          if [ "$DISTRIBUTION" = true ]; then
            scripts/verify_bpy_bundle.sh "$APP" --distribution
            xcrun stapler validate "$APP"
            spctl -a -vvv -t exec "$APP"
          else
            scripts/verify_bpy_bundle.sh "$APP" --development
          fi
          python3 scripts/verify_bpy_distributable_source.py \
            "$RUNNER_TEMP/source/NexGenVideo-bpy-5.2.2-corresponding-source.tar" \
            "$RUNNER_TEMP/source/NexGenVideo-bpy-5.2.2-corresponding-source.manifest.json"
          printf 'provider-secret' > "$RUNNER_TEMP/denied/provider-secret"
          printf 'canonical-project-truth' > "$RUNNER_TEMP/denied/canonical-artifact"
          printf 'foreign-project' > "$RUNNER_TEMP/denied/foreign-project/scene.blend"
          printf 'host-home-secret' > "$HOME/ngv-bpy-host-home-secret"
          printf '{"approved":true}' > "$RUNNER_TEMP/approved-input/fixture.json"
          ln -s "$RUNNER_TEMP/denied/provider-secret" "$RUNNER_TEMP/approved-input/symlink.json"
          printf 'hardlink' > "$RUNNER_TEMP/approved-input/hardlink-source"
          ln "$RUNNER_TEMP/approved-input/hardlink-source" "$RUNNER_TEMP/approved-input/hardlink.json"
          printf '#!/bin/sh\nexit 99\n' > "$RUNNER_TEMP/fake-bin/python3"
          printf '#!/bin/sh\nexit 99\n' > "$RUNNER_TEMP/fake-bin/blender"
          chmod +x "$RUNNER_TEMP/fake-bin/python3" "$RUNNER_TEMP/fake-bin/blender"
      - name: Capture the exact scene outside the sandbox as diagnostic evidence
        if: ${{ inputs.runtime_run_id != '' && inputs.app_artifact_id != '' }}
        timeout-minutes: 4
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/relocated/NexGenVideo.app"
          CONTROL="$RUNNER_TEMP/evidence/unconfined-metal-control"
          control=
          finish_control() {
            result=$?
            trap - EXIT INT TERM
            for attempt in {1..100}; do
              remaining=0
              pgrep -f "$APP/Contents/(MacOS/NexGenVideo($| )|XPCServices/NexGenVideoBpyService[01]\.xpc/Contents/(MacOS/NexGenVideoBpySupervisor|Resources/BpyRuntime/python))|$CONTROL" \
                > "$RUNNER_TEMP/evidence/control-residual-processes.log" || remaining=$?
              [ "$remaining" -eq 0 ] || break
              sleep 0.1
            done
            [ "$remaining" -eq 1 ] || result=1
            codesign --verify --deep --strict "$APP" \
              > "$RUNNER_TEMP/evidence/control-signature-after.log" 2>&1 || result=1
            exit "$result"
          }
          cancel_control() {
            code=$1
            trap - INT TERM
            if [ -n "$control" ]; then
              kill -TERM "$control" 2>/dev/null || true
              wait "$control" || true
            fi
            exit "$code"
          }
          trap finish_control EXIT
          trap 'cancel_control 130' INT
          trap 'cancel_control 143' TERM
          status=0
          pgrep -f "$RUNNER_TEMP/relocated/NexGenVideo.app/Contents/(MacOS/NexGenVideo($| )|XPCServices/NexGenVideoBpyService[01]\.xpc/Contents/(MacOS/NexGenVideoBpySupervisor|Resources/BpyRuntime/python))" \
            > "$RUNNER_TEMP/evidence/original-processes-before-control.log" || status=$?
          [ "$status" -eq 1 ]
          before=0
          codesign --verify --deep --strict "$APP" \
            > "$RUNNER_TEMP/evidence/control-signature-before.log" 2>&1 || before=$?
          printf '%s\n' "$before" > "$RUNNER_TEMP/evidence/control-signature-before.status"
          python3 - <<'PY' > "$RUNNER_TEMP/evidence/control-source-fetch.log" 2>&1 &
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from bpy_metal_diagnostic import prefetch_source
          prefetch_source(os.environ['EXPECTED_SOURCE'], Path(os.environ['RUNNER_TEMP']) / 'metal-control-source.json')
          PY
          control=$!
          wait "$control"
          control=
          "$APP/Contents/XPCServices/NexGenVideoBpyService0.xpc/Contents/Resources/BpyRuntime/python/bin/python3.13" \
            -I -B -S scripts/bpy_metal_diagnostic.py "$APP" --source-sha "$EXPECTED_SOURCE" \
            --source-input "$RUNNER_TEMP/metal-control-source.json" --output "$CONTROL" \
            < /dev/null > "$RUNNER_TEMP/evidence/control-supervisor.log" 2>&1 &
          control=$!
          wait "$control"
          control=
      - name: Prove deterministic deletion during native directory accounting
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source_sha || github.sha }}
        run: |
          python3 scripts/bpy_directory_scan_acceptance.py "$RUNNER_TEMP/relocated/NexGenVideo.app" \
            --source-sha "$EXPECTED_SOURCE" --output "$RUNNER_TEMP/evidence/directory-deletion"
      - name: Prove pre-lease and post-exec host-crash cleanup
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source_sha || github.sha }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/relocated/NexGenVideo.app"
          mkdir -p "$RUNNER_TEMP/evidence"
          for mode in before-authorization after-authorization; do
            status=0
            python3 scripts/bpy_runtime_acceptance.py "$APP" --mode "$mode" \
              --capture-open-logs \
              --source-sha "$EXPECTED_SOURCE" --deadline "$NGV_BPY_DIAGNOSTIC_DEADLINE" \
              --output "$RUNNER_TEMP/evidence/host-crash-$mode" || status=$?
            if pgrep -fl '/usr/bin/log stream.*open-diagnostic'; then
              echo "orphan open diagnostic capture after $mode" >&2
              exit 1
            fi
            for _ in $(seq 1 200); do
              if ! pgrep -f "$APP/Contents/XPCServices/NexGenVideoBpyService[01]\.xpc/Contents/(MacOS/NexGenVideoBpySupervisor|Resources/BpyRuntime/python)" >/dev/null; then
                break
              fi
              sleep 0.05
            done
            if pgrep -f "$APP/Contents/XPCServices/NexGenVideoBpyService[01]\.xpc/Contents/(MacOS/NexGenVideoBpySupervisor|Resources/BpyRuntime/python)" >/dev/null; then
              echo "orphan bpy process after $mode" >&2
              exit 1
            fi
            [ "$status" -eq 0 ]
          done
      - name: Prepare the independent retained Bible YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/panorama-parser"
          "$RUNNER_TEMP/panorama-parser/bin/python" -m pip install --quiet PyYAML==6.0.3
      - name: Run real bpy acceptance without ambient Blender or Python
        id: native
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source_sha || github.sha }}
          NGV_BPY_CAPTURE_SANDBOX_LOGS: ${{ inputs.app_artifact_id != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/relocated/NexGenVideo.app"
          EVIDENCE="$RUNNER_TEMP/evidence"
          mkdir -p "$EVIDENCE"
          DENIED="$(jq -cn \
            --arg secret "$RUNNER_TEMP/denied/provider-secret" \
            --arg canonical "$RUNNER_TEMP/denied/canonical-artifact" \
            --arg foreign "$RUNNER_TEMP/denied/foreign-project/scene.blend" \
            --arg home "$HOME/ngv-bpy-host-home-secret" \
            '[$secret,$canonical,$foreign,$home]')"
          system_profiler SPHardwareDataType > "$EVIDENCE/hardware.txt"
          sw_vers > "$EVIDENCE/os.txt"
          uname -v > "$EVIDENCE/kernel.txt"
          before="$(pgrep -f 'BpyRuntime/python' || true)"
          [ -z "$before" ]
          PYTHON="$(command -v python3)"
          /usr/bin/time -l env \
            PATH="$RUNNER_TEMP/fake-bin" \
            BLENDER_USER_CONFIG="$RUNNER_TEMP/denied/foreign-blender" \
            PYTHONPATH="$RUNNER_TEMP/denied/foreign-python" \
            NGV_TEST_SECRET="must-not-cross-xpc" \
            NGV_BPY_DENIED_PATHS="$DENIED" \
            NGV_BPY_APPROVED_INPUT_DIR="$RUNNER_TEMP/approved-input" \
            NGV_SELFTEST_BPY="$EVIDENCE" \
            "$PYTHON" -I scripts/bpy_runtime_acceptance.py "$APP" --mode runtime \
            --capture-open-logs \
            --source-sha "$EXPECTED_SOURCE" --deadline "$NGV_BPY_DIAGNOSTIC_DEADLINE" \
            --output "$EVIDENCE" < /dev/null \
            > "$EVIDENCE/runtime-supervisor.log" 2> "$EVIDENCE/time.txt"
          grep -q SELFTEST_BPY_OK "$EVIDENCE/runtime.log"
          jq -e --arg app "$APP" --arg foreign "$RUNNER_TEMP/denied/foreign-blender" '
            .schema == "nexgenvideo/bpy-runtime-acceptance/2"
            and .python == "3.13.15"
            and .bpy == "5.2.2"
            and .coldStartSeconds > 0
            and .serviceColdStartSeconds > 0
            and .warmJobSeconds > 0
            and .hostJobSeconds > 0
            and .hostPeakMemoryBytes > 0
            and .jobMetrics.job_wall_seconds > 0
            and .jobMetrics.worker_wall_seconds > 0
            and .jobMetrics.verification_seconds > 0
            and .jobMetrics.worker_peak_memory_bytes > 0
            and .jobMetrics.verifier_peak_memory_bytes > 0
            and .jobMetrics.service_peak_memory_bytes > 0
            and .jobMetrics.disk_peak_bytes > 0
            and .jobMetrics.file_peak_count > 0
            and .jobMetrics.descendant_peak_count == 0
            and .jobMetrics.worker_process_identifier != .jobMetrics.verifier_process_identifier
            and .jobMetrics.autoexec_positive_control == 1
            and .jobMetrics.vertices > 8
            and .jobMetrics.polygons > 6
            and .duplicateJoined == true
            and .changedDuplicateRejected == true
            and .failedOpenReleased == true
            and .closeBeforeOpenReleased == true
            and .forgedResultState == "timedOut"
            and .cancelState == "cancelled"
            and .transportTimeoutRecovered == true
            and .memoryPolicyVersion == "system-pressure-v1"
            and .memoryPolicy.schema == "nexgenvideo/bpy-memory-policy-evidence/3"
            and .structuralLimitState == "resourceLimited"
            and .renderOnlyGeometryState == "resourceLimited"
            and .secondarySceneGeometryState == "resourceLimited"
            and .prefixedUserGeometryState == "resourceLimited"
            and .zeroEffectiveResolutionState == "resourceLimited"
            and .noEnabledViewLayerState == "resourceLimited"
            and .storageLimitState == "resourceLimited"
            and .spatialAuthoring.glbImport == true
            and .spatialAuthoring.quaternionKeyframes == true
            and .spatialAuthoring.viewedFrameEdit == true
            and .spatialAuthoring.cameraDimensions == true
            and .spatialAuthoring.stableRestFrame == true
            and .spatialAuthoring.resourceReceipt == true
            and .spatialAuthoring.preCancelledCallerReceiptRejected == true
            and .spatialAuthoring.preCancelledCallerDerivationRejected == true
            and .spatialAuthoring.preCancelledCallerSequenceRejected == true
            and .reapedRecovery.file == "native-reaped-recovery.json"
            and .spatialAuthoring.resolvedStatePixels == true
            and .spatialAuthoring.fractionalTimebaseMovie == true
            and .spatialAuthoring.derivationAuthentication == true
            and .spatialAuthoring.completeShotSequence == true
            and .spatialAuthoring.partialLastFrame == true
            and .spatialAuthoring.sequenceTamperingRejected == true
            and .spatialAuthoring.sequenceDiscardRevokes == true
            and .spatialAuthoring.sequenceExtraChunkRejected == true
            and .spatialAuthoring.evaluatedDeformationBounds == true
            and .storageRecovery.bootIdentityRead == true
            and .storageRecovery.normalHelperCompletion == true
            and .storageRecovery.staleHelperRejected == true
            and .storageRecovery.journalLockEnforced == true
            and .storageRecovery.crashedHelperRetained == true
            and .storageRecovery.ancestorSymlinkRejected == true
            and .storageRecovery.leafSymlinkRejected == true
            and .storageRecovery.regularFileRejected == true
            and .storageRecovery.searchOnlyAncestorOpened == true
            and .productionSpatial.nativeSceneAndCamera == true
            and .productionSpatial.storyboardNativeDerivation == true
            and .productionSpatial.completeShotState == true
            and .productionSpatial.fullShotClayAndDistinctEndpoints == true
            and .productionSpatial.biblePreviewAndAssignment == true
            and .productionSpatial.staleBibleRejected == true
            and .productionSpatial.changedBibleProofRejected == true
            and .productionSpatial.savedProjectReopened == true
            and .productionSpatial.promotion.nativeSpatialProofGraphAdmitted == true
            and .productionSpatial.promotion.neutralSpatialRejectedAsAppearance == true
            and .productionSpatial.promotion.neutralSpatialReferenceGeometryOnly == true
            and .productionSpatial.referencePurpose.nativeGeometryAccepted == true
            and .productionSpatial.referencePurpose.nativeAppearanceRejected == true
            and .productionSpatial.referencePurpose.copiedAppearanceRejected == true
            and .productionSpatial.referencePurpose.copiedGeometryAccepted == true
            and .productionSpatial.referencePurpose.duplicateViewAliasRejected == true
            and [.productionSpatial.nativeStoryboardUI[].scale] == [1, 1.25, 1.5]
            and all(.productionSpatial.nativeStoryboardUI[];
              .viewport == [960, 640] and .sourceFilePanel == true
              and .sourcePreviewAndAssignment == true and .changedTimeRevokesPreview == true
              and .sourcePreparedCancelUnchanged == true and .sourceStaleAssignmentUnchanged == true
              and .externalPreviewAndAssignment == true and .nativeImageInspection == true
              and .filePanelCancel == true and .preparedCancelUnchanged == true
              and .staleAssignmentUnchanged == true
              and (.screenshots | length) >= 10 and (.interactions | length) > 20)
            and [.productionSpatial.nativeBibleUI[].scale] == [1, 1.25, 1.5]
            and all(.productionSpatial.nativeClayUI[]; .cancelDuringHash == true and .closeDuringLoading == true)
            and all(.productionSpatial.nativeBibleUI[];
              .viewport == [960, 640] and .nativeSceneAndCameraSelection == true
              and .requiredPurpose == true and .realRenderedPreview == true
              and .nativeImageInspection == true and .exactPreviewAssigned == true
              and .preparedCancelUnchanged == true and .staleAssignmentUnchanged == true
              and .reloadAndAssign == true and .cancelDuringHash == true and .closeDuringLoading == true
              and (.screenshots | length) >= 10 and (.interactions | length) > 20)
            and ([.physicalStorage[].mode] | sort) == ["fileport", "memory-entry", "scm-rights"]
            and all(.physicalStorage[];
              .capacityBytes > 0 and .capacityBytes <= 67108864
              and .filledBytes > 0 and .filledBytes <= .capacityBytes
              and .retainedBytes == 4194304 and .storageErrno == 28
              and (.retentionDeniedErrno == 0 or
                   (.mode != "memory-entry" and (.retentionDeniedErrno == 1 or .retentionDeniedErrno == 13))))
            and .aggregateByteLimitState == "resourceLimited"
            and .unlinkedStorageLimitState == "resourceLimited"
            and .renameChurnStorageLimitState == "resourceLimited"
            and .healthyResourceChurnState == "awaitingConfirmation"
            and .resourceScanErrorState == "crashed"
            and .containerSiblingWriteDenied == true
            and .supervisorSignalDenied == true
            and .supervisorSignalRecovered == true
            and .supervisorIdentityWriteFailureState == "failed"
            and .supervisorIdentityWriteFailureRecovered == true
            and .supervisorIdentityCaptureFailureState == "failed"
            and .supervisorIdentityCaptureFailureRecovered == true
            and .resourceSupervisorRecovered == true
            and .crashState == "crashed"
            and .serviceRecoveryRevision == "revision-e"
            and .parentDeathJobFailedClosed == true
            and .execveOrphanReaped == true
            and .threeRealDocuments == true
            and .thirdDocumentInitiallyDenied == true
            and .slotReusedAfterClose == true
            and .appTerminationJobStarted == true
            and .appDelegateShutdown == true
            and .operationPresentationLifetime == true
            and .overlappingPresentations == true
            and .operationDocumentClose == true
            and .operationLastRelease == true
            and .operationShutdown == true
            and (.probeA | type == "number") and .probeA > 1
            and (.probeB | type == "number") and .probeB > 1 and .probeA != .probeB
            and (.serviceA | type == "number") and .serviceA > 1
            and (.serviceB | type == "number") and .serviceB > 1 and .serviceA != .serviceB
            and (.deniedPositiveControls | length) >= 3
            and all(.deniedPositiveControls[]; .bytes > 0)
            and .trustedVerification.secretEnvironmentAbsent == true
            and .trustedVerification.autorunTextPresent == true
            and .trustedVerification.autorunMarkerAbsent == true
            and .trustedVerification.blenderBuildHash == "d13f752e3b9c"
            and .trustedVerification.libraryVersions.alembic.version == [1, 8, 3]
            and .trustedVerification.libraryVersions.ocio.version == [2, 5, 0]
            and .trustedVerification.libraryVersions.oiio.version == [3, 1, 13]
            and .trustedVerification.libraryVersions.opensubdiv.version == [3, 7, 0]
            and .trustedVerification.libraryVersions.openvdb.version == [13, 0, 0]
            and .trustedVerification.libraryVersions.usd.version == [0, 26, 3]
            and (.trustedVerification.modifiers.NGV_Room | index("BEVEL")) != null
            and (.trustedVerification.executable | startswith($app + "/"))
            and (.trustedVerification.bpyModule | startswith($app + "/"))
            and .trustedVerification.blenderUserConfig != $foreign
            and (.trustedVerification.networkDenied.denied == true)
            and (.trustedVerification.networkDenied.errno == 1 or .trustedVerification.networkDenied.errno == 13)
            and all(.trustedVerification.deniedPaths[]; .denied == true and (.errno == 1 or .errno == 13))
            and any(.trustedVerification.scenes[]; .engine == "CYCLES" and (.cyclesDevice == "GPU" or .cyclesDevice == "CPU"))
          ' "$EVIDENCE/result.json"
          python3 scripts/production_spatial_ui_evidence.py "$EVIDENCE"
          "$RUNNER_TEMP/panorama-parser/bin/python" scripts/retained_spatial_evidence.py "$EVIDENCE"
          python3 scripts/spatial_evaluated_geometry_evidence.py "$EVIDENCE" --runtime-root "$APP/Contents/XPCServices/NexGenVideoBpyService0.xpc/Contents/Resources/BpyRuntime"
          python3 scripts/bpy_protocol_evidence.py "$EVIDENCE" --app "$APP"
          python3 scripts/bpy_worker_evidence.py "$EVIDENCE"
          test -s "$EVIDENCE/perspective.png"
          for artifact in production-spatial-storyboard.png production-spatial-start.png \
            production-spatial-end.png production-spatial-shot.mov \
            production-spatial-shot-proof.json production-spatial-bible.png; do
            test -s "$EVIDENCE/$artifact"
          done
          while IFS= read -r artifact; do
            [[ -n "$artifact" && "$artifact" != */* && "$artifact" != .* ]]
            test -f "$EVIDENCE/$artifact"
            test -s "$EVIDENCE/$artifact"
          done < <(jq -r '.productionSpatial | (.nativeStoryboardUI + .nativeBibleUI)[] | .screenshots[], .progress' "$EVIDENCE/result.json")
          [ "$(sips -g pixelWidth "$EVIDENCE/perspective.png" | awk '/pixelWidth/{print $2}')" = 640 ]
          [ "$(sips -g pixelHeight "$EVIDENCE/perspective.png" | awk '/pixelHeight/{print $2}')" = 360 ]
          for attempt in {1..20}; do
            pgrep -f 'BpyRuntime/python' > /dev/null || break
            sleep 0.1
          done
          after="$(pgrep -f 'BpyRuntime/python' || true)"
          [ -z "$after" ] || { echo "orphan bpy workers: $after"; exit 1; }
          du -sk "$APP" > "$EVIDENCE/app-size-kib.txt"
      - name: Prove both sandbox boundary slots using an explicitly derived fixture
        timeout-minutes: 12
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source_sha || github.sha }}
        run: |
          python3 scripts/bpy_boundary_acceptance.py "$RUNNER_TEMP/relocated/NexGenVideo.app" \
            --source-sha "$EXPECTED_SOURCE" --output "$RUNNER_TEMP/evidence/boundary"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.runtime_run_id != '' && format('managed-bpy-original-app-diagnostic-{0}-harness-{1}', inputs.expected_source_sha, github.sha) || format('managed-bpy-runtime-evidence-{0}', github.sha) }}
          overwrite: true
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 90
