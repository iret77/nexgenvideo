name: Managed bpy Runtime Acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit to accept
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bpy-runtime-acceptance-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Bind source and require distributable runtime before macOS allocation
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]
          python3 scripts/verify_bpy_runtime.py --distribution
          python3 -m unittest \
            scripts.test_verify_bpy_runtime \
            scripts.test_bpy_runtime_workflow
          OUTPUT="$RUNNER_TEMP/bpy-source-closure"
          python3 scripts/assemble_bpy_source_closure.py --output-directory "$OUTPUT"
          python3 scripts/verify_bpy_source_closure.py \
            "$OUTPUT/NexGenVideo-bpy-5.2.2-corresponding-source.tar" \
            "$OUTPUT/NexGenVideo-bpy-5.2.2-corresponding-source.manifest.json" \
            --require-distributable
          [ "$(sha256sum "$OUTPUT/NexGenVideo-bpy-5.2.2-corresponding-source.tar" | awk '{print $1}')" = \
            "$(jq -r .distributionClosure.publicSourceAsset.sha256 Runtime/bpy/runtime-lock.json)" ]
          [ "$(stat -c %s "$OUTPUT/NexGenVideo-bpy-5.2.2-corresponding-source.tar")" = \
            "$(jq -r .distributionClosure.publicSourceAsset.size Runtime/bpy/runtime-lock.json)" ]
          [ "$(sha256sum "$OUTPUT/NexGenVideo-bpy-5.2.2-corresponding-source.manifest.json" | awk '{print $1}')" = \
            "$(jq -r .distributionClosure.publicSourceAsset.manifestSHA256 Runtime/bpy/runtime-lock.json)" ]
      - uses: actions/upload-artifact@v4
        with:
          name: managed-bpy-source-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/bpy-source-closure/*
          if-no-files-found: error
          retention-days: 7

  build:
    needs: source
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/setup-xcode-27
      - uses: ./.github/actions/cache-swiftpm-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: managed-bpy-source-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/bpy-source-closure
      - name: Import existing Developer ID identity
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/bpy-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/"//g')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/{print $2; exit}')"
          [ -n "$IDENTITY" ]
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare existing notary key
        env:
          NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID_VALUE: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_VALUE: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "NOTARY_KEY_FILE=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID_VALUE"
            echo "NOTARY_ISSUER=$NOTARY_ISSUER_VALUE"
          } >> "$GITHUB_ENV"
      - name: Build and unit-test on xcode-27
        run: |
          set -euo pipefail
          swift build --cache-path "$NGV_SWIFTPM_CACHE_PATH" --build-tests
          scripts/stage_test_runtime.sh debug
          swift test --cache-path "$NGV_SWIFTPM_CACHE_PATH" --skip-build
      - name: Assemble and sign the pinned managed runtime
        run: |
          set -euo pipefail
          scripts/stage_bpy_runtime.sh "$RUNNER_TEMP/bpy-runtime"
          NGV_BPY_RUNTIME_ROOT="$RUNNER_TEMP/bpy-runtime" scripts/bundle.sh release --sign
          scripts/verify_bpy_bundle.sh .build/NexGenVideo.app
      - name: Verify nested identities and the OS sandbox contract
        run: |
          set -euo pipefail
          APP=.build/NexGenVideo.app
          PYTHON="$APP/Contents/Helpers/BpyRuntime/python/bin/python3.13"
          SUPERVISOR="$APP/Contents/Helpers/NexGenVideoBpySupervisor"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$PYTHON" > "$RUNNER_TEMP/python-entitlements.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$RUNNER_TEMP/python-entitlements.plist")" = true ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.inherit' "$RUNNER_TEMP/python-entitlements.plist")" = true ]
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$RUNNER_TEMP/python-entitlements.plist"
          codesign --verify --strict --verbose=2 "$SUPERVISOR"
          codesign -d --entitlements :- "$SUPERVISOR" > "$RUNNER_TEMP/supervisor-entitlements.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$RUNNER_TEMP/supervisor-entitlements.plist")" = true ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.inherit' "$RUNNER_TEMP/supervisor-entitlements.plist")" = true ]
          for slot in 0 1; do
            XPC="$APP/Contents/XPCServices/NexGenVideoBpyService$slot.xpc"
            ENTITLEMENTS="$RUNNER_TEMP/xpc-entitlements-$slot.plist"
            codesign --verify --strict --verbose=2 "$XPC"
            codesign -d --entitlements :- "$XPC" > "$ENTITLEMENTS"
            [ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$ENTITLEMENTS")" = true ]
            ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$ENTITLEMENTS"
          done
          test ! -e "$APP/Contents/Helpers/BpyRuntime/python/bin/pip"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/NexGenVideo-bpy.zip"
          scripts/notarize.sh "$RUNNER_TEMP/NexGenVideo-bpy.zip"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/NexGenVideo-bpy-notarized.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: managed-bpy-notarized-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/NexGenVideo-bpy-notarized.zip
            ${{ runner.temp }}/bpy-source-closure/NexGenVideo-bpy-5.2.2-corresponding-source.tar
            ${{ runner.temp }}/bpy-source-closure/NexGenVideo-bpy-5.2.2-corresponding-source.manifest.json
          if-no-files-found: error
          retention-days: 7

  runtime:
    needs: build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: managed-bpy-notarized-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/download
      - name: Relocate the notarized app and prepare denied resources
        run: |
          set -euo pipefail
          [ "$(sw_vers -productVersion | cut -d. -f1)" = 26 ]
          [ "$(uname -m)" = arm64 ]
          mkdir -p "$RUNNER_TEMP/relocated" "$RUNNER_TEMP/denied/foreign-project" \
            "$RUNNER_TEMP/fake-bin" "$RUNNER_TEMP/approved-input"
          ditto -x -k "$RUNNER_TEMP/download/NexGenVideo-bpy-notarized.zip" "$RUNNER_TEMP/relocated"
          APP="$RUNNER_TEMP/relocated/NexGenVideo.app"
          codesign --verify --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vvv -t exec "$APP"
          printf 'provider-secret' > "$RUNNER_TEMP/denied/provider-secret"
          printf 'canonical-project-truth' > "$RUNNER_TEMP/denied/canonical-artifact"
          printf 'foreign-project' > "$RUNNER_TEMP/denied/foreign-project/scene.blend"
          printf 'host-home-secret' > "$HOME/ngv-bpy-host-home-secret"
          printf '{"approved":true}' > "$RUNNER_TEMP/approved-input/fixture.json"
          ln -s "$RUNNER_TEMP/denied/provider-secret" "$RUNNER_TEMP/approved-input/symlink.json"
          printf 'hardlink' > "$RUNNER_TEMP/approved-input/hardlink-source"
          ln "$RUNNER_TEMP/approved-input/hardlink-source" "$RUNNER_TEMP/approved-input/hardlink.json"
          printf '#!/bin/sh\nexit 99\n' > "$RUNNER_TEMP/fake-bin/python3"
          printf '#!/bin/sh\nexit 99\n' > "$RUNNER_TEMP/fake-bin/blender"
          chmod +x "$RUNNER_TEMP/fake-bin/python3" "$RUNNER_TEMP/fake-bin/blender"
      - name: Prove pre-lease and post-exec host-crash cleanup
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/relocated/NexGenVideo.app"
          mkdir -p "$RUNNER_TEMP/evidence"
          for mode in before-authorization after-authorization; do
            set +e
            env NGV_SELFTEST_BPY_HOST_CRASH="$mode" \
              "$APP/Contents/MacOS/NexGenVideo" \
              > "$RUNNER_TEMP/evidence/host-crash-$mode.log" 2>&1
            status=$?
            set -e
            [ "$status" -ne 0 ]
            for _ in $(seq 1 200); do
              if ! pgrep -f "$APP/Contents/Helpers/NexGenVideoBpySupervisor|$APP/Contents/Helpers/BpyRuntime/python" >/dev/null; then
                break
              fi
              sleep 0.05
            done
            ! pgrep -f "$APP/Contents/Helpers/NexGenVideoBpySupervisor|$APP/Contents/Helpers/BpyRuntime/python" >/dev/null
          done
      - name: Run real bpy acceptance without ambient Blender or Python
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/relocated/NexGenVideo.app"
          EVIDENCE="$RUNNER_TEMP/evidence"
          mkdir -p "$EVIDENCE"
          DENIED="$(jq -cn \
            --arg secret "$RUNNER_TEMP/denied/provider-secret" \
            --arg canonical "$RUNNER_TEMP/denied/canonical-artifact" \
            --arg foreign "$RUNNER_TEMP/denied/foreign-project/scene.blend" \
            --arg home "$HOME/ngv-bpy-host-home-secret" \
            '[$secret,$canonical,$foreign,$home]')"
          system_profiler SPHardwareDataType > "$EVIDENCE/hardware.txt"
          sw_vers > "$EVIDENCE/os.txt"
          before="$(pgrep -f 'BpyRuntime/python' || true)"
          [ -z "$before" ]
          /usr/bin/time -l env \
            PATH="$RUNNER_TEMP/fake-bin" \
            BLENDER_USER_CONFIG="$RUNNER_TEMP/denied/foreign-blender" \
            PYTHONPATH="$RUNNER_TEMP/denied/foreign-python" \
            NGV_TEST_SECRET="must-not-cross-xpc" \
            NGV_BPY_DENIED_PATHS="$DENIED" \
            NGV_BPY_APPROVED_INPUT_DIR="$RUNNER_TEMP/approved-input" \
            NGV_SELFTEST_BPY="$EVIDENCE" \
            "$APP/Contents/MacOS/NexGenVideo" \
            > "$EVIDENCE/runtime.log" 2> "$EVIDENCE/time.txt"
          grep -q SELFTEST_BPY_OK "$EVIDENCE/runtime.log"
          jq -e --arg app "$APP" --arg foreign "$RUNNER_TEMP/denied/foreign-blender" '
            .schema == "nexgenvideo/bpy-runtime-acceptance/2"
            and .python == "3.13.15"
            and .bpy == "5.2.2"
            and .coldStartSeconds > 0
            and .serviceColdStartSeconds > 0
            and .warmJobSeconds > 0
            and .hostJobSeconds > 0
            and .hostPeakMemoryBytes > 0
            and .jobMetrics.job_wall_seconds > 0
            and .jobMetrics.worker_wall_seconds > 0
            and .jobMetrics.verification_seconds > 0
            and .jobMetrics.worker_peak_memory_bytes > 0
            and .jobMetrics.verifier_peak_memory_bytes > 0
            and .jobMetrics.service_peak_memory_bytes > 0
            and .jobMetrics.disk_peak_bytes > 0
            and .jobMetrics.file_peak_count > 0
            and .jobMetrics.descendant_peak_count == 0
            and .jobMetrics.worker_process_identifier != .jobMetrics.verifier_process_identifier
            and .jobMetrics.autoexec_positive_control == 1
            and .jobMetrics.vertices > 8
            and .jobMetrics.polygons > 6
            and .duplicateJoined == true
            and .changedDuplicateRejected == true
            and .failedOpenReleased == true
            and .closeBeforeOpenReleased == true
            and .forgedResultState == "timedOut"
            and .cancelState == "cancelled"
            and .rlimitASAllocationDenied == true
            and .outOfMemoryState == "resourceLimited"
            and .structuralLimitState == "resourceLimited"
            and .storageLimitState == "resourceLimited"
            and .aggregateByteLimitState == "resourceLimited"
            and .resourceScanErrorState == "crashed"
            and .containerSiblingWriteDenied == true
            and .supervisorSignalDenied == true
            and .supervisorSignalRecovered == true
            and .supervisorIdentityWriteFailureState == "failed"
            and .supervisorIdentityWriteFailureRecovered == true
            and .resourceSupervisorRecovered == true
            and .crashState == "crashed"
            and .serviceRecoveryRevision == "revision-e"
            and .parentDeathJobFailedClosed == true
            and .execveOrphanReaped == true
            and .threeRealDocuments == true
            and .thirdDocumentInitiallyDenied == true
            and .slotReusedAfterClose == true
            and .appTerminationJobStarted == true
            and .appDelegateShutdown == true
            and .probeA != .probeB
            and .serviceA != .serviceB
            and (.deniedPositiveControls | length) >= 3
            and all(.deniedPositiveControls[]; .bytes > 0)
            and .trustedVerification.secretEnvironmentAbsent == true
            and .trustedVerification.autorunTextPresent == true
            and .trustedVerification.autorunMarkerAbsent == true
            and .trustedVerification.blenderBuildHash == "d13f752e3b9c"
            and .trustedVerification.libraryVersions.alembic.version == [1, 8, 3]
            and .trustedVerification.libraryVersions.ocio.version == [2, 5, 0]
            and .trustedVerification.libraryVersions.oiio.version == [3, 1, 13]
            and .trustedVerification.libraryVersions.opensubdiv.version == [3, 7, 0]
            and .trustedVerification.libraryVersions.openvdb.version == [13, 0, 0]
            and .trustedVerification.libraryVersions.usd.version == [0, 26, 3]
            and (.trustedVerification.modifiers.NGV_Room | index("BEVEL")) != null
            and (.trustedVerification.executable | startswith($app + "/"))
            and (.trustedVerification.bpyModule | startswith($app + "/"))
            and .trustedVerification.blenderUserConfig != $foreign
            and (.trustedVerification.sessionRoot as $session | .trustedVerification.blenderUserConfig | startswith($session + "/"))
            and (.trustedVerification.networkDenied.denied == true)
            and (.trustedVerification.networkDenied.errno == 1 or .trustedVerification.networkDenied.errno == 13)
            and all(.trustedVerification.deniedPaths[]; .denied == true and (.errno == 1 or .errno == 13))
            and any(.trustedVerification.scenes[]; .engine == "CYCLES" and (.cyclesDevice == "GPU" or .cyclesDevice == "CPU"))
          ' "$EVIDENCE/result.json"
          test -s "$EVIDENCE/perspective.png"
          [ "$(sips -g pixelWidth "$EVIDENCE/perspective.png" | awk '/pixelWidth/{print $2}')" = 640 ]
          [ "$(sips -g pixelHeight "$EVIDENCE/perspective.png" | awk '/pixelHeight/{print $2}')" = 360 ]
          sleep 2
          after="$(pgrep -f 'BpyRuntime/python' || true)"
          [ -z "$after" ] || { echo "orphan bpy workers: $after"; exit 1; }
          du -sk "$APP" > "$EVIDENCE/app-size-kib.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-bpy-runtime-evidence-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 90
