name: PR Checks

# Light checks for every pull request. No trigger-level paths filter: this is the required check.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light_checks:
    # Must match the required status check and ci.yml's source_gate job name.
    name: Light Checks
    # ci-lint: allow-CI006 Only owner PRs from this repository use an ephemeral Mac. All external contributors require approval.
    # ci-lint: allow-CI008 This bounded source check qualifies the RC merge tree on the requested Mac.
    runs-on: ${{ github.event_name == 'pull_request' && github.actor == 'iret77' && github.repository == 'iret77/nexgenvideo' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'iret77/rc-delivery-base-795' && 'macrunner' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-macos-source
        if: runner.os == 'macOS'
      - uses: ./.github/actions/setup-xcode-27
        if: runner.os == 'macOS'
      - name: Enforce AppTheme
        id: app_theme
        run: python3 scripts/lint_app_theme.py

      - name: Validate pack pipeline contracts
        id: pipeline_contracts
        run: |
          for manifest in plugins/*.json; do
            python3 scripts/validate_pipeline_contract.py "$manifest"
          done

      - name: Prepare the job-local temporary test home
        run: mkdir -p "$RUNNER_TEMP/nexgenvideo-test-home"
      - name: Typecheck the scene desktop observer
        if: runner.os == 'macOS' && github.head_ref == 'iret77/rc-142-scene-desktop'
        env:
          HOME: ${{ runner.temp }}/nexgenvideo-test-home
        run: xcrun swiftc -typecheck scripts/scene_desktop_observer.swift

      - name: Verify CI and fixture tooling
        id: fixture_tooling
        env:
          HOME: ${{ runner.temp }}/nexgenvideo-test-home
          CFFIXED_USER_HOME: ${{ runner.temp }}/nexgenvideo-test-home
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Record verified source checkout
        uses: ./.github/actions/record-source-checks
        with:
          step-results: |
            {
              "Enforce AppTheme": {"outcome": "${{ steps.app_theme.outcome }}", "conclusion": "${{ steps.app_theme.conclusion }}"},
              "Validate pack pipeline contracts": {"outcome": "${{ steps.pipeline_contracts.outcome }}", "conclusion": "${{ steps.pipeline_contracts.conclusion }}"},
              "Verify CI and fixture tooling": {"outcome": "${{ steps.fixture_tooling.outcome }}", "conclusion": "${{ steps.fixture_tooling.conclusion }}"}
            }

      - name: Upload verified source checkout
        uses: actions/upload-artifact@v4
        with:
          name: verified-pr-source-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-source-checks
          if-no-files-found: error
          retention-days: 14
