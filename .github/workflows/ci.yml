name: CI

# PRs only — NOT `push: branches:[main]`. A merge of an up-to-date PR produces a commit whose CONTENT
# the PR run already proved green, so re-running on main billed every change twice for no new signal.
# macOS runners cost 10x, so that second run was ~100 quota-minutes each time. Re-add only if main can
# receive commits that never went through a PR.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_changes:
    name: Classify Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify pull request paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          changed_paths="$RUNNER_TEMP/ci-changed-paths"
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_paths"

          code_changed=false
          changed_count=0
          while IFS= read -r -d '' path; do
            changed_count=$((changed_count + 1))
            case "$path" in
              docs/*|*.md) ;;
              *) code_changed=true ;;
            esac
          done < "$changed_paths"

          if [[ "$changed_count" -eq 0 ]]; then
            echo "::warning::No changed paths found; running the full CI fail-safe"
            code_changed=true
          fi

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

  source_gate:
    name: Source Gate
    needs: classify_changes
    if: needs.classify_changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Enforce AppTheme
        run: python3 scripts/lint_app_theme.py

      - name: Validate musicvideo pipeline contract
        run: python3 scripts/validate_pipeline_contract.py plugins/musicvideo.json

      - name: Verify private fixture bundle tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Render Agent UI specification
        run: python3 scripts/render_agent_chat_spec.py --output "$RUNNER_TEMP/agent-chat-spec"

      - name: Upload Agent UI render evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-chat-spec-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-chat-spec
          if-no-files-found: error
          retention-days: 14

  build_test:
    name: Build & Test
    needs: [classify_changes, source_gate]
    if: needs.classify_changes.outputs.code_changed == 'true' && needs.source_gate.result == 'success'
    # Xcode 27 compiles the macOS 26 product and its availability-gated macOS 27 adapter.
    runs-on: xcode-27
    # Real runs take ~5.5 min. This is a COST CEILING, not a budget: a hung job on a 10x-billed macOS
    # runner burns the timeout in quota minutes, so keep it just far enough above the real duration.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - uses: ./.github/actions/setup-xcode-27

      - uses: ./.github/actions/cache-swiftpm-dependencies

      - name: Build
        run: swift build --build-tests

      - name: Stage test runtime inputs
        run: scripts/stage_test_runtime.sh debug

      - name: Test
        shell: bash
        run: |
          set +e  # GitHub's default `-e` would abort on the first failing attempt; we handle codes below.
          # macOS-runner SIGSEGV/SIGTRAP crashes here were traced (via SWIFT_BACKTRACE) to CODE traps, not the
          # environment: an integer-overflow trap in BICStructure (t - Int.min) and a slow lazy-global init
          # (PackKnowledge.packRoot) that starved the pool under concurrent first-touch — both fixed in the
          # sources. The "CoreData: Failed to create NSXPCConnection" line the retry keys on is benign noise
          # (present in passing runs too), NOT the cause. Retry + backtrace stay as a cheap backstop (exits
          # on first success, costs nothing when green) for the runner's rarer genuine XPC flake and to pin
          # any future trap. Full coverage is kept — nothing is skipped.
          export SWIFT_BACKTRACE=enable=yes,interactive=no,demangle=yes,cache=no
          attempts=3
          for i in $(seq 1 "$attempts"); do
            echo "::group::swift test (attempt $i/$attempts)"
            swift test --skip-build 2>&1 | tee "test-attempt-$i.log"
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              echo "swift test passed on attempt $i"
              exit 0
            fi
            if grep -qE "✘ Test|recorded an issue|Time limit was exceeded|Library not loaded|couldn.t be loaded|Failed to open test bundle" "test-attempt-$i.log"; then
              echo "::error::Real test failure on attempt $i — not retrying"
              exit "$code"
            fi
            if grep -q "unexpected signal code" "test-attempt-$i.log"; then
              echo "::warning::Environmental test-process crash on attempt $i — retrying"
              continue
            fi
            echo "::error::Real test failure on attempt $i (exit $code); not an environmental crash — not retrying"
            exit "$code"
          done
          echo "::error::swift test hit the environmental crash on all $attempts attempts"
          exit 1

      - name: Verify tests did not mutate tracked source
        run: scripts/verify_tracked_source_state.sh

  merge_gate:
    name: Merge Gate
    needs: [classify_changes, source_gate, build_test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the applicable CI jobs
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify_changes.result }}
          CODE_CHANGED: ${{ needs.classify_changes.outputs.code_changed }}
          SOURCE_GATE_RESULT: ${{ needs.source_gate.result }}
          BUILD_TEST_RESULT: ${{ needs.build_test.result }}
        run: |
          set -euo pipefail

          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "::error::Change classification did not succeed ($CLASSIFY_RESULT)"
            exit 1
          fi

          if [[ "$CODE_CHANGED" == "false" ]]; then
            if [[ "$SOURCE_GATE_RESULT" != "skipped" || "$BUILD_TEST_RESULT" != "skipped" ]]; then
              echo "::error::Documentation-only CI ran an unexpected job"
              exit 1
            fi
            echo "Documentation-only pull request; macOS CI was not allocated."
            exit 0
          fi

          if [[ "$CODE_CHANGED" != "true" ]]; then
            echo "::error::Change classification returned an invalid value"
            exit 1
          fi

          if [[ "$SOURCE_GATE_RESULT" != "success" ]]; then
            echo "::error::Source Gate did not succeed ($SOURCE_GATE_RESULT)"
            exit 1
          fi

          if [[ "$BUILD_TEST_RESULT" != "success" ]]; then
            echo "::error::Build & Test did not succeed ($BUILD_TEST_RESULT)"
            exit 1
          fi

          echo "All required CI jobs succeeded."
