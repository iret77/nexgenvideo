name: CI

on:
  # Heavy jobs: started only by ci-batch.yml or a manual dispatch, never by a push or pull request.
  workflow_dispatch:
    inputs:
      metadata_version:
        description: "Verify metadata against an existing signed release transaction"
        type: string
        default: ''
  workflow_call:
    inputs:
      completed_app_tests_run_id:
        type: string
        default: ''
      completed_backends_run_id:
        type: string
        default: ''
      completed_full_core_run_id:
        type: string
        default: ''
      app_inventory_run_id:
        type: string
        default: ''
      completed_source_checks_run_id:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source_gate:
    # Same name as the pull-request check, so a dispatched run also satisfies the required check.
    name: Light Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_required: ${{ steps.classify.outputs.build_required }}
      bundle_required: ${{ steps.classify.outputs.bundle_required }}
      ui_required: ${{ steps.classify.outputs.ui_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release metadata shortcut
        id: metadata
        if: github.event_name == 'workflow_dispatch' && inputs.metadata_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          METADATA_VERSION: ${{ inputs.metadata_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$METADATA_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 1
          [[ "$GITHUB_REF_NAME" == "release/v${METADATA_VERSION}-metadata" ]] || exit 1
          transaction_dir="$(mktemp -d)"
          gh release download plugins --repo iret77/nexgenvideo \
            --pattern "release-${METADATA_VERSION}.transaction.json" --dir "$transaction_dir"
          verified="$(python3 scripts/verify_ci_release_metadata.py \
            --transaction "$transaction_dir/release-${METADATA_VERSION}.transaction.json" \
            --version "$METADATA_VERSION" --head "$GITHUB_SHA")"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

      - name: Bind successful source checks from the original full Linux run
        if: inputs.completed_source_checks_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_SOURCE_RUN: ${{ inputs.completed_source_checks_run_id }}
        run: |
          python3 scripts/resume_core_source_checks.py prepare --run-id "$ORIGINAL_SOURCE_RUN" \
            --evidence "$RUNNER_TEMP/core-source-resume"

      - name: Bind original full Core before reconstructing its bundle
        if: inputs.completed_full_core_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_FULL_CORE_RUN: ${{ inputs.completed_full_core_run_id }}
        run: |
          python3 scripts/resume_core_bundle.py prepare --run-id "$ORIGINAL_FULL_CORE_RUN" \
            --evidence "$RUNNER_TEMP/core-full-resume"

      - name: Bind completed Core backends before allocating Mac jobs
        if: inputs.completed_backends_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_CORE_RUN: ${{ inputs.completed_backends_run_id }}
          APP_INVENTORY_RUN: ${{ inputs.app_inventory_run_id }}
        run: |
          python3 scripts/resume_core_tests.py prepare --run-id "$ORIGINAL_CORE_RUN" \
            --inventory-run-id "$APP_INVENTORY_RUN" \
            --evidence "$RUNNER_TEMP/core-backend-resume"

      - name: Transfer original completed backend evidence
        if: inputs.completed_backends_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: core-backend-resume-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-backend-resume
          if-no-files-found: error
          retention-days: 14

      - name: Bind completed backends from the pinned App assertion failure
        if: inputs.completed_app_tests_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_ASSERTION_RUN: ${{ inputs.completed_app_tests_run_id }}
        run: |
          python3 scripts/resume_core_app_assertions.py prepare --run-id "$ORIGINAL_ASSERTION_RUN" \
            --evidence "$RUNNER_TEMP/core-app-assertion-resume"

      - name: Transfer original App assertion evidence
        if: inputs.completed_app_tests_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: core-app-assertion-resume-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-app-assertion-resume
          if-no-files-found: error
          retention-days: 14

      - name: Classify changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          METADATA_VERIFIED: ${{ steps.metadata.outputs.verified || 'false' }}
        run: python3 scripts/ci_changes.py --base "$BASE_SHA" --head "$HEAD_SHA" --metadata-verified "$METADATA_VERIFIED"

      - name: Require distributable bpy before app transfer
        if: steps.classify.outputs.bundle_required == 'true' && inputs.completed_source_checks_run_id == '' && inputs.completed_full_core_run_id == ''
        run: python3 scripts/verify_bpy_runtime.py --distribution

      - name: Enforce AppTheme
        if: steps.classify.outputs.build_required == 'true' && inputs.completed_source_checks_run_id == '' && inputs.completed_full_core_run_id == ''
        run: python3 scripts/lint_app_theme.py

      - name: Validate pack pipeline contracts
        if: steps.classify.outputs.build_required == 'true' && inputs.completed_source_checks_run_id == '' && inputs.completed_full_core_run_id == ''
        run: |
          for manifest in plugins/*.json; do
            python3 scripts/validate_pipeline_contract.py "$manifest"
          done

      - name: Verify CI and fixture tooling
        if: (steps.classify.outputs.build_required == 'true' || steps.classify.outputs.ui_required == 'true') && inputs.completed_source_checks_run_id == ''
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify all Core branches remain required
        if: inputs.completed_full_core_run_id != ''
        env:
          BUILD_REQUIRED: ${{ steps.classify.outputs.build_required }}
          BUNDLE_REQUIRED: ${{ steps.classify.outputs.bundle_required }}
          UI_REQUIRED: ${{ steps.classify.outputs.ui_required }}
        run: |
          python3 scripts/resume_core_bundle.py verify --evidence "$RUNNER_TEMP/core-full-resume" \
            --plan "$BUILD_REQUIRED" "$BUNDLE_REQUIRED" "$UI_REQUIRED"

      - name: Transfer original full Core proofs
        if: inputs.completed_full_core_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: core-full-resume-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-full-resume
          if-no-files-found: error
          retention-days: 14

      - name: Complete changed source and workflow checks
        if: (steps.classify.outputs.build_required == 'true' || steps.classify.outputs.ui_required == 'true') && inputs.completed_source_checks_run_id != ''
        run: python3 scripts/resume_core_source_checks.py run --evidence "$RUNNER_TEMP/core-source-resume"

      - name: Upload source check composition
        if: always() && inputs.completed_source_checks_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: core-source-completion-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-source-resume
          if-no-files-found: error
          retention-days: 14

  ui_render:
    name: Agent UI Evidence
    needs: source_gate
    if: needs.source_gate.outputs.ui_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: inputs.completed_full_core_run_id != ''
        with:
          name: core-full-resume-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-full-resume
      - name: Verify original unchanged Agent UI evidence
        if: inputs.completed_full_core_run_id != ''
        run: python3 scripts/resume_core_bundle.py verify --evidence "$RUNNER_TEMP/core-full-resume"
      - name: Render Agent UI specification
        if: inputs.completed_full_core_run_id == ''
        run: |
          python3 scripts/render_agent_chat_spec.py --output "$RUNNER_TEMP/agent-chat-spec"
          python3 scripts/render_generation_batch_review_spec.py --output "$RUNNER_TEMP/agent-chat-spec"
          python3 scripts/render_workbench_reference.py --output "$RUNNER_TEMP/workbench-reference"
      - name: Upload Agent UI render evidence
        if: inputs.completed_full_core_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-chat-spec-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agent-chat-spec
            ${{ runner.temp }}/workbench-reference/*.png
            ${{ runner.temp }}/workbench-reference/reference.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Agent UI renderer diagnostics
        if: always() && inputs.completed_full_core_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-ui-render-diagnostics-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/agent-chat-spec/diagnostics
            ${{ runner.temp }}/agent-chat-spec/*.png
            ${{ runner.temp }}/workbench-reference/diagnostics
            ${{ runner.temp }}/workbench-reference/*.png
          if-no-files-found: error
          retention-days: 14

  bpy-source:
    needs: source_gate
    if: needs.source_gate.outputs.bundle_required == 'true'
    uses: ./.github/workflows/bpy-qualified-source.yml

  build_test:
    name: Build & Test
    needs: [source_gate, bpy-source]
    if: ${{ !cancelled() && needs.source_gate.result == 'success' && needs.source_gate.outputs.build_required == 'true' && (needs.bpy-source.result == 'success' || needs.bpy-source.result == 'skipped') }}
    # Xcode 27 compiles the macOS 26 product and its availability-gated macOS 27 adapter.
    runs-on: macrunner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-native-test-python
      - name: Show toolchain
        run: swift --version

      - uses: ./.github/actions/setup-xcode-27

      - uses: actions/download-artifact@v4
        if: inputs.completed_full_core_run_id != ''
        with:
          name: core-full-resume-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-full-resume

      - name: Verify original full tests and exact reconstruction toolchain
        if: inputs.completed_full_core_run_id != ''
        run: python3 scripts/resume_core_bundle.py verify --native --evidence "$RUNNER_TEMP/core-full-resume"

      - uses: actions/download-artifact@v4
        if: inputs.completed_backends_run_id != ''
        with:
          name: core-backend-resume-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-backend-resume

      - name: Verify retained backends against this checkout and native toolchain
        if: inputs.completed_backends_run_id != ''
        run: python3 scripts/resume_core_tests.py verify --evidence "$RUNNER_TEMP/core-backend-resume"

      - uses: actions/download-artifact@v4
        if: inputs.completed_app_tests_run_id != ''
        with:
          name: core-app-assertion-resume-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-app-assertion-resume

      - name: Verify assertion continuation source and platform
        if: inputs.completed_app_tests_run_id != ''
        run: python3 scripts/resume_core_app_assertions.py verify --evidence "$RUNNER_TEMP/core-app-assertion-resume"

      - uses: ./.github/actions/cache-swiftpm-dependencies
        id: swiftpm_dependencies
        with:
          restore-only: 'true'

      - name: Verify native app signing with nested runtime content
        if: inputs.completed_backends_run_id == '' && inputs.completed_full_core_run_id == '' && inputs.completed_app_tests_run_id == ''
        timeout-minutes: 5
        run: python3 -m unittest discover -s scripts -p test_sign_app.py -v

      - name: Build
        id: build
        timeout-minutes: 40
        run: swift build --cache-path "$NGV_SWIFTPM_CACHE_PATH" --build-tests

      - name: Verify build did not mutate tracked source
        run: scripts/verify_tracked_source_state.sh

      - name: Save resolved dependencies after successful build
        if: ${{ success() && steps.build.outcome == 'success' && steps.swiftpm_dependencies.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.swiftpm_dependencies.outputs.cache-path }}
          key: ${{ steps.swiftpm_dependencies.outputs.cache-primary-key }}

      - uses: actions/download-artifact@v4
        if: needs.source_gate.outputs.bundle_required == 'true'
        with:
          name: managed-bpy-source-receipt-${{ github.sha }}
          path: .build/bpy-source
      - name: Check source transfer disk headroom
        if: needs.source_gate.outputs.bundle_required == 'true'
        run: |
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          public = json.loads(Path('Runtime/bpy/runtime-lock.json').read_text())['distributionClosure']['publicSourceAsset']
          required = public['size'] + public['producer']['artifactSize'] + 16 * 1024 * 1024
          free = {key: shutil.disk_usage(os.environ[key]).free for key in ('RUNNER_TEMP', 'GITHUB_WORKSPACE')}
          print(json.dumps({'requiredSourceTransferBytes': required, 'availableBytes': free}))
          if min(free.values()) < required:
              raise SystemExit('Insufficient space for the pinned source archive and extracted pair')
          PY
      - uses: ./.github/actions/prepare-bpy-source
        if: needs.source_gate.outputs.bundle_required == 'true'
        timeout-minutes: 30
        with:
          directory: .build/bpy-source
          receipt: .build/bpy-source/bpy-source-receipt.json

      - name: Stage test runtime inputs
        if: inputs.completed_full_core_run_id == '' || inputs.completed_full_core_run_id == '40265902971'
        run: scripts/stage_test_runtime.sh debug

      - name: Test
        if: inputs.completed_full_core_run_id == ''
        timeout-minutes: 30
        env:
          NGV_BLOCKOUT_ORIENTATION_EVIDENCE_DIR: ${{ runner.temp }}/blockout-orientation-evidence
          NGV_COMPLETED_BACKENDS: ${{ inputs.completed_backends_run_id }}
          NGV_APP_ASSERTIONS: ${{ inputs.completed_app_tests_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          export SWIFT_BACKTRACE=enable=yes,interactive=no,demangle=yes,cache=no
          if [ -n "${NGV_APP_ASSERTIONS:-}" ]; then
            python3 scripts/capture_render_review_test_diagnostic.py \
              --evidence "$RUNNER_TEMP/render-review-test-diagnostic" --log test.log \
              --swift-testing-runs 1 --xctest-runs 0 --without-runloop-probe \
              --app-assertion-resume "$RUNNER_TEMP/core-app-assertion-resume" -- \
              python3 scripts/run_macos_tests.py --cache-path "$NGV_SWIFTPM_CACHE_PATH" \
                --scope app-swift-testing --evidence "$RUNNER_TEMP/render-review-test-diagnostic/hosted-suite"
            python3 scripts/resume_core_app_assertions.py finish --evidence "$RUNNER_TEMP/core-app-assertion-resume" \
              --suite "$RUNNER_TEMP/render-review-test-diagnostic/hosted-suite" \
              --capture "$RUNNER_TEMP/render-review-test-diagnostic"
            exit 0
          fi
          if [ -n "${NGV_COMPLETED_BACKENDS:-}" ]; then
            python3 scripts/capture_render_review_test_diagnostic.py \
              --evidence "$RUNNER_TEMP/render-review-test-diagnostic" --log test.log \
              --swift-testing-runs 1 --xctest-runs 0 --without-runloop-probe \
              --core-resume "$RUNNER_TEMP/core-backend-resume" -- \
              python3 scripts/run_macos_tests.py --cache-path "$NGV_SWIFTPM_CACHE_PATH" \
                --scope app-swift-testing --evidence "$RUNNER_TEMP/render-review-test-diagnostic/hosted-suite"
            python3 scripts/resume_core_tests.py finish --evidence "$RUNNER_TEMP/core-backend-resume" \
              --suite "$RUNNER_TEMP/render-review-test-diagnostic/hosted-suite" \
              --capture "$RUNNER_TEMP/render-review-test-diagnostic"
            exit 0
          fi
          python3 scripts/capture_render_review_test_diagnostic.py \
            --evidence "$RUNNER_TEMP/render-review-test-diagnostic" --log test.log \
            --swift-testing-runs 2 --xctest-runs 2 --without-runloop-probe -- \
            python3 scripts/run_macos_tests.py --cache-path "$NGV_SWIFTPM_CACHE_PATH" \
              --evidence "$RUNNER_TEMP/render-review-test-diagnostic/hosted-suite"

      - name: Upload App assertion continuation proof
        if: always() && inputs.completed_app_tests_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: core-app-assertion-completion-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-app-assertion-resume
          if-no-files-found: error
          retention-days: 14

      - name: Upload Core backend composition
        if: always() && inputs.completed_backends_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: core-backend-completion-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-backend-resume
          if-no-files-found: error
          retention-days: 14

      - name: Upload render review test diagnosis
        if: always() && inputs.completed_full_core_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: render-review-test-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/render-review-test-diagnostic
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload blockout orientation evidence
        if: always() && inputs.completed_full_core_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: blockout-orientation-evidence
          path: ${{ runner.temp }}/blockout-orientation-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: HDR export QC
        if: inputs.completed_full_core_run_id == '' || inputs.completed_full_core_run_id == '40265902971'
        env:
          NGV_HDR_RUNTIME_QC: '1'
          NGV_HDR_QC_OUTPUT_DIR: ${{ runner.temp }}/hdr-export-qc
        run: |
          python3 scripts/run_macos_tests.py --cache-path "$NGV_SWIFTPM_CACHE_PATH" \
            --scope app-swift-testing --filter HDRExportTests \
            --evidence "$RUNNER_TEMP/hdr-export-qc/hosted-suite"

      - name: Upload HDR export QC evidence
        if: always() && (inputs.completed_full_core_run_id == '' || inputs.completed_full_core_run_id == '40265902971')
        uses: actions/upload-artifact@v4
        with:
          name: hdr-export-qc
          path: ${{ runner.temp }}/hdr-export-qc
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Lottie export evidence
        if: always() && inputs.completed_full_core_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: lottie-export-evidence
          path: ${{ runner.temp }}/lottie-export-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify tests did not mutate tracked source
        run: scripts/verify_tracked_source_state.sh

      - name: Stage the verified bpy runtime
        if: needs.source_gate.outputs.bundle_required == 'true'
        run: |
          set -euo pipefail
          python3 scripts/verify_bpy_distributable_source.py \
            .build/bpy-source/NexGenVideo-bpy-5.2.2-corresponding-source.tar \
            .build/bpy-source/NexGenVideo-bpy-5.2.2-corresponding-source.manifest.json
          scripts/stage_bpy_runtime.sh .build/bpy-runtime

      - name: Bundle (debug, ad-hoc signed)
        if: needs.source_gate.outputs.bundle_required == 'true'
        run: scripts/bundle.sh debug

      - name: Verify app architecture and minimum macOS
        if: needs.source_gate.outputs.bundle_required == 'true'
        run: scripts/verify_app_slice.sh .build/NexGenVideo.app

      - name: Verify app build did not mutate tracked source
        if: needs.source_gate.outputs.bundle_required == 'true'
        run: scripts/verify_tracked_source_state.sh

      - name: Assemble format pack (.ngvpack, ad-hoc) + catalog
        if: needs.source_gate.outputs.bundle_required == 'true'
        run: |
          set -euo pipefail
          # Secret-free validation of the whole pack pipeline: assemble the ad-hoc-signed
          # .ngvpack, then merge it into a catalog the app decodes.
          scripts/assemble_ngvpack.sh plugins/musicvideo.json debug .build/plugins
          swift build --cache-path "$NGV_SWIFTPM_CACHE_PATH" --product FixtureFictionPlugin
          scripts/assemble_ngvpack.sh plugins/fixture-fiction.json debug .build/pack-fixtures
          # Merge against a channel that already carries an OLDER version: the append-only
          # promise #168 rests on (older versions survive, so an older app keeps its last
          # compatible pack) is what makes the multi-version selection meaningful.
          cat > .build/existing.json <<'JSON'
          {"schema":"plugins/v2","plugins":[{"id":"musicvideo","displayName":"Music Video",
           "tagline":"older","version":"0.0.1","minAppVersion":"0.1.0",
           "url":"https://example.com/plugins/musicvideo-0.0.1.ngvpack.zip","sha256":"deadbeef"}]}
          JSON
          python3 scripts/publish_plugin_catalog.py .build/plugins "https://example.com/plugins" \
            .build/plugins/catalog.json --existing .build/existing.json
          cat .build/plugins/catalog.json
          python3 - <<'PY'
          import json, sys
          plugins = json.load(open(".build/plugins/catalog.json"))["plugins"]
          versions = [p["version"] for p in plugins if p["id"] == "musicvideo"]
          assert "0.0.1" in versions, f"append-only violated — older version dropped: {versions}"
          assert len(versions) > 1, f"the freshly built version was not appended: {versions}"
          fresh = next(p for p in plugins if p["id"] == "musicvideo" and p["version"] != "0.0.1")
          assert fresh["projectSchema"] == "musicvideo/3.0.0", fresh
          assert fresh["migratesFrom"] == ["musicvideo/legacy", "musicvideo/1.0.0", "musicvideo/2.0.0"], fresh
          for p in plugins:
              assert p["url"].endswith(f"{p['id']}-{p['version']}.ngvpack.zip"), f"unversioned asset URL: {p['url']}"
          print(f"catalog carries {len(versions)} musicvideo version(s): {versions}")
          PY

      - name: Verify pack links the SHARED engine (guards the PackEntry-cast regression)
        if: needs.source_gate.outputs.bundle_required == 'true'
        run: |
          set -euo pipefail
          # A `.ngvpack` must link NexGenEngine as ONE shared dynamic image with the app —
          # not statically absorb it. If it absorbs the engine, the pack carries its own
          # `PackEntry` (ObjC `NGVPackEntry`) class, so the host's load-time
          # `bundle.principalClass as? PackEntry.Type` cast fails ("entry point not found")
          # and the pack silently never activates. No test inside the package graph can
          # catch this (they link the pack statically → one class), so we assert the
          # Mach-O invariant on the assembled bundle here.
          APP_BIN=".build/NexGenVideo.app/Contents/MacOS/NexGenVideo"
          while IFS= read -r PACK_BIN; do
            echo "pack binary: $PACK_BIN"
            # 1) every pack references the shared engine dylib dynamically
            otool -L "$PACK_BIN" | grep -q '@rpath/libNexGenEngine.dylib' \
              || { echo "::error::$PACK_BIN does not dynamically link libNexGenEngine.dylib"; exit 1; }
            # 2) no pack carries its own copy of the engine's PackEntry class
            if nm "$PACK_BIN" | grep -E ' [SDTtbd] _OBJC_CLASS_\$_NGVPackEntry$'; then
              echo "::error::$PACK_BIN statically absorbs NexGenEngine"; exit 1
            fi
          done < <(find .build/plugins .build/pack-fixtures -path '*.ngvpack/Contents/MacOS/*' -type f | sort)
          # 3) the app links the engine dynamically too (else the shared image never loads)
          otool -L "$APP_BIN" | grep -q '@rpath/libNexGenEngine.dylib' \
            || { echo "::error::app does not dynamically link libNexGenEngine.dylib"; exit 1; }
          echo "OK: NexGenEngine is one shared dynamic image across app + pack"

      - name: Load-test — the app actually loads the pack from an EXTERNAL dir (guards the load-time cast)
        if: needs.source_gate.outputs.bundle_required == 'true'
        run: |
          set -euo pipefail
          # The static checks above are necessary but NOT sufficient — they missed the 0.7.6 rpath
          # regression where the pack couldn't resolve the shared engine at load time. This reproduces
          # the FIELD layout: the pack lives OUTSIDE the app bundle, so its @rpath/libNexGenEngine.dylib
          # must resolve to the host's Contents/Frameworks via @executable_path/../Frameworks. The REAL
          # app binary loads it (gate → Bundle.load() → principalClass cast → makePack()) and exits 0
          # only on success.
          EXTDIR="$(mktemp -d)/packs"; mkdir -p "$EXTDIR"
          for PACK in .build/plugins/musicvideo.ngvpack .build/pack-fixtures/fixture-fiction.ngvpack; do
            PACK_BIN="$(find "$PACK/Contents/MacOS" -maxdepth 1 -type f | head -1)"
            otool -l "$PACK_BIN" | grep -q 'path @executable_path/../Frameworks' \
              || { echo "::error::$PACK is missing the host-engine rpath"; exit 1; }
            EXTERNAL="$EXTDIR/$(basename "$PACK")"
            cp -R "$PACK" "$EXTERNAL"
            echo "loading $EXTERNAL with the real app binary…"
            NGV_SELFTEST_PACK="$EXTERNAL" .build/NexGenVideo.app/Contents/MacOS/NexGenVideo
          done
          echo "OK: the app loaded both packs from an external directory"

      - name: Relaunch-test — historical ABI gate and same-contract restart keep Home interactive
        if: needs.source_gate.outputs.bundle_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS_DIR="$(mktemp -d)"
          PREVIOUS_PACK="$(bash scripts/fetch_previous_pack.sh \
            .build/plugins/musicvideo.ngvpack "$PREVIOUS_DIR")"
          while IFS= read -r COMPATIBLE_PACK; do
            NGV_SELFTEST_LOAD_ONLY=1 NGV_SELFTEST_PACK="$COMPATIBLE_PACK" \
              .build/NexGenVideo.app/Contents/MacOS/NexGenVideo
          done < <(find "$PREVIOUS_DIR/compatible" -maxdepth 1 -type d -name '*.ngvpack' | sort)
          while IFS= read -r INCOMPATIBLE_PACK; do
            NGV_SELFTEST_EXPECT_ENGINE_INCOMPATIBLE=1 \
              NGV_SELFTEST_PACK="$INCOMPATIBLE_PACK" \
              .build/NexGenVideo.app/Contents/MacOS/NexGenVideo
          done < <(find "$PREVIOUS_DIR/incompatible" -maxdepth 1 -type d -name '*.ngvpack' | sort)
          bash scripts/relaunch_selftest.sh \
            .build/NexGenVideo.app \
            "$PREVIOUS_PACK" \
            .build/plugins/musicvideo.ngvpack

      - name: Verify bundling did not mutate tracked source
        if: needs.source_gate.outputs.bundle_required == 'true'
        run: scripts/verify_tracked_source_state.sh

      - name: Zip .app
        if: needs.source_gate.outputs.bundle_required == 'true'
        run: ditto -c -k --keepParent .build/NexGenVideo.app .build/NexGenVideo.zip

      - name: Upload .app artifact
        if: needs.source_gate.outputs.bundle_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NexGenVideo-app
          path: |
            .build/NexGenVideo.zip
            .build/bpy-source/bpy-source-receipt.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Transfer the same app and pack for workspace acceptance
        if: needs.source_gate.outputs.bundle_required == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/workspace-transfer"
          tar -czf "$RUNNER_TEMP/workspace-transfer/workspace-ui.tar.gz" -C .build NexGenVideo.app plugins/musicvideo.ngvpack
          NGV_WORKSPACE_APP_TREE_SHA256="$(python3 scripts/external-gui/acceptance.py tree-sha256 --app .build/NexGenVideo.app)"
          export NGV_WORKSPACE_APP_TREE_SHA256
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'workspace-transfer'
          digest = hashlib.sha256()
          with (root / 'workspace-ui.tar.gz').open('rb') as archive:
              for chunk in iter(lambda: archive.read(1024 * 1024), b''):
                  digest.update(chunk)
          receipt = {'schema': 'nexgenvideo/workspace-ui-input/1', 'sourceSHA': os.environ['GITHUB_SHA'],
                     'archiveSHA256': digest.hexdigest(), 'appTreeSHA256': os.environ['NGV_WORKSPACE_APP_TREE_SHA256']}
          (root / 'workspace-ui-input.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          PY
          cp .build/bpy-source/bpy-source-receipt.json "$RUNNER_TEMP/workspace-transfer/"
      - uses: actions/upload-artifact@v4
        if: needs.source_gate.outputs.bundle_required == 'true'
        with:
          name: workspace-ui-app
          path: ${{ runner.temp }}/workspace-transfer/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Bind reconstructed app to original full Core proofs
        if: inputs.completed_full_core_run_id != ''
        run: |
          python3 scripts/resume_core_bundle.py finish --evidence "$RUNNER_TEMP/core-full-resume" \
            --app .build/NexGenVideo.app

      - name: Upload full Core continuation composition
        if: always() && inputs.completed_full_core_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: core-full-completion-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-full-resume
          if-no-files-found: error
          retention-days: 14

  diagnostic-startup:
    needs: [source_gate, build_test]
    if: needs.source_gate.outputs.bundle_required == 'true'
    # ci-lint: allow-CI005 Runtime acceptance on the macOS 26 floor; macrunner boots only macOS 27.
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-release-evidence
          run-id: 34175620480
          github-token: ${{ github.token }}
          path: control
      - name: Prove shipped build 97 misses normal recorder startup
        run: |
          ditto -x -k control/diagnostic-app.zip control
          python3 scripts/verify_hang_startup.py control/NexGenVideo.app --expect-missing-recorder --output evidence/control.json
      - uses: actions/download-artifact@v4
        with:
          name: NexGenVideo-app
          path: candidate
      - name: Verify normal startup and disabled preference
        run: |
          ditto -x -k candidate/NexGenVideo.zip candidate
          python3 scripts/verify_hang_startup.py candidate/NexGenVideo.app --output evidence/candidate.json
      - name: Exercise native Export Cancel, Retry and Reveal actions
        run: python3 scripts/export_actions_acceptance.py candidate/NexGenVideo.app --output evidence/export-actions.json
      - name: Verify generation batch pricing recovery on macOS 26
        shell: bash
        run: |
          set -euo pipefail
          NGV_SELFTEST_GENERATION_BATCH_RECOVERY=1 \
            candidate/NexGenVideo.app/Contents/MacOS/NexGenVideo \
            | grep -qx 'SELFTEST_GENERATION_BATCH_RECOVERY_OK'
      - name: Verify helper recovery during active work
        run: python3 scripts/hang_diagnostic_acceptance.py candidate/NexGenVideo.app --helper-recovery-only --output evidence
      - name: Verify asynchronous termination, cancellation and restart
        if: ${{ !cancelled() }}
        run: python3 scripts/app_termination_acceptance.py candidate/NexGenVideo.app --output evidence/termination
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-normal-startup
          path: |
            evidence/*.json
            evidence/*.log
            evidence/*.png
            evidence/helper-recovery-recordings.zip
            evidence/termination/
          retention-days: 90

  bpy-runtime:
    needs: [source_gate, build_test]
    if: needs.source_gate.outputs.bundle_required == 'true'
    uses: ./.github/workflows/bpy-runtime-acceptance.yml
    with:
      artifact: NexGenVideo-app
      app_zip: NexGenVideo.zip
      distribution: false

  merge_gate:
    name: Merge Gate
    needs: [source_gate, build_test, ui_render, diagnostic-startup, bpy-source, bpy-runtime]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all applicable CI jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          if needs["source_gate"]["result"] != "success":
              raise SystemExit("Light Checks did not succeed")
          plan = needs["source_gate"]["outputs"]
          for job, key in (("build_test", "build_required"), ("ui_render", "ui_required"), ("diagnostic-startup", "bundle_required"), ("bpy-source", "bundle_required"), ("bpy-runtime", "bundle_required")):
              if plan.get(key) not in ("true", "false"):
                  raise SystemExit(f"Invalid CI plan: {key}")
              expected = "success" if plan[key] == "true" else "skipped"
              if needs[job]["result"] != expected:
                  raise SystemExit(f"{job}: expected {expected}, got {needs[job]['result']}")
          print("All applicable CI checks succeeded.")
          PYTHON
