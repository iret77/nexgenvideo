name: Replay Scroll Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-scroll-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macrunner
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-xcode-27
      - name: Compile the standalone scroll probe
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library -swift-version 6 -target arm64-apple-macos26.0 \
            scripts/replay_scroll_probe.swift -o "$RUNNER_TEMP/replay-scroll-probe"
          tar -czf "$RUNNER_TEMP/replay-scroll-probe.tar.gz" -C "$RUNNER_TEMP" replay-scroll-probe
      - uses: actions/upload-artifact@v4
        with:
          name: replay-scroll-probe-binary
          path: ${{ runner.temp }}/replay-scroll-probe.tar.gz
          if-no-files-found: error
          retention-days: 1

  probe:
    needs: build
    # ci-lint: allow-CI005 Isolated AppKit runtime diagnosis on the macOS 26 production floor.
    runs-on: macos-26
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: replay-scroll-probe-binary
          path: ${{ runner.temp }}
      - name: Require the production runtime and restore the probe
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          tar -xzf "$RUNNER_TEMP/replay-scroll-probe.tar.gz" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/replay-scroll-probe"
      - name: Measure native scroll event variants
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["RUNNER_TEMP"])
          report = root / "scroll-probe.json"
          with (root / "scroll-probe.log").open("w") as log:
              result = subprocess.run(
                  [str(root / "replay-scroll-probe"), str(report)],
                  stdin=subprocess.DEVNULL, stdout=log, stderr=log, timeout=90,
                  check=False,
              )
          data = json.loads(report.read_text())
          if result.returncode != 0 or data.get("allVariantsMeasured") is not True:
              raise SystemExit("Scroll probe did not complete every measurement; inspect its diagnostic JSON.")
          print("All 28 variants measured. This is diagnostic evidence, not an application acceptance result.")
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-scroll-probe
          path: |
            ${{ runner.temp }}/scroll-probe.json
            ${{ runner.temp }}/scroll-probe.log
          if-no-files-found: error
          retention-days: 3
