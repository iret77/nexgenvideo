name: Chat Hang Replay
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: chat-hang-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-xcode-27
      - uses: ./.github/actions/cache-swiftpm-dependencies
      - name: Build replay app
        run: |
          scripts/bundle.sh debug
          tar -czf "$RUNNER_TEMP/chat-replay.tar.gz" -C .build NexGenVideo.app
      - uses: actions/upload-artifact@v4
        with:
          name: chat-replay
          path: ${{ runner.temp }}/chat-replay.tar.gz
          retention-days: 3

  replay:
    needs: build
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chat-replay
          path: ${{ runner.temp }}/chat-replay
      - name: Require production macOS and stress the real panel
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          tar -xzf "$RUNNER_TEMP/chat-replay/chat-replay.tar.gz" -C "$RUNNER_TEMP/chat-replay"
          python3 scripts/chat_hang_replay.py "$RUNNER_TEMP/chat-replay/NexGenVideo.app/Contents/MacOS/NexGenVideo" "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-replay-evidence
          path: |
            ${{ runner.temp }}/evidence/result.json
            ${{ runner.temp }}/evidence/replay.log
            ${{ runner.temp }}/evidence/panel-*.png
            ${{ runner.temp }}/evidence/sample.txt
          retention-days: 7
