name: Installed App User Journey

on:
  workflow_dispatch:
    inputs:
      packaging_producer_source_sha:
        type: string
        default: ''
      packaging_provenance_artifact_id:
        type: string
        default: ''
      packaging_provenance_artifact_sha256:
        type: string
        default: ''
      runtime_run_id:
        description: Run containing the already built workspace-ui-app artifact
        required: true
        type: string
      interface_scale:
        description: Resume one failed text size or exercise all three
        type: choice
        options: [all, '1', '1.25', '1.5']
        default: all
      test_bundle_run_id:
        description: Optional original producer with identical compiled client inputs; empty builds once
        type: string
        default: ''
      test_bundle_artifact_id:
        description: Exact original external-gui-tests artifact ID
        type: string
        default: ''
      test_bundle_artifact_sha256:
        description: SHA-256 of that exact original client archive
        type: string
        default: ''
      artifact_mode:
        description: Retained App or exact signed DMG
        type: choice
        options: [app, dmg]
        default: app
      product_source_sha:
        description: Original signed product source for a CI-only DMG continuation
        type: string
        default: ''
      runtime_artifact_id:
        description: Immutable original release-user-journey-input artifact ID
        type: string
        default: ''
      runtime_artifact_sha256:
        description: Original GitHub artifact SHA256
        type: string
        default: ''
      expected_dmg_sha256:
        description: Exact signed and stapled DMG SHA256
        type: string
        default: ''
      scenario:
        description: Existing normal journey or targeted public transport actions
        type: choice
        options: [journey, transport, normal-fresh-musicvideo, normal-fresh-local-musicvideo]
        default: journey
      expected_catalog_sha256:
        description: Reviewed normal catalog bytes for fresh Musicvideo installation
        type: string
        default: ''
      expected_pack_sha256:
        description: Exact published Musicvideo 0.6.0 archive SHA256
        type: string
        default: ''
      verified_pr_run_id:
        type: string
        default: ''
      fixture_artifact_id:
        type: string
        default: ''
      fixture_sha256:
        type: string
        default: ''
  workflow_call:
    inputs:
      packaging_producer_source_sha:
        type: string
        default: ''
      packaging_provenance_artifact_id:
        type: string
        default: ''
      packaging_provenance_artifact_sha256:
        type: string
        default: ''
      runtime_run_id:
        type: string
        default: ''
      interface_scale:
        type: string
        default: all
      runtime_artifact:
        type: string
        default: workspace-ui-app
      test_bundle_run_id:
        type: string
        default: ''
      test_bundle_artifact_id:
        type: string
        default: ''
      test_bundle_artifact_sha256:
        type: string
        default: ''
      artifact_mode:
        type: string
        default: app
      expected_dmg_sha256:
        type: string
        default: ''
      product_source_sha:
        type: string
        default: ''
      runtime_artifact_id:
        type: string
        default: ''
      runtime_artifact_sha256:
        type: string
        default: ''
      scenario:
        type: string
        default: journey
      expected_catalog_sha256:
        type: string
        default: ''
      expected_pack_sha256:
        type: string
        default: ''
      verified_pr_run_id:
        type: string
        default: ''
      fixture_artifact_id:
        type: string
        default: ''
      fixture_sha256:
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  PACKAGING_PRODUCER_SOURCE: ${{ inputs.packaging_producer_source_sha }}
  PACKAGING_PROVENANCE_ARTIFACT_ID: ${{ inputs.packaging_provenance_artifact_id }}
  PACKAGING_PROVENANCE_ARTIFACT_SHA256: ${{ inputs.packaging_provenance_artifact_sha256 }}
  PRODUCT_SOURCE: ${{ inputs.product_source_sha || github.sha }}

concurrency:
  group: external-gui-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scales: ${{ steps.select.outputs.scales }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select independent user journeys
        id: select
        env:
          INTERFACE_SCALE: ${{ inputs.interface_scale }}
          ARTIFACT_MODE: ${{ inputs.artifact_mode || 'app' }}
          EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
          TEST_BUNDLE_RUN_ID: ${{ inputs.test_bundle_run_id }}
          TEST_BUNDLE_ARTIFACT_ID: ${{ inputs.test_bundle_artifact_id }}
          TEST_BUNDLE_ARTIFACT_SHA256: ${{ inputs.test_bundle_artifact_sha256 }}
          GH_TOKEN: ${{ github.token }}
          RETAINED_SOURCE: ${{ inputs.product_source_sha }}
          RETAINED_RUN: ${{ inputs.runtime_run_id }}
          RETAINED_ARTIFACT: ${{ inputs.runtime_artifact_id }}
          RETAINED_DIGEST: ${{ inputs.runtime_artifact_sha256 }}
          SCENARIO: ${{ inputs.scenario || 'journey' }}
          EXPECTED_CATALOG_SHA256: ${{ inputs.expected_catalog_sha256 }}
          EXPECTED_PACK_SHA256: ${{ inputs.expected_pack_sha256 }}
          VERIFIED_PR_RUN: ${{ inputs.verified_pr_run_id }}
          FIXTURE_ARTIFACT: ${{ inputs.fixture_artifact_id }}
          FIXTURE_SHA: ${{ inputs.fixture_sha256 }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, 'scripts')
          from retained_packaging import environment_selectors
          sys.path.insert(0, 'scripts/external-gui')
          from test_bundle import validate_client_source
          validate_client_source(os.environ['TEST_BUNDLE_RUN_ID'], os.environ['TEST_BUNDLE_ARTIFACT_ID'],
              os.environ['TEST_BUNDLE_ARTIFACT_SHA256'], os.environ['GITHUB_SHA'])
          packaging = environment_selectors()
          if packaging is not None and (not os.environ['RETAINED_SOURCE']
                  or not re.fullmatch('[1-9][0-9]*', os.environ['VERIFIED_PR_RUN'])):
              raise ValueError('Packaging selectors require explicit retained product inputs')
          scale = os.environ['INTERFACE_SCALE']
          if scale not in {'all', '1', '1.25', '1.5'}:
              raise SystemExit('Unknown interface text size')
          mode = os.environ['ARTIFACT_MODE']
          scenario = os.environ['SCENARIO']
          if scenario not in {'journey', 'transport', 'normal-fresh-musicvideo', 'normal-fresh-local-musicvideo'}:
              raise SystemExit('Unknown public XCTest scenario')
          if scenario in {'normal-fresh-musicvideo', 'normal-fresh-local-musicvideo'}:
              if (mode != 'dmg' or scale != '1.5' or not os.environ['RETAINED_SOURCE']
                  or not re.fullmatch('[1-9][0-9]*', os.environ['VERIFIED_PR_RUN'])
                  or not re.fullmatch('[a-f0-9]{64}', os.environ.get('EXPECTED_CATALOG_SHA256', ''))
                  or not re.fullmatch('[a-f0-9]{64}', os.environ.get('EXPECTED_PACK_SHA256', ''))):
                  raise SystemExit('Fresh Musicvideo requires the exact retained DMG, 150% size, source and published catalog/pack bytes')
          elif os.environ.get('EXPECTED_CATALOG_SHA256') or os.environ.get('EXPECTED_PACK_SHA256'):
              raise SystemExit('Normal catalog and pack selectors cannot be ignored by another scenario')
          if scenario == 'normal-fresh-local-musicvideo' and os.environ.get('EXPECTED_PACK_SHA256') != '37fcee05d1ac334b20eb392c61cc3b7a94af165dc3b967c61602bc79d6dc4388':
              raise SystemExit('The local-DMG case requires the qualified original Musicvideo pack lineage')
          if scenario == 'transport':
              if (mode != 'dmg' or scale != '1.5' or not os.environ['RETAINED_SOURCE']
                  or not re.fullmatch('[1-9][0-9]*', os.environ['VERIFIED_PR_RUN'])
                  or not re.fullmatch('[1-9][0-9]*', os.environ['FIXTURE_ARTIFACT'])
                  or not re.fullmatch('[a-f0-9]{64}', os.environ['FIXTURE_SHA'])):
                  raise SystemExit('Public transport needs the complete retained DMG, source and fixture identities')
          elif os.environ['FIXTURE_ARTIFACT'] or os.environ['FIXTURE_SHA']:
              raise SystemExit('A transport fixture cannot replace a normal journey')
          if os.environ['VERIFIED_PR_RUN'] and (not os.environ['RETAINED_SOURCE']
                  or not re.fullmatch('[1-9][0-9]*', os.environ['VERIFIED_PR_RUN'])):
              raise SystemExit('PR source proof requires a retained signed product')
          if os.environ['TEST_BUNDLE_RUN_ID'] and not re.fullmatch('[1-9][0-9]*', os.environ['TEST_BUNDLE_RUN_ID']):
              raise SystemExit('UI test producer run ID must be positive')
          if mode not in {'app', 'dmg'}:
              raise SystemExit('Unknown app artifact kind')
          if mode == 'dmg' and not re.fullmatch('[a-f0-9]{64}', os.environ['EXPECTED_DMG_SHA256']):
              raise SystemExit('DMG acceptance requires its exact publication hash')
          if os.environ['RETAINED_SOURCE']:
              if (mode != 'dmg' or not re.fullmatch('[0-9a-f]{40}', os.environ['RETAINED_SOURCE'])
                  or not re.fullmatch('[1-9][0-9]*', os.environ['RETAINED_RUN'])
                  or not re.fullmatch('[1-9][0-9]*', os.environ['RETAINED_ARTIFACT'])
                  or not re.fullmatch('[0-9a-f]{64}', os.environ['RETAINED_DIGEST'])):
                  raise SystemExit('Retained signed DMG requires its complete immutable producer identity')
          elif os.environ['RETAINED_ARTIFACT'] or os.environ['RETAINED_DIGEST']:
              raise SystemExit('Retained artifact selectors require the original product source')
          scales = ['1', '1.25', '1.5'] if scale == 'all' else [scale]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('scales=' + json.dumps(scales) + '\n')
          PY
      - name: Bind the retained signed DMG and unchanged product inputs
        if: inputs.product_source_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.runtime_run_id }}
          ORIGINAL_ARTIFACT: ${{ inputs.runtime_artifact_id }}
          ORIGINAL_DIGEST: ${{ inputs.runtime_artifact_sha256 }}
          VERIFIED_PR_RUN: ${{ inputs.verified_pr_run_id }}
          CANDIDATE_KIND: ${{ inputs.scenario == 'transport' && 'signed-transport' || 'signed-journey' }}
        run: |
          set -euo pipefail
          if [ -n "$VERIFIED_PR_RUN" ]; then
            python3 scripts/verified_pr_source_checks.py prepare --run-id "$VERIFIED_PR_RUN" \
              --output "$RUNNER_TEMP/public-client-source-proof"
          else
            python3 -m unittest discover -s scripts -p 'test_external_gui_test_bundle.py'
            python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          fi
          mkdir -p "$RUNNER_TEMP/retained-dmg"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" > "$RUNNER_TEMP/retained-dmg/run.json"
          ATTEMPT="$(jq -r .run_attempt "$RUNNER_TEMP/retained-dmg/run.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN/attempts/$ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/retained-dmg/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ORIGINAL_ARTIFACT" > "$RUNNER_TEMP/retained-dmg/artifact.json"
          python3 scripts/verify_diagnostic_candidate.py "$ORIGINAL_RUN" "$PRODUCT_SOURCE" \
            "$ORIGINAL_ARTIFACT" "$ORIGINAL_DIGEST" "$RUNNER_TEMP/retained-dmg" --candidate-kind "$CANDIDATE_KIND" \
            --packaging-producer-source "$PACKAGING_PRODUCER_SOURCE" --packaging-provenance-artifact-id "$PACKAGING_PROVENANCE_ARTIFACT_ID" --packaging-provenance-artifact-sha256 "$PACKAGING_PROVENANCE_ARTIFACT_SHA256"
      - uses: actions/upload-artifact@v4
        if: inputs.product_source_sha != ''
        with:
          name: retained-dmg-producer
          path: ${{ runner.temp }}/retained-dmg/*.json
          if-no-files-found: error
          retention-days: 90

  test-build:
    needs: cases
    if: inputs.test_bundle_run_id == ''
    name: Build external UI tests
    runs-on: macrunner
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-xcode-27
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build only the independent UI test products once
        run: python3 scripts/external-gui/test_bundle.py build --destination "$RUNNER_TEMP/external-tests-build"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: external-gui-tests
          path: |
            ${{ runner.temp }}/external-tests-build/tests.tar.gz
            ${{ runner.temp }}/external-tests-build/tests-input.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-gui-tests-build-log-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-tests-build/build.log
          if-no-files-found: warn
          retention-days: 90

  test-runtime:
    needs: [cases, test-build]
    if: ${{ !cancelled() && needs.cases.result == 'success' && (needs.test-build.result == 'success' || (needs.test-build.result == 'skipped' && inputs.test_bundle_run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      producer_sha256: ${{ steps.resolve.outputs.producer_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind the original successful test build and exact GitHub artifact bytes
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_BUNDLE_RUN_ID: ${{ inputs.test_bundle_run_id || github.run_id }}
          TEST_BUNDLE_ARTIFACT_ID: ${{ inputs.test_bundle_artifact_id || needs.test-build.outputs.artifact_id }}
          TEST_BUNDLE_ARTIFACT_SHA256: ${{ inputs.test_bundle_artifact_sha256 }}
        run: |
          set --
          if [ -n "$TEST_BUNDLE_ARTIFACT_ID" ]; then set -- "$@" --artifact-id "$TEST_BUNDLE_ARTIFACT_ID"; fi
          if [ -n "$TEST_BUNDLE_ARTIFACT_SHA256" ]; then set -- "$@" --artifact-sha256 "$TEST_BUNDLE_ARTIFACT_SHA256"; fi
          python3 scripts/external-gui/test_bundle.py resolve --run-id "$TEST_BUNDLE_RUN_ID" \
            "$@" --destination "$RUNNER_TEMP/external-tests-input"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: external-tests-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-tests-input/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  acceptance:
    needs: [cases, test-runtime]
    if: ${{ !cancelled() && needs.test-runtime.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scale: ${{ fromJSON(needs.cases.outputs.scales) }}
    name: ${{ inputs.scenario == 'transport' && 'Public transport at' || 'Normal app at' }} ${{ matrix.scale }} text size
    runs-on: macrunner
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare job-local independent media tools
        if: inputs.scenario == 'journey' || inputs.scenario == ''
        id: media-tools
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39
        with:
          environment-name: ngv-media
          create-args: 'ffmpeg=9.0.2=gpl_*'
          micromamba-root-path: ${{ runner.temp }}/micromamba
          micromamba-binary-path: ${{ runner.temp }}/micromamba-bin/micromamba
          init-shell: 'none'
          generate-run-shell: false
          cache-environment: false
          cache-downloads: false
          post-cleanup: all
      - name: Require both independent media executables
        if: inputs.scenario == 'journey' || inputs.scenario == ''
        env:
          MEDIA_TOOLS_BIN: ${{ steps.media-tools.outputs.environment-path }}/bin
        run: |
          test "$(uname -m)" = arm64
          "$MEDIA_TOOLS_BIN/ffmpeg" -version
          "$MEDIA_TOOLS_BIN/ffprobe" -version
          echo "$MEDIA_TOOLS_BIN" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        if: inputs.product_source_sha == ''
        with:
          name: ${{ inputs.artifact_mode == 'dmg' && 'release-user-journey-input' || inputs.runtime_artifact || 'workspace-ui-app' }}
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/external-runtime
      - name: Retrieve the exact retained DMG artifact
        if: inputs.product_source_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_ARTIFACT: ${{ inputs.runtime_artifact_id }}
          ORIGINAL_DIGEST: ${{ inputs.runtime_artifact_sha256 }}
          ORIGINAL_RUN: ${{ inputs.runtime_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from reuse_bpy_binary_evidence import api, download
          from retained_packaging import environment_selectors, consumer_binding, consumer_source, encoded
          binding = consumer_binding(int(os.environ['ORIGINAL_RUN']), os.environ['PRODUCT_SOURCE'], environment_selectors(),
              archive_root=Path(os.environ['RUNNER_TEMP']) / 'external-packaging')
          producer_source = consumer_source(os.environ['PRODUCT_SOURCE'], binding)
          if binding is not None:
              (Path(os.environ['RUNNER_TEMP']) / 'external-packaging/consumer.json').write_bytes(encoded(binding))
          artifact = api('/actions/artifacts/' + os.environ['ORIGINAL_ARTIFACT'])
          if (artifact.get('id') != int(os.environ['ORIGINAL_ARTIFACT'])
              or artifact.get('name') != 'release-user-journey-input' or artifact.get('expired') is not False
              or artifact.get('digest') != 'sha256:' + os.environ['ORIGINAL_DIGEST']
              or artifact.get('workflow_run', {}).get('id') != int(os.environ['ORIGINAL_RUN'])
              or artifact.get('workflow_run', {}).get('head_sha') != producer_source):
              raise ValueError('Retained signed DMG artifact identity changed')
          download(artifact, Path(os.environ['RUNNER_TEMP']) / 'retained-dmg.zip')
          PY
          ditto -x -k "$RUNNER_TEMP/retained-dmg.zip" "$RUNNER_TEMP/external-runtime"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.test-runtime.outputs.artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/external-tests-input
      - name: Verify the existing app belongs to this source
        if: inputs.artifact_mode != 'dmg'
        id: app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'external-runtime'
          receipt = json.loads((root / 'workspace-ui-input.json').read_text())
          if (receipt.get('schema') != 'nexgenvideo/workspace-ui-input/1'
              or receipt.get('sourceSHA') != os.environ['GITHUB_SHA']
              or any(not isinstance(receipt.get(key), str) or not re.fullmatch('[a-f0-9]{64}', receipt[key])
                     for key in ('archiveSHA256', 'appTreeSHA256'))):
              raise SystemExit('Runtime artifact has no matching producer receipt')
          with (root / 'workspace-ui.tar.gz').open('rb') as archive:
              digest = hashlib.file_digest(archive, 'sha256').hexdigest()
          if digest != receipt['archiveSHA256']:
              raise SystemExit('Runtime archive differs from the producer receipt')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tree_sha256=' + receipt['appTreeSHA256'] + '\n')
          PY
          tar -xzf "$RUNNER_TEMP/external-runtime/workspace-ui.tar.gz" -C "$RUNNER_TEMP/external-runtime"
          APP="$RUNNER_TEMP/external-runtime/NexGenVideo.app"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NGVSourceCommit' "$APP/Contents/Info.plist")" = "$GITHUB_SHA" ]
          DIGEST="$(python3 scripts/external-gui/acceptance.py tree-sha256 --app "$APP")"
          EXPECTED="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["appTreeSHA256"])' "$RUNNER_TEMP/external-runtime/workspace-ui-input.json")"
          [ "$DIGEST" = "$EXPECTED" ]
      - name: Exercise the normal installed app through external input
        if: inputs.artifact_mode != 'dmg'
        env:
          APP_TREE_SHA256: ${{ steps.app.outputs.tree_sha256 }}
          INTERFACE_SCALE: ${{ matrix.scale }}
          TEST_PRODUCER_SHA256: ${{ needs.test-runtime.outputs.producer_sha256 }}
        run: |
          python3 scripts/external-gui/acceptance.py run \
            --app "$RUNNER_TEMP/external-runtime/NexGenVideo.app" \
            --app-tree-sha256 "$APP_TREE_SHA256" --source-sha "$GITHUB_SHA" \
            --scale "$INTERFACE_SCALE" --evidence "$RUNNER_TEMP/external-gui" \
            --test-runtime "$RUNNER_TEMP/external-tests-input" --test-producer-sha256 "$TEST_PRODUCER_SHA256"
      - name: Install and exercise the exact publication DMG
        if: inputs.artifact_mode == 'dmg' && (inputs.scenario == 'journey' || inputs.scenario == '')
        env:
          EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
          INTERFACE_SCALE: ${{ matrix.scale }}
          TEST_PRODUCER_SHA256: ${{ needs.test-runtime.outputs.producer_sha256 }}
        run: |
          set --
          if [ -n "$PACKAGING_PRODUCER_SOURCE" ]; then set -- --packaging-binding "$RUNNER_TEMP/external-packaging/consumer.json"; fi
          python3 scripts/external-gui/acceptance.py run "$@" \
            --dmg "$RUNNER_TEMP/external-runtime/NexGenVideo.dmg" \
            --dmg-sha256 "$EXPECTED_DMG_SHA256" --source-sha "$PRODUCT_SOURCE" \
            --scale "$INTERFACE_SCALE" --evidence "$RUNNER_TEMP/external-gui" \
            --test-runtime "$RUNNER_TEMP/external-tests-input" --test-producer-sha256 "$TEST_PRODUCER_SHA256"
      - name: Install Musicvideo through the normal catalog and start a fresh project
        if: inputs.scenario == 'normal-fresh-musicvideo'
        env:
          EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
          EXPECTED_CATALOG_SHA256: ${{ inputs.expected_catalog_sha256 }}
          EXPECTED_PACK_SHA256: ${{ inputs.expected_pack_sha256 }}
          TEST_PRODUCER_SHA256: ${{ needs.test-runtime.outputs.producer_sha256 }}
        run: |
          set --
          if [ -n "$PACKAGING_PRODUCER_SOURCE" ]; then set -- --packaging-binding "$RUNNER_TEMP/external-packaging/consumer.json"; fi
          python3 scripts/external-gui/acceptance.py run "$@" --scenario normal-fresh-musicvideo \
            --dmg "$RUNNER_TEMP/external-runtime/NexGenVideo.dmg" --dmg-sha256 "$EXPECTED_DMG_SHA256" \
            --source-sha "$PRODUCT_SOURCE" --scale 1.5 --evidence "$RUNNER_TEMP/external-gui" \
            --expected-catalog-sha256 "$EXPECTED_CATALOG_SHA256" --expected-pack-sha256 "$EXPECTED_PACK_SHA256" \
            --test-runtime "$RUNNER_TEMP/external-tests-input" --test-producer-sha256 "$TEST_PRODUCER_SHA256"
      - name: Install the external DMG pack through File and start a fresh project
        if: inputs.scenario == 'normal-fresh-local-musicvideo'
        env:
          EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
          EXPECTED_CATALOG_SHA256: ${{ inputs.expected_catalog_sha256 }}
          EXPECTED_PACK_SHA256: ${{ inputs.expected_pack_sha256 }}
          TEST_PRODUCER_SHA256: ${{ needs.test-runtime.outputs.producer_sha256 }}
        run: |
          set --
          if [ -n "$PACKAGING_PRODUCER_SOURCE" ]; then set -- --packaging-binding "$RUNNER_TEMP/external-packaging/consumer.json"; fi
          python3 scripts/external-gui/acceptance.py run "$@" --scenario normal-fresh-local-musicvideo \
            --dmg "$RUNNER_TEMP/external-runtime/NexGenVideo.dmg" --dmg-sha256 "$EXPECTED_DMG_SHA256" \
            --source-sha "$PRODUCT_SOURCE" --scale 1.5 --evidence "$RUNNER_TEMP/external-gui" \
            --expected-catalog-sha256 "$EXPECTED_CATALOG_SHA256" --expected-pack-sha256 "$EXPECTED_PACK_SHA256" \
            --test-runtime "$RUNNER_TEMP/external-tests-input" --test-producer-sha256 "$TEST_PRODUCER_SHA256"
      - uses: actions/download-artifact@v4
        if: inputs.scenario == 'transport'
        with:
          artifact-ids: ${{ inputs.fixture_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/transport-fixture
      - name: Exercise the public transport on the same exact DMG
        if: inputs.scenario == 'transport'
        env:
          EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
          FIXTURE_SHA256: ${{ inputs.fixture_sha256 }}
          TEST_PRODUCER_SHA256: ${{ needs.test-runtime.outputs.producer_sha256 }}
        run: |
          set --
          if [ -n "$PACKAGING_PRODUCER_SOURCE" ]; then set -- --packaging-binding "$RUNNER_TEMP/external-packaging/consumer.json"; fi
          python3 scripts/external-gui/transport.py run "$@" --dmg "$RUNNER_TEMP/external-runtime/NexGenVideo.dmg" \
            --dmg-sha256 "$EXPECTED_DMG_SHA256" --source-sha "$PRODUCT_SOURCE" \
            --fixture "$RUNNER_TEMP/transport-fixture" --fixture-sha256 "$FIXTURE_SHA256" \
            --scale 1.5 --evidence "$RUNNER_TEMP/external-gui" \
            --test-runtime "$RUNNER_TEMP/external-tests-input" --test-producer-sha256 "$TEST_PRODUCER_SHA256"
      - name: Validate actual journey and exported-file evidence
        if: inputs.scenario == 'journey' || inputs.scenario == ''
        env:
          ARTIFACT_MODE: ${{ inputs.artifact_mode || 'app' }}
          EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
          INTERFACE_SCALE: ${{ matrix.scale }}
        run: |
          set -euo pipefail
          if [ "$ARTIFACT_MODE" = dmg ]; then
            set --
            if [ -n "$PACKAGING_PRODUCER_SOURCE" ]; then set -- --packaging-binding "$RUNNER_TEMP/external-packaging/consumer.json"; fi
            python3 scripts/external-gui/acceptance.py validate "$@" \
              --evidence "$RUNNER_TEMP/external-gui" --source-sha "$PRODUCT_SOURCE" \
              --scale "$INTERFACE_SCALE" \
              --dmg-sha256 "$EXPECTED_DMG_SHA256"
          else
            cp "$RUNNER_TEMP/external-runtime/workspace-ui-input.json" "$RUNNER_TEMP/external-gui/runtime-input.json"
            python3 scripts/external-gui/acceptance.py validate \
              --evidence "$RUNNER_TEMP/external-gui" --source-sha "$GITHUB_SHA" --scale "$INTERFACE_SCALE"
          fi
      - name: Validate the normal catalog installation and fresh Track intake
        if: inputs.scenario == 'normal-fresh-musicvideo'
        env:
          EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
          EXPECTED_CATALOG_SHA256: ${{ inputs.expected_catalog_sha256 }}
          EXPECTED_PACK_SHA256: ${{ inputs.expected_pack_sha256 }}
        run: |
          set --
          if [ -n "$PACKAGING_PRODUCER_SOURCE" ]; then set -- --packaging-binding "$RUNNER_TEMP/external-packaging/consumer.json"; fi
          python3 scripts/external-gui/acceptance.py validate "$@" --scenario normal-fresh-musicvideo \
            --evidence "$RUNNER_TEMP/external-gui" --source-sha "$PRODUCT_SOURCE" --scale 1.5 \
            --dmg-sha256 "$EXPECTED_DMG_SHA256" --expected-catalog-sha256 "$EXPECTED_CATALOG_SHA256" \
            --expected-pack-sha256 "$EXPECTED_PACK_SHA256"
      - name: Validate the normal local DMG installation and fresh Track intake
        if: inputs.scenario == 'normal-fresh-local-musicvideo'
        env:
          EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
          EXPECTED_CATALOG_SHA256: ${{ inputs.expected_catalog_sha256 }}
          EXPECTED_PACK_SHA256: ${{ inputs.expected_pack_sha256 }}
        run: |
          set --
          if [ -n "$PACKAGING_PRODUCER_SOURCE" ]; then set -- --packaging-binding "$RUNNER_TEMP/external-packaging/consumer.json"; fi
          python3 scripts/external-gui/acceptance.py validate "$@" --scenario normal-fresh-local-musicvideo \
            --evidence "$RUNNER_TEMP/external-gui" --source-sha "$PRODUCT_SOURCE" --scale 1.5 \
            --dmg-sha256 "$EXPECTED_DMG_SHA256" --expected-catalog-sha256 "$EXPECTED_CATALOG_SHA256" \
            --expected-pack-sha256 "$EXPECTED_PACK_SHA256"
      - name: Validate six actual public transport cursor actions
        if: inputs.scenario == 'transport'
        env:
          EXPECTED_DMG_SHA256: ${{ inputs.expected_dmg_sha256 }}
        run: |
          set --
          if [ -n "$PACKAGING_PRODUCER_SOURCE" ]; then set -- --packaging-binding "$RUNNER_TEMP/external-packaging/consumer.json"; fi
          python3 scripts/external-gui/transport.py validate "$@" --source-sha "$PRODUCT_SOURCE" \
            --dmg-sha256 "$EXPECTED_DMG_SHA256" --scale 1.5 --evidence "$RUNNER_TEMP/external-gui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.scenario == 'transport' && 'external-transport' || 'external-gui' }}-${{ inputs.artifact_mode || 'app' }}-${{ matrix.scale }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-gui
          if-no-files-found: warn
          retention-days: 14
