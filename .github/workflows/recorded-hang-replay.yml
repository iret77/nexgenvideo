name: Recorded Hang Replay
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: recorded-hang-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lint_app_theme.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  build:
    needs: source
    runs-on: macrunner
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-xcode-27
      - uses: ./.github/actions/cache-swiftpm-dependencies
      - name: Restore released transcript surface for control
        if: matrix.variant == 'baseline'
        run: |
          git checkout 6a56826a64faae5df48c24ec3f35311f50aacc7c -- \
            Sources/NexGenVideo/Agent/Panel/AgentPanelView.swift \
            Sources/NexGenVideo/Agent/Panel/AgentSurfaceState.swift \
            Sources/NexGenVideo/Agent/Panel/AgentTranscriptLayout.swift \
            Sources/NexGenVideo/Agent/Panel/MarkdownText.swift
          # Keep the historical transcript; adapt only the removed gate-card argument.
          python3 - <<'PYTHON'
          from pathlib import Path
          panel = Path("Sources/NexGenVideo/Agent/Panel/AgentPanelView.swift")
          source = panel.read_text()
          obsolete = "                    surface: editor.uiContract?.phases[gate.phase]?.surface,\n"
          if source.count(obsolete) != 1:
              raise SystemExit("Pinned baseline gate-card call changed; inspect its compatibility")
          source = source.replace(obsolete, "", 1)
          # Models are discovered at runtime now; adapt the pinned picker to the current selection API.
          for old, new in [
              ("{ service.model = m }", "{ service.selectModel(m) }"),
              ("Text(service.effectiveModel.displayName)", 'Text(service.effectiveModel?.displayName ?? "")'),
          ]:
              if source.count(old) != 1:
                  raise SystemExit(f"Pinned baseline model picker changed; inspect: {old}")
              source = source.replace(old, new, 1)
          # Both variants mount the full transcript in the same recorded viewport.
          source = source.replace("struct AgentPanelView: View {", "struct AgentPanelView: View {\n    var presentation: AgentPanelPresentation = .tasks\n    var replayTranscriptOnly = false", 1)
          old = "        let turns = transcriptTurns\n        VStack(spacing: AppTheme.Spacing.none) {"
          new = "        let turns = transcriptTurns\n        if replayTranscriptOnly {\n            messageList(turns: turns)\n        } else {\n        VStack(spacing: AppTheme.Spacing.none) {"
          if source.count(old) != 1:
              raise SystemExit("Pinned baseline transcript body changed; inspect its replay adapter")
          source = source.replace(old, new, 1)
          old = "    private func refreshDiscoveredPlugins() {"
          if source.count(old) != 1:
              raise SystemExit("Pinned baseline body boundary changed; inspect its replay adapter")
          source = source.replace(old, "    }\n\n" + old, 1)
          for old in [
              "                    .padding(.bottom, AppTheme.Spacing.md)\n                }\n            } else {\n                scrollingMessages(turns: turns)",
              "                .frame(maxWidth: AppTheme.Layout.chatColumnMax)\n                .frame(maxWidth: .infinity)\n            }\n            .scrollIndicators(.never)",
          ]:
              if source.count(old) != 1:
                  raise SystemExit("Pinned baseline scroll content changed; inspect its probe placement")
              indent = "                    " if "scrollingMessages" in old else "                "
              boundary = "\n" + indent[:-4] + "}"
              source = source.replace(old, old.replace(boundary, "\n" + indent + ".background { HangReplayTranscriptProbe() }" + boundary, 1), 1)
          panel.write_text(source)
          PYTHON
      - name: Build optimized replay app
        run: |
          scripts/bundle.sh release
          ditto -c -k --keepParent .build/NexGenVideo.app "$RUNNER_TEMP/replay-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: recorded-app-${{ matrix.variant }}
          path: ${{ runner.temp }}/replay-app.zip
          retention-days: 3

  baseline:
    needs: build
    # ci-lint: allow-CI005 Runtime acceptance on the macOS 26 floor; macrunner boots only macOS 27.
    runs-on: macos-26
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: recorded-app-${{ matrix.variant }}
          path: ${{ runner.temp }}/replay
      - name: Replay captured states with recorded dimensions
        env:
          NGV_HANG_FIXTURE_KEY: ${{ secrets.NGV_HANG_FIXTURE_KEY_890AD793 }}
        run: |
          set -euo pipefail
          umask 077
          python3 -m venv "$RUNNER_TEMP/replay-python"
          source "$RUNNER_TEMP/replay-python/bin/activate"
          pip install --quiet cryptography==46.0.5
          ditto -x -k "$RUNNER_TEMP/replay/replay-app.zip" "$RUNNER_TEMP/replay"
          python3 scripts/recorded_hang_replay.py "$RUNNER_TEMP/replay/NexGenVideo.app" Tests/PrivateFixtures/hang-recording.enc "$RUNNER_TEMP/evidence" --match-geometry
          python3 scripts/verify_recorded_hang_result.py "$RUNNER_TEMP/evidence/result.json" --expect "${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-hang-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/evidence/result.json
            ${{ runner.temp }}/evidence/diagnostics.enc
          retention-days: 3
