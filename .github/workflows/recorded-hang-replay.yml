name: Recorded Hang Replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/recorded-hang-replay.yml
      - scripts/recorded_hang_replay.py
      - Tests/PrivateFixtures/hang-recording.enc

permissions:
  contents: read
  actions: read

concurrency:
  group: recorded-hang-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-release-evidence
          run-id: 34147561836
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/shipped
      - name: Replay captured states in shipped signed app
        env:
          NGV_HANG_FIXTURE_KEY: ${{ secrets.NGV_HANG_FIXTURE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 -m venv "$RUNNER_TEMP/replay-python"
          source "$RUNNER_TEMP/replay-python/bin/activate"
          pip install --quiet cryptography==46.0.5
          ditto -x -k "$RUNNER_TEMP/shipped/diagnostic-app.zip" "$RUNNER_TEMP/shipped"
          python3 scripts/recorded_hang_replay.py "$RUNNER_TEMP/shipped/NexGenVideo.app" Tests/PrivateFixtures/hang-recording.enc "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-hang-baseline
          path: |
            ${{ runner.temp }}/evidence/result.json
            ${{ runner.temp }}/evidence/diagnostics.enc
          retention-days: 3
