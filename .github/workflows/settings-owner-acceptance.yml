name: Settings and Pack Owner Acceptance

on:
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: Run containing the already built workspace-ui-app artifact
        required: true
        type: string
      runtime_artifact:
        description: Exact same-source app and pack distribution artifact
        type: string
        default: workspace-ui-app
      acceptance_scope:
        description: Native cases to verify or resume independently
        type: choice
        options: [all, settings, settings100, settings125, settings150, packrecovery, packrecovery100, packrecovery125, packrecovery150, packresume172, packresume172100, packresume172125, packresume172150]
        default: all
      release_binding:
        description: Explicit final-DMG binding supplied by the CI Batch preflight
        type: string
        default: ''
      identity_artifact_id:
        type: string
        default: ''
      identity_sha256:
        type: string
        default: ''
  workflow_call:
    inputs:
      runtime_run_id:
        type: string
        default: ''
      runtime_artifact:
        type: string
        default: workspace-ui-app
      acceptance_scope:
        type: string
        default: all
      release_binding:
        type: string
        default: ''
      identity_artifact_id:
        type: string
        default: ''
      identity_sha256:
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: settings-owner-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
    steps:
      - name: Require complete signed Settings preflight inputs
        env:
          NGV_BINDING: ${{ inputs.release_binding }}
          NGV_IDENTITY: ${{ inputs.identity_artifact_id }}
          NGV_IDENTITY_SHA: ${{ inputs.identity_sha256 }}
        run: |
          python3 - <<'PY'
          import os, re
          binding, identity, digest = (os.environ[key] for key in ('NGV_BINDING', 'NGV_IDENTITY', 'NGV_IDENTITY_SHA'))
          if bool(binding) != bool(identity and digest) or (not binding and (identity or digest)):
              raise SystemExit('Signed Settings requires the complete reviewed preflight artifact.')
          if binding and (not re.fullmatch('[1-9][0-9]*', identity) or not re.fullmatch('[a-f0-9]{64}', digest)):
              raise SystemExit('Invalid Settings preflight identity.')
          PY
      - uses: actions/download-artifact@v4
        if: inputs.release_binding != ''
        with:
          artifact-ids: ${{ inputs.identity_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/settings-release-input
      - name: Bind the selected release to this workflow execution
        if: inputs.release_binding != ''
        env:
          NGV_BINDING: ${{ inputs.release_binding }}
          NGV_IDENTITY_SHA: ${{ inputs.identity_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          identity = pathlib.Path(os.environ['RUNNER_TEMP']) / 'settings-release-input/identity.json'
          if hashlib.sha256(identity.read_bytes()).hexdigest() != os.environ['NGV_IDENTITY_SHA']:
              raise SystemExit('Settings preflight bytes changed.')
          record = json.loads(identity.read_text())
          if (record.get('binding') != json.loads(os.environ['NGV_BINDING'])
                  or record.get('executionRunID') != os.environ['GITHUB_RUN_ID']
                  or record.get('harnessSourceSHA') != os.environ['GITHUB_SHA']
                  or record.get('attempt') != os.environ['GITHUB_RUN_ATTEMPT']
                  or os.environ['GITHUB_RUN_ATTEMPT'] != '1'):
              raise SystemExit('Settings preflight belongs to another input or execution.')
          PY
      - name: Select independently resumable native cases
        id: cases
        env:
          NGV_ACCEPTANCE_SCOPE: ${{ inputs.acceptance_scope }}
        run: |
          python3 - <<'PY'
          import json, os
          cases = [dict(id="settings100", scale=1, family="settings"),
                   dict(id="settings125", scale=1.25, family="settings"),
                   dict(id="settings150", scale=1.5, family="settings"),
                   dict(id="packrecovery100", scale=1, family="packrecovery"),
                   dict(id="packrecovery125", scale=1.25, family="packrecovery"),
                   dict(id="packrecovery150", scale=1.5, family="packrecovery"),
                   dict(id="packresume172100", scale=1, family="packresume172"),
                   dict(id="packresume172125", scale=1.25, family="packresume172"),
                   dict(id="packresume172150", scale=1.5, family="packresume172")]
          for case in cases:
              resume = case["family"] == "packresume172"
              case["baseline_profile"] = "known-preview172-approved-resume" if resume else "stable-compatible"
              case["baseline_version"] = "0.5.16" if resume else "0.5.8"
          scope = os.environ["NGV_ACCEPTANCE_SCOPE"]
          if scope not in {"all", "settings", "packrecovery", "packresume172", *(case["id"] for case in cases)}:
              raise SystemExit("Unknown native Settings/Recovery acceptance scope")
          selected = [case for case in cases if scope == "all" or case["id"] == scope
                      or scope == case["family"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("matrix=" + json.dumps(dict(include=selected)) + "\n")
          PY
      - name: Retain separately acquired original component evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: retained-origin-settings-owner-acceptance-${{ github.job }}-${{ strategy.job-index || 0 }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-packaging-supplements/
          if-no-files-found: ignore
          retention-days: 90

  acceptance:
    needs: cases
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cases.outputs.matrix) }}
    name: Native ${{ matrix.id }}
    runs-on: macrunner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-test-python
      - uses: actions/download-artifact@v4
        if: inputs.release_binding == ''
        with:
          name: ${{ inputs.runtime_artifact }}
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/settings-runtime
      - uses: ./.github/actions/prepare-bpy-source
        if: inputs.release_binding == ''
        with:
          directory: ${{ runner.temp }}/settings-runtime/qualified-source
          receipt: ${{ runner.temp }}/settings-runtime/bpy-source-receipt.json
      - name: Require the actual same-source CI distribution
        if: inputs.release_binding == ''
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          if [ -f "$RUNNER_TEMP/settings-runtime/qualified-source/bpy-source-consumer-reused.json" ]; then
            python3 scripts/consume_bpy_distributable_source.py --verify-reuse \
              --output-directory "$RUNNER_TEMP/settings-runtime/qualified-source" --source-sha "$GITHUB_SHA" \
              --reuse-evidence "$RUNNER_TEMP/settings-evidence/bpy-source-consumer-reused.json"
          else
          python3 scripts/verify_bpy_distributable_source.py \
            "$RUNNER_TEMP/settings-runtime/qualified-source/NexGenVideo-bpy-5.2.2-corresponding-source.tar" \
            "$RUNNER_TEMP/settings-runtime/qualified-source/NexGenVideo-bpy-5.2.2-corresponding-source.manifest.json"
          fi
          tar -xzf "$RUNNER_TEMP/settings-runtime/workspace-ui.tar.gz" -C "$RUNNER_TEMP/settings-runtime"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NGVSourceCommit' "$RUNNER_TEMP/settings-runtime/NexGenVideo.app/Contents/Info.plist")" = "$GITHUB_SHA" ]
      - uses: actions/download-artifact@v4
        if: inputs.release_binding != ''
        with:
          artifact-ids: ${{ inputs.identity_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/settings-release-input
      - name: Restore the exact final DMG runtime and target pack
        if: inputs.release_binding != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NGV_IDENTITY_SHA: ${{ inputs.identity_sha256 }}
        run: |
          python3 scripts/release_acceptance_identity.py restore --identity "$RUNNER_TEMP/settings-release-input" \
            --identity-sha256 "$NGV_IDENTITY_SHA" --output "$RUNNER_TEMP/settings-runtime"
      - name: Prepare real published baseline and unchanged CI target ZIPs
        id: packs
        env:
          GH_TOKEN: ${{ github.token }}
          NGV_BASELINE_PROFILE: ${{ matrix.baseline_profile }}
          NGV_BASELINE_VERSION: ${{ matrix.baseline_version }}
        run: |
          python3 scripts/prepare_settings_pack_artifacts.py \
            --current-pack "$RUNNER_TEMP/settings-runtime/plugins/musicvideo.ngvpack" \
            --baseline-profile "$NGV_BASELINE_PROFILE" --baseline-version "$NGV_BASELINE_VERSION" \
            --output "$RUNNER_TEMP/settings-packs" --github-output "$GITHUB_OUTPUT"
      - name: Exercise Settings controls and exact pack update/removal
        if: matrix.family == 'settings'
        env:
          NGV_BASELINE_PACK: ${{ steps.packs.outputs.baseline }}
          NGV_TARGET_PACK: ${{ steps.packs.outputs.target }}
          NGV_SCALE: ${{ matrix.scale }}
          NGV_RELEASE_BINDING: ${{ inputs.release_binding }}
        run: |
          identity=()
          if [ -n "$NGV_RELEASE_BINDING" ]; then
            test -f "$RUNNER_TEMP/settings-runtime/acceptance-input.json"
            identity+=(--runtime-identity "$RUNNER_TEMP/settings-runtime/acceptance-input.json")
          fi
          python3 scripts/settings_owner_acceptance.py \
            --executable "$RUNNER_TEMP/settings-runtime/NexGenVideo.app/Contents/MacOS/NexGenVideo" \
            --output "$RUNNER_TEMP/settings-evidence" --baseline-pack-zip "$NGV_BASELINE_PACK" \
            --target-pack-zip "$NGV_TARGET_PACK" --scale "$NGV_SCALE" \
            --target-pack-root "$RUNNER_TEMP/settings-runtime/plugins/musicvideo.ngvpack" "${identity[@]}"
      - name: Exercise genuine native upgrade and Recovery restart
        if: matrix.family == 'packrecovery' || matrix.family == 'packresume172'
        env:
          NGV_SCALE: ${{ matrix.scale }}
          NGV_BASELINE_PACK: ${{ steps.packs.outputs.baseline }}
          NGV_TARGET_PACK: ${{ steps.packs.outputs.target }}
          NGV_RECOVERY_SCENARIO: ${{ matrix.baseline_profile }}
          NGV_RELEASE_BINDING: ${{ inputs.release_binding }}
        run: |
          identity=()
          if [ -n "$NGV_RELEASE_BINDING" ]; then
            test -f "$RUNNER_TEMP/settings-runtime/acceptance-input.json"
            identity+=(--runtime-identity "$RUNNER_TEMP/settings-runtime/acceptance-input.json")
          fi
          python3 scripts/pack_recovery_owner_acceptance.py \
            --executable "$RUNNER_TEMP/settings-runtime/NexGenVideo.app/Contents/MacOS/NexGenVideo" \
            --output "$RUNNER_TEMP/settings-evidence" --baseline-pack-zip "$NGV_BASELINE_PACK" \
            --target-pack-zip "$NGV_TARGET_PACK" --scale "$NGV_SCALE" \
            --scenario "$NGV_RECOVERY_SCENARIO" --pack-pair "$RUNNER_TEMP/settings-packs/pack-pair.json" \
            --target-pack-root "$RUNNER_TEMP/settings-runtime/plugins/musicvideo.ngvpack" "${identity[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-owner-${{ matrix.id }}-evidence
          path: |
            ${{ runner.temp }}/settings-evidence/**
            ${{ runner.temp }}/settings-packs/pack-pair.json
            ${{ runner.temp }}/settings-runtime/acceptance-input.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain separately acquired original component evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: retained-origin-settings-owner-acceptance-${{ github.job }}-${{ strategy.job-index || 0 }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-packaging-supplements/
          if-no-files-found: ignore
          retention-days: 90
