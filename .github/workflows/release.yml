          [ "$CHANGED_PATHS" = "$PLIST" ] \
            || { echo "::error::Release build mutated tracked files beyond $PLIST"; exit 1; }
          echo "BUILD_NUMBER=$NEW" >> "$GITHUB_ENV"

      - name: Bind saved notarization
        if: inputs.notary_progress_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARY_PROGRESS_RUN: ${{ inputs.notary_progress_run_id }}
        run: python3 scripts/release_checkpoint.py prepare-notary --run-id "$NOTARY_PROGRESS_RUN" --root "$RUNNER_TEMP/release-notary-binding"

      - name: Bind signed build input
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_BUILD_RUN: ${{ needs.release-gate.outputs.restored-build-run || inputs.signed_build_run_id || github.run_id }}
          RELEASE_NOTARY_BINDING: ${{ inputs.notary_progress_run_id != '' && format('{0}/release-notary-binding', runner.temp) || '' }}
        run: python3 scripts/release_checkpoint.py prepare --run-id "$SIGNED_BUILD_RUN" --root "$RUNNER_TEMP/release-signed-binding"

      - name: Restore exact signed build
        id: signed-input
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_checkpoint.py restore --root "$RUNNER_TEMP/release-signed-binding"

      - name: Record immutable original-product restore
        if: inputs.retained_product_source_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/retained_packaging.py restored --root "$RUNNER_TEMP/retained-packaging" --signed-root "$RUNNER_TEMP/release-signed-binding"

      - name: Retain original-product restore proof
        if: always() && inputs.retained_product_source_sha != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packaging-restored-proof
          path: ${{ runner.temp }}/retained-packaging/restored
          if-no-files-found: ignore
          retention-days: 90

      - name: Retain complete original parent proof archives
        if: always() && inputs.retained_product_source_sha != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packaging-parent-archives
          path: ${{ runner.temp }}/retained-packaging/parents
          if-no-files-found: ignore
          retention-days: 90

      - name: Restore saved notarization and DMG
        id: restore-notary
        if: inputs.notary_progress_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_checkpoint.py restore-notary --root "$RUNNER_TEMP/release-notary-binding"

      - uses: ./.github/actions/prepare-bpy-source
        with:
          directory: .build/bpy-source
          receipt: .build/bpy-source/bpy-source-receipt.json

      - name: Verify the exact retained stapled format pack
        if: env.NGV_COMPILED_APP_RELEASE == 'true'
        run: python3 scripts/compiled_app_release.py verify-pack --root .build/plugins

      - name: Notarize and staple downloadable format packs
        if: steps.restore-notary.outputs.dmg_present != 'true' && env.NGV_COMPILED_APP_RELEASE != 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          for PACK_ZIP in .build/plugins/*.ngvpack.zip; do
            [ -f "$PACK_ZIP" ] \
              || { echo "::error::no format-pack ZIP was assembled"; exit 1; }
            PACK_BUNDLE="${PACK_ZIP%.zip}"
            PACK_ID="$(basename "$PACK_BUNDLE" .ngvpack)"
            PACK_ENTRY=".build/plugins/${PACK_ID}.entry.json"
            [ -d "$PACK_BUNDLE" ] \
              || { echo "::error::missing bundle for $PACK_ZIP"; exit 1; }
            [ -f "$PACK_ENTRY" ] \
              || { echo "::error::missing catalog entry for $PACK_ZIP"; exit 1; }

            echo "notarizing $PACK_ZIP"
            scripts/notarize.sh "$PACK_ZIP"

            # Apple can notarize a ZIP but cannot staple the ZIP itself. Staple the nested bundle,
            # then rebuild the exact archive that users download and refresh its catalog checksum.
            xcrun stapler staple "$PACK_BUNDLE"
            xcrun stapler validate "$PACK_BUNDLE"
            codesign --verify --strict --verbose=2 "$PACK_BUNDLE"
            rm -f "$PACK_ZIP"
            /usr/bin/ditto -c -k --keepParent "$PACK_BUNDLE" "$PACK_ZIP"
            PACK_SHA="$(shasum -a 256 "$PACK_ZIP" | awk '{print $1}')"
            python3 - "$PACK_ENTRY" "$PACK_SHA" <<'PY'
          import json
          import sys

          path, sha = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              entry = json.load(handle)
          entry["sha256"] = sha
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(entry, handle, indent=2)
              handle.write("\n")
          PY
            echo "notarized ${PACK_ID}.ngvpack sha256=$PACK_SHA"
          done

      - name: Verify pack links the SHARED engine (guards the PackEntry-cast regression)
        run: |
          set -euo pipefail
          # Same Mach-O invariant ci.yml asserts on the ad-hoc pack, now on the SIGNED release pack:
          # a `.ngvpack` must link NexGenEngine as ONE shared dynamic image with the app, not statically
          # absorb it. If absorbed, the pack carries its own `PackEntry` (ObjC `NGVPackEntry`) class, the
          # host's load-time `bundle.principalClass as? PackEntry.Type` cast fails ("entry point not
          # found"), and the pack silently never activates.
          PACK_BIN="$(ls .build/plugins/*.ngvpack/Contents/MacOS/* | head -1)"
          APP_BIN=".build/NexGenVideo.app/Contents/MacOS/NexGenVideo"
          echo "pack binary: $PACK_BIN"
          otool -L "$PACK_BIN" | grep -q '@rpath/libNexGenEngine.dylib' \
            || { echo "::error::pack does not dynamically link libNexGenEngine.dylib (engine statically absorbed)"; exit 1; }
          if nm "$PACK_BIN" | grep -E ' [SDTtbd] _OBJC_CLASS_\$_NGVPackEntry$'; then
            echo "::error::NexGenEngine is statically absorbed — pack defines its own NGVPackEntry class"; exit 1
          fi
          otool -L "$APP_BIN" | grep -q '@rpath/libNexGenEngine.dylib' \
            || { echo "::error::app does not dynamically link libNexGenEngine.dylib"; exit 1; }
          echo "OK: NexGenEngine is one shared dynamic image across app + pack"

      - name: Load-test — the SIGNED app actually loads the SIGNED pack from an EXTERNAL dir
        run: |
          set -euo pipefail
          # This is the check that was MISSING here: release.yml published the pack the app reads
          # without ever loading it, so the 0.7.6-class rpath regression (twice in the field) could ship
          # inside a signed DMG. It runs BEFORE the publish step, so a pack that can't load aborts the
          # whole release before DMG creation, notarization, or publishing.
          #
          # Stronger than ci.yml's ad-hoc run: pack AND app are Developer-ID signed here, so loading the
          # pack into the hardened-runtime app also exercises LIBRARY VALIDATION (same Team ID) — a
          # signing mismatch that ci.yml cannot see fails right here.
          #
          # Field layout: the pack lives OUTSIDE the app bundle, so its @rpath/libNexGenEngine.dylib must
          # resolve to the host's Contents/Frameworks via @executable_path/../Frameworks. The real app
          # binary loads it (gate → Bundle.load() → principalClass cast → makePack()) and exits 0 only on
          # success.
          PACK_ZIP="$(ls .build/plugins/*.ngvpack.zip | head -1)"
          PACK_EXTRACT="$(mktemp -d)"
          /usr/bin/ditto -x -k "$PACK_ZIP" "$PACK_EXTRACT"
          PACK_BUNDLE="$(ls -d "$PACK_EXTRACT"/*.ngvpack 2>/dev/null | head -1 || true)"
          [ -n "$PACK_BUNDLE" ] \
            || { echo "::error::published pack ZIP does not contain an .ngvpack bundle"; exit 1; }
          codesign --verify --strict --verbose=2 "$PACK_BUNDLE"
          xcrun stapler validate "$PACK_BUNDLE"
          PACK_BIN="$(ls "$PACK_BUNDLE"/Contents/MacOS/* 2>/dev/null | head -1 || true)"
          [ -n "$PACK_BIN" ] \
            || { echo "::error::published pack ZIP has no executable"; exit 1; }
          otool -l "$PACK_BIN" | grep -q 'path @executable_path/../Frameworks' \
            || { echo "::error::pack is missing the @executable_path/../Frameworks rpath — it can't reach the host engine"; exit 1; }
          QUARANTINE="0083;$(printf '%x' "$(date +%s)");GitHub Actions;${{ github.server_url }}"
          /usr/bin/xattr -r -w com.apple.quarantine "$QUARANTINE" "$PACK_BUNDLE"
          /usr/bin/xattr -p com.apple.quarantine "$PACK_BUNDLE"
          echo "loading the notarized, quarantined archive with the real signed app binary…"
          NGV_SELFTEST_PACK="$PACK_BUNDLE" .build/NexGenVideo.app/Contents/MacOS/NexGenVideo
          echo "OK: the signed app loaded the notarized pack under download quarantine"

      - name: Verify pack assembly did not mutate tracked source
        run: scripts/verify_tracked_source_state.sh Sources/NexGenVideo/Resources/Info.plist

      - name: Notarize and staple app
        if: steps.restore-notary.outputs.dmg_present != 'true'
        timeout-minutes: 20
        run: scripts/bundle.sh release --notarize-app

      - name: Build and sign DMG
        if: steps.restore-notary.outputs.dmg_present != 'true'
        run: scripts/bundle.sh release --build-dmg

      - name: Record DMG before notarization
        run: python3 scripts/release_checkpoint.py create-dmg --root "$RUNNER_TEMP/release-dmg-input"

      - name: Retain DMG before notarization
        id: saved-dmg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dmg-input-${{ needs.release-gate.outputs.product-source-sha }}
          path: ${{ runner.temp }}/release-dmg-input/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Bind uploaded DMG checkpoint proof
        if: inputs.retained_product_source_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_PAYLOAD_ARTIFACT: ${{ steps.saved-dmg.outputs.artifact-id }}
          DMG_PAYLOAD_DIGEST: ${{ steps.saved-dmg.outputs.artifact-digest }}
        run: python3 scripts/retained_packaging.py dmg-proof --root "$RUNNER_TEMP/retained-packaging" --artifact-id "$DMG_PAYLOAD_ARTIFACT" --artifact-sha256 "$DMG_PAYLOAD_DIGEST"

      - name: Retain exact DMG checkpoint proof
        if: inputs.retained_product_source_sha != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dmg-proof-${{ needs.release-gate.outputs.product-source-sha }}
          path: ${{ runner.temp }}/retained-packaging/dmg-proof
          if-no-files-found: error
          retention-days: 90

      - name: Notarize and staple DMG
        timeout-minutes: 20
        run: scripts/bundle.sh release --notarize-dmg

      - name: Retain notarization submissions
        if: always() && steps.signed-input.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notary-state-${{ needs.release-gate.outputs.product-source-sha }}
          path: ${{ runner.temp }}/release-notary-state/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify the exact DMG users install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 .build/NexGenVideo.app
          codesign --verify --strict --verbose=2 .build/NexGenVideo.app/Contents/Frameworks/libNexGenEngine.dylib
          codesign --verify --verbose=2 .build/NexGenVideo.dmg
          xcrun stapler validate .build/NexGenVideo.app
          xcrun stapler validate .build/NexGenVideo.dmg
          hdiutil verify .build/NexGenVideo.dmg

          NGV_RELEASE_DMG_SHA256="$(shasum -a 256 .build/NexGenVideo.dmg | awk '{print $1}')"
          MOUNT_POINT="$(mktemp -d)"
          hdiutil attach .build/NexGenVideo.dmg -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          cleanup_mount() {
            hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true
            rmdir "$MOUNT_POINT" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT

          [ -d "$MOUNT_POINT/NexGenVideo.app" ] \
            || { echo "::error::DMG does not contain NexGenVideo.app"; exit 1; }
          [ -L "$MOUNT_POINT/Applications" ] \
            || { echo "::error::DMG does not contain the Applications symlink"; exit 1; }
          [ "$(readlink "$MOUNT_POINT/Applications")" = "/Applications" ] \
            || { echo "::error::DMG Applications symlink has the wrong target"; exit 1; }

          INSTALL_CHECK="$(mktemp -d)"
          INSTALL_APP="$INSTALL_CHECK/NexGenVideo.app"
          NGV_RELEASE_MOUNTED_APP_TREE_SHA256="$(python3 scripts/external-gui/acceptance.py tree-sha256 --app "$MOUNT_POINT/NexGenVideo.app")"
          ditto "$MOUNT_POINT/NexGenVideo.app" "$INSTALL_APP"
          [ "$(python3 scripts/external-gui/acceptance.py tree-sha256 --app "$INSTALL_APP")" = "$NGV_RELEASE_MOUNTED_APP_TREE_SHA256" ]
          cleanup_mount
          trap - EXIT
          codesign --verify --strict --verbose=2 "$INSTALL_APP"
          codesign --verify --strict --verbose=2 "$INSTALL_APP/Contents/Frameworks/libNexGenEngine.dylib"
          xcrun stapler validate "$INSTALL_APP"
          spctl -a -vvv -t exec "$INSTALL_APP"
          scripts/verify_app_slice.sh "$INSTALL_APP"
          scripts/verify_bpy_bundle.sh "$INSTALL_APP" --distribution
          INSTALLED_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INSTALL_APP/Contents/Info.plist")"
          INSTALLED_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INSTALL_APP/Contents/Info.plist")"
          [ "$INSTALLED_VERSION" = "$REL_VERSION" ] \
            || { echo "::error::DMG app version is $INSTALLED_VERSION, expected $REL_VERSION"; exit 1; }
          [ "$INSTALLED_BUILD" = "$BUILD_NUMBER" ] \
            || { echo "::error::DMG app build is $INSTALLED_BUILD, expected $BUILD_NUMBER"; exit 1; }

          PACK_ZIP="$(ls .build/plugins/*.ngvpack.zip | head -1)"
          NGV_RELEASE_PACK_ZIP_SHA256="$(shasum -a 256 "$PACK_ZIP" | awk '{print $1}')"
          PACK_EXTRACT="$(mktemp -d)"
          /usr/bin/ditto -x -k "$PACK_ZIP" "$PACK_EXTRACT"
          PACK_BUNDLE="$(ls -d "$PACK_EXTRACT"/*.ngvpack 2>/dev/null | head -1 || true)"
          [ -n "$PACK_BUNDLE" ] \
            || { echo "::error::published pack ZIP does not contain an .ngvpack bundle"; exit 1; }
          NGV_RELEASE_PACK_TREE_SHA256="$(python3 scripts/external-gui/acceptance.py tree-sha256 --app "$PACK_BUNDLE")"
          xcrun stapler validate "$PACK_BUNDLE"
          QUARANTINE="0083;$(printf '%x' "$(date +%s)");GitHub Actions;${{ github.server_url }}"
          /usr/bin/xattr -r -w com.apple.quarantine "$QUARANTINE" "$PACK_BUNDLE"
          NGV_SELFTEST_PACK="$PACK_BUNDLE" \
            "$INSTALL_APP/Contents/MacOS/NexGenVideo"
          PREVIOUS_DIR="$(mktemp -d)"
          PREVIOUS_PACK="$(bash scripts/fetch_previous_pack.sh \
            "$PACK_BUNDLE" "$PREVIOUS_DIR")"
          while IFS= read -r COMPATIBLE_PACK; do
            NGV_SELFTEST_LOAD_ONLY=1 NGV_SELFTEST_PACK="$COMPATIBLE_PACK" \
              "$INSTALL_APP/Contents/MacOS/NexGenVideo"
          done < <(find "$PREVIOUS_DIR/compatible" -maxdepth 1 -type d -name '*.ngvpack' | sort)
          while IFS= read -r INCOMPATIBLE_PACK; do
            NGV_SELFTEST_EXPECT_ENGINE_INCOMPATIBLE=1 \
              NGV_SELFTEST_PACK="$INCOMPATIBLE_PACK" \
              "$INSTALL_APP/Contents/MacOS/NexGenVideo"
          done < <(find "$PREVIOUS_DIR/incompatible" -maxdepth 1 -type d -name '*.ngvpack' | sort)
          bash scripts/relaunch_selftest.sh \
            "$INSTALL_APP" \
            "$PREVIOUS_PACK" \
            "$PACK_BUNDLE"
          NGV_CHECKED_PRODUCT_SOURCE="$(python3 scripts/retained_packaging.py source)"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NGVSourceCommit' "$INSTALL_APP/Contents/Info.plist")" = "$NGV_CHECKED_PRODUCT_SOURCE" ]
          [ "$(basename "$PACK_BUNDLE")" = musicvideo.ngvpack ]
          [ "$(python3 scripts/external-gui/acceptance.py tree-sha256 --app "$PACK_BUNDLE")" = "$NGV_RELEASE_PACK_TREE_SHA256" ]
          mkdir -p "$INSTALL_CHECK/plugins"
          ditto "$PACK_BUNDLE" "$INSTALL_CHECK/plugins/musicvideo.ngvpack"
          [ "$(python3 scripts/external-gui/acceptance.py tree-sha256 --app "$INSTALL_CHECK/plugins/musicvideo.ngvpack")" = "$NGV_RELEASE_PACK_TREE_SHA256" ]
          {
            echo "NGV_RELEASE_INSTALL_CHECK=$INSTALL_CHECK"
            echo "NGV_RELEASE_DMG_SHA256=$NGV_RELEASE_DMG_SHA256"
            echo "NGV_RELEASE_MOUNTED_APP_TREE_SHA256=$NGV_RELEASE_MOUNTED_APP_TREE_SHA256"
            echo "NGV_RELEASE_PACK_BUNDLE=$PACK_BUNDLE"
            echo "NGV_RELEASE_PACK_TREE_SHA256=$NGV_RELEASE_PACK_TREE_SHA256"
            echo "NGV_RELEASE_PACK_ZIP=$PACK_ZIP"
            echo "NGV_RELEASE_PACK_ZIP_SHA256=$NGV_RELEASE_PACK_ZIP_SHA256"
          } >> "$GITHUB_ENV"
          echo "OK: mounted DMG layout, copied app, Gatekeeper assessment, and quarantined pack load"

      - name: Verify DMG checks did not mutate tracked source
        run: scripts/verify_tracked_source_state.sh Sources/NexGenVideo/Resources/Info.plist

      - name: Transfer the verified installed DMG app for workspace acceptance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-workspace-transfer"
          tar -czf "$RUNNER_TEMP/release-workspace-transfer/workspace-ui.tar.gz" \
            -C "$NGV_RELEASE_INSTALL_CHECK" NexGenVideo.app plugins/musicvideo.ngvpack
          cp .build/bpy-source/bpy-source-receipt.json "$RUNNER_TEMP/release-workspace-transfer/"
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          sys.path.insert(0, str(pathlib.Path('scripts/external-gui').resolve()))
          from acceptance import metadata, sha256, tree_sha256
          from release_checkpoint import product_source

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-workspace-transfer'
          installed = pathlib.Path(os.environ['NGV_RELEASE_INSTALL_CHECK'])
          product = product_source()
          app = metadata(installed / 'NexGenVideo.app', product)
          dmg = pathlib.Path('.build/NexGenVideo.dmg')
          pack_zip = pathlib.Path(os.environ['NGV_RELEASE_PACK_ZIP'])
          if sha256(dmg) != os.environ['NGV_RELEASE_DMG_SHA256']:
              raise SystemExit('DMG changed after its installed-app checks')
          if app['treeSHA256'] != os.environ['NGV_RELEASE_MOUNTED_APP_TREE_SHA256']:
              raise SystemExit('Copied app differs from the mounted final DMG app')
          if sha256(pack_zip) != os.environ['NGV_RELEASE_PACK_ZIP_SHA256']:
              raise SystemExit('Final pack ZIP changed after its load checks')
          pack_tree = tree_sha256(installed / 'plugins/musicvideo.ngvpack')
          if (pack_tree != os.environ['NGV_RELEASE_PACK_TREE_SHA256']
              or pack_tree != tree_sha256(pathlib.Path(os.environ['NGV_RELEASE_PACK_BUNDLE']))):
              raise SystemExit('Transferred pack differs from the final checked pack')
          receipt = {'schema': 'nexgenvideo/workspace-ui-input/1',
                     'sourceSHA': product,
                     'archiveSHA256': sha256(root / 'workspace-ui.tar.gz'),
                     'appTreeSHA256': app['treeSHA256']}
          provenance = None
          if os.environ.get('RETAINED_PACKAGING_ROOT'):
              from retained_packaging import record_complete
              provenance = record_complete(pathlib.Path(os.environ['RETAINED_PACKAGING_ROOT']), app,
                  receipt['archiveSHA256'], sha256(root / 'bpy-source-receipt.json'), pack_zip)
              receipt.update(schema='nexgenvideo/workspace-ui-input/2', producerSourceSHA=os.environ['GITHUB_SHA'],
                             packagingProvenanceSHA256=provenance)
          runtime_input = root / 'workspace-ui-input.json'
          runtime_input.write_text(json.dumps(receipt, sort_keys=True) + '\n')
          proof = {'schema': 'nexgenvideo/release-workspace-producer/1',
                   'sourceSHA': product, 'runID': os.environ['GITHUB_RUN_ID'],
                   'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                   'dmgSHA256': sha256(dmg), 'mountedAppTreeSHA256': app['treeSHA256'],
                   'app': app, 'archiveSHA256': receipt['archiveSHA256'],
                   'runtimeInputSHA256': sha256(runtime_input),
                   'bpySourceReceiptSHA256': sha256(root / 'bpy-source-receipt.json'),
                   'packArchive': pack_zip.name, 'packArchiveSHA256': sha256(pack_zip),
                   'packTreeSHA256': pack_tree}
          if provenance is not None:
              proof.update(schema='nexgenvideo/release-workspace-producer/2', producerSourceSHA=os.environ['GITHUB_SHA'],
                           packagingProvenanceSHA256=provenance)
          pathlib.Path('.build/release-workspace-producer.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - name: Retain complete packaging provenance
        id: packaging-proof
        if: inputs.retained_product_source_sha != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packaging-provenance
          path: ${{ runner.temp }}/retained-packaging/complete
          if-no-files-found: error
          retention-days: 90
      - name: Upload final DMG app for selected workspace acceptance
        id: workspace-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-ui-app
          path: |
            ${{ runner.temp }}/release-workspace-transfer/workspace-ui.tar.gz
            ${{ runner.temp }}/release-workspace-transfer/workspace-ui-input.json
            ${{ runner.temp }}/release-workspace-transfer/bpy-source-receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload final DMG workspace producer binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-workspace-producer
          path: .build/release-workspace-producer.json
          if-no-files-found: error
          retention-days: 14

      - name: Bind the exact DMG for the external user journey
        id: gui-input
        run: |
          set -euo pipefail
          DMG_SHA256="$(shasum -a 256 .build/NexGenVideo.dmg | awk '{print $1}')"
          [ "$(jq -r .dmgSHA256 .build/release-workspace-producer.json)" = "$DMG_SHA256" ]
          echo "dmg_sha256=$DMG_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: journey-artifact
        with:
          name: release-user-journey-input
          path: .build/NexGenVideo.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish isolated preview plugin channel
        if: ${{ inputs.artifact_only == false && env.REL_DRY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/$PLUGIN_CHANNEL_TAG"
          python3 scripts/publish_plugin_catalog.py .build/plugins "$BASE" .build/plugins/catalog.json
          gh release view "$PLUGIN_CHANNEL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$PLUGIN_CHANNEL_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "NexGenVideo $REL_VERSION preview plugin channel" \
              --notes "Build-specific preview assets for Actions run ${{ github.run_id }}."
          gh release upload "$PLUGIN_CHANNEL_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            .build/plugins/*-*.ngvpack.zip \
            --clobber
          if compgen -G ".build/plugins/*-*.badge.png" >/dev/null; then
            gh release upload "$PLUGIN_CHANNEL_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              .build/plugins/*-*.badge.png \
              --clobber
          fi
          gh release upload "$PLUGIN_CHANNEL_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            .build/plugins/catalog.json \
            --clobber

      - name: EdDSA-sign DMG for Sparkle
        if: ${{ env.SPARKLE_PRIV_DER != '' }}
        run: |
          set -euo pipefail
          SIG="$("$DMG_PYTHON" scripts/sparkle_ed25519.py sign "$SPARKLE_PRIV_DER" .build/NexGenVideo.dmg)"
          {
            echo "ED_SIGNATURE=$SIG"
            echo "DMG_LENGTH=$(stat -f%z .build/NexGenVideo.dmg)"
          } >> "$GITHUB_ENV"

      - name: Stage stable plugin publication transaction
        if: ${{ inputs.artifact_only == false && env.REL_DRY == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/verify_tracked_source_state.sh Sources/NexGenVideo/Resources/Info.plist
          BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/plugins"
          PUBLICATION_DIR=".build/publication"
          PENDING_ASSET="catalog-${REL_VERSION}.pending.json"
          TRANSACTION_ASSET="release-${REL_VERSION}.transaction.json"
          mkdir -p "$PUBLICATION_DIR"

          if gh release view plugins \
            --repo "$GITHUB_REPOSITORY" \
            --json assets > "$PUBLICATION_DIR/assets.json" 2>/dev/null; then
            if jq -e 'any(.assets[]; .name == "catalog.json")' \
              "$PUBLICATION_DIR/assets.json" >/dev/null; then
              gh release download plugins \
                --repo "$GITHUB_REPOSITORY" \
                --pattern catalog.json \
                --dir "$PUBLICATION_DIR"
            else
              if jq -e 'any(.assets[]; .name | test("^release-.*[.]complete[.]json$"))' \
                "$PUBLICATION_DIR/assets.json" >/dev/null; then
                echo "::error::stable plugin catalog is missing after a completed publication"
                exit 1
              fi
              printf '%s\n' \
                '{"schema":"plugins/v2","plugins":[]}' \
                > "$PUBLICATION_DIR/catalog.json"
            fi
          else
            gh release create plugins \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "NexGenVideo — plugin channel" \
              --notes "Stable append-only plugin catalog."
            printf '%s\n' \
              '{"schema":"plugins/v2","plugins":[]}' \
              > "$PUBLICATION_DIR/catalog.json"
          fi
          python3 scripts/publish_plugin_catalog.py \
            .build/plugins \
            "$BASE" \
            "$PUBLICATION_DIR/$PENDING_ASSET" \
            --existing "$PUBLICATION_DIR/catalog.json"

          gh release upload plugins \
            --repo "$GITHUB_REPOSITORY" \
            .build/plugins/*-*.ngvpack.zip \
            --clobber
          if compgen -G ".build/plugins/*-*.badge.png" >/dev/null; then
            gh release upload plugins \
              --repo "$GITHUB_REPOSITORY" \
              .build/plugins/*-*.badge.png \
              --clobber
          fi

          python3 - \
            "$PUBLICATION_DIR/$TRANSACTION_ASSET" \
            "$REL_VERSION" \
            "$BUILD_NUMBER" \
            "$DMG_LENGTH" \
            "$(shasum -a 256 .build/NexGenVideo.dmg | awk '{print $1}')" \
            "$ED_SIGNATURE" \
            "$GITHUB_SHA" \
            "$(shasum -a 256 "$PUBLICATION_DIR/$PENDING_ASSET" | awk '{print $1}')" <<'PY'
          import json
          import glob
          import hashlib
          import os
          import sys

          path, version, build, length, dmg_sha, signature, source_sha, catalog_sha = sys.argv[1:]
          assets = []
          for pattern in (
              ".build/plugins/*-*.ngvpack.zip",
              ".build/plugins/*-*.badge.png",
          ):
              for asset_path in sorted(glob.glob(pattern)):
                  with open(asset_path, "rb") as handle:
                      digest = hashlib.sha256(handle.read()).hexdigest()
                  assets.append({
                      "name": os.path.basename(asset_path),
                      "sha256": digest,
                  })
          with open(path, "w", encoding="utf-8") as handle:
              json.dump({
                  "schema": "release-publication/3",
                  "version": version,
                  "tag": f"v{version}",
                  "build_number": build,
                  "dmg_length": length,
                  "dmg_sha256": dmg_sha,
                  "ed_signature": signature,
                  "source_sha": source_sha,
                  "catalog_sha256": catalog_sha,
                  "assets": assets,
              }, handle, indent=2)
              handle.write("\n")
          PY
          gh release upload plugins \
            --repo "$GITHUB_REPOSITORY" \
            "$PUBLICATION_DIR/$PENDING_ASSET" \
            "$PUBLICATION_DIR/$TRANSACTION_ASSET" \
            --clobber

      - name: Upload dry-run candidate for manual verification
        if: ${{ inputs.artifact_only == false && env.REL_DRY == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NexGenVideo-${{ env.REL_VERSION }}-dry-run
          path: |
            .build/NexGenVideo.dmg
            .build/plugins/*.ngvpack.zip
            .build/bpy-source/bpy-source-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Record unpublished candidate bytes
        if: ${{ inputs.artifact_only }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from release_checkpoint import product_source

          root = Path(".build")
          paths = [root / "NexGenVideo.dmg", root / "bpy-source/bpy-source-receipt.json",
                   root / "release-workspace-producer.json"]
          for pattern in (
              "plugins/*.ngvpack.zip",
              "plugins/*.entry.json",
              "bpy-source/NexGenVideo-bpy-5.2.2-corresponding-source.tar",
              "bpy-source/NexGenVideo-bpy-5.2.2-corresponding-source.manifest.json",
          ):
              matches = sorted(root.glob(pattern))
              if not matches:
                  raise SystemExit(f"missing candidate input: {pattern}")
              paths.extend(matches)
          paths.extend(sorted(root.glob("plugins/*.badge.png")))
          assets = []
          for path in paths:
              with path.open("rb") as handle:
                  digest = hashlib.file_digest(handle, "sha256").hexdigest()
              assets.append({"path": str(path.relative_to(root)), "sha256": digest,
                             "size": path.stat().st_size})
          for path in root.glob("plugins/*.entry.json"):
              entry = json.loads(path.read_text())
              archive = root / "plugins" / entry["zip"]
              with archive.open("rb") as handle:
                  digest = hashlib.file_digest(handle, "sha256").hexdigest()
              if digest != entry["sha256"]:
                  raise SystemExit(f"pack entry checksum mismatch: {path}")
          producer = json.loads((root / "release-workspace-producer.json").read_text())
          dmg = next(asset for asset in assets if asset["path"] == "NexGenVideo.dmg")
          if dmg["sha256"] != producer["dmgSHA256"]:
              raise SystemExit("candidate DMG differs from the checked workspace producer")
          receipt = {
              "schema": "nexgenvideo/artifact-only-candidate/1",
              "sourceSHA": product_source(),
              "runID": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "version": os.environ["REL_VERSION"],
              "buildNumber": os.environ["BUILD_NUMBER"],
              "pluginCatalogURL": os.environ["PLUGIN_CATALOG_URL"],
              "published": False,
              "assets": assets,
          }
          if os.environ.get('RETAINED_PACKAGING_ROOT'):
              receipt.update(schema='nexgenvideo/artifact-only-candidate/2', producerSourceSHA=os.environ['GITHUB_SHA'],
                             packagingProvenanceSHA256=os.environ['RETAINED_PACKAGING_COMPLETE_SHA256'])
          (root / "artifact-only-candidate.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Upload unpublished candidate
        if: ${{ inputs.artifact_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NexGenVideo-${{ env.REL_VERSION }}-artifact-only
          path: |
            .build/NexGenVideo.dmg
            .build/plugins/*.ngvpack.zip
            .build/plugins/*.entry.json
            .build/plugins/*.badge.png
            .build/artifact-only-candidate.json
            .build/release-workspace-producer.json
            .build/bpy-source/bpy-source-receipt.json
            .build/bpy-source/NexGenVideo-bpy-5.2.2-corresponding-source.tar
            .build/bpy-source/NexGenVideo-bpy-5.2.2-corresponding-source.manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Archive exact diagnostic app and symbols
        run: |
          ditto -c -k --keepParent .build/NexGenVideo.app .build/diagnostic-app.zip
          mkdir -p .build/diagnostic-symbols
          ditto .build/NexGenVideo.dSYM .build/diagnostic-symbols/NexGenVideo.dSYM
          ditto .build/NexGenVideoDiagnostics.dSYM .build/diagnostic-symbols/NexGenVideoDiagnostics.dSYM
          ditto .build/NexGenEngine.dSYM .build/diagnostic-symbols/NexGenEngine.dSYM
          ditto .build/MusicvideoPlugin.dSYM .build/diagnostic-symbols/MusicvideoPlugin.dSYM
          ditto -c -k --keepParent .build/diagnostic-symbols .build/diagnostic-symbols.zip
          dwarfdump --uuid .build/NexGenVideo.app/Contents/MacOS/NexGenVideo
          dwarfdump --uuid .build/NexGenVideo.dSYM

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: diagnostic-artifact
        with:
          name: diagnostic-release-evidence
          path: |
            .build/diagnostic-app.zip
            .build/diagnostic-symbols.zip
            .build/bpy-source/bpy-source-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Stage draft GitHub release
        if: ${{ inputs.artifact_only == false && env.REL_DRY == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$REL_VERSION"
          # Packs are NOT attached here: they went to the `plugins` channel above, which is what the
          # app actually reads. Attaching them to the version tag is what created the illusion that a
          # release shipped a pack fix (#168).
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            .build/NexGenVideo.dmg \
            .build/bpy-source/NexGenVideo-bpy-5.2.2-corresponding-source.tar \
            .build/bpy-source/NexGenVideo-bpy-5.2.2-corresponding-source.manifest.json \
            --draft \
            --title "NexGenVideo $TAG" \
            --notes "NexGenVideo $REL_VERSION (build ${BUILD_NUMBER})." \
            --target "$GITHUB_SHA"

      - name: Hand off stable publication transaction
        if: ${{ inputs.artifact_only == false && env.REL_DRY == 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-publication-${{ inputs.version }}
          path: |
            .build/publication/*.pending.json
            .build/publication/*.transaction.json
          if-no-files-found: error
          retention-days: 7

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "${SIGN_KEYCHAIN:-}" 2>/dev/null || true

  diagnostic-acceptance:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: macrunner
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: diagnostic-release-evidence
      - name: Rebind retained packaging before diagnostic app execution
        if: inputs.retained_product_source_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_SOURCE: ${{ needs.release.outputs.product_source_sha }}
          PROVENANCE_ID: ${{ needs.release.outputs.packaging_provenance_artifact_id }}
          PROVENANCE_SHA: ${{ needs.release.outputs.packaging_provenance_artifact_sha256 }}
          ARTIFACT_ID: ${{ needs.release.outputs.diagnostic_artifact_id }}
          ARTIFACT_SHA: ${{ needs.release.outputs.diagnostic_artifact_sha256 }}
        run: |
          python3 - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from retained_packaging import selectors, consumer_binding
          from retained_app_test_products import api
          from verify_diagnostic_candidate import verify_signed_bpy
          run_id = int(os.environ['GITHUB_RUN_ID'])
          selected = selectors(os.environ['GITHUB_SHA'], os.environ['PROVENANCE_ID'], os.environ['PROVENANCE_SHA'])
          consumer_binding(run_id, os.environ['PRODUCT_SOURCE'], selected, archive_root=Path('evidence/packaging-provenance'))
          run = api('actions/runs/' + str(run_id))
          jobs = api('actions/runs/' + str(run_id) + '/attempts/1/jobs?per_page=100')
          artifact = api('actions/artifacts/' + os.environ['ARTIFACT_ID'])
          verify_signed_bpy(run, jobs, artifact, run_id, os.environ['PRODUCT_SOURCE'], int(os.environ['ARTIFACT_ID']),
              os.environ['ARTIFACT_SHA'], [], packaging=selected)
          PYCODE
      - name: Verify signed production capture and exact symbolization
        run: |
          ditto -x -k diagnostic-app.zip .
          ditto -x -k diagnostic-symbols.zip .
          codesign --verify --strict --verbose=2 NexGenVideo.app
          xcrun stapler validate NexGenVideo.app
          python3 scripts/hang_diagnostic_acceptance.py NexGenVideo.app diagnostic-symbols/NexGenVideo.dSYM --output evidence
      - name: Exercise native Export Cancel, Retry and Reveal actions
        run: python3 scripts/export_actions_acceptance.py NexGenVideo.app --output evidence/export-actions.json
      - name: Verify generation batch pricing recovery
        shell: bash
        run: |
          set -euo pipefail
          NGV_SELFTEST_GENERATION_BATCH_RECOVERY=1 \
            NexGenVideo.app/Contents/MacOS/NexGenVideo \
            | grep -qx 'SELFTEST_GENERATION_BATCH_RECOVERY_OK'
      - name: Verify asynchronous termination, cancellation and restart
        if: ${{ !cancelled() }}
        env:
          PRODUCT_SOURCE: ${{ needs.release.outputs.product_source_sha }}
        run: python3 scripts/app_termination_acceptance.py NexGenVideo.app --output evidence/termination --product-source "$PRODUCT_SOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: diagnostic-runtime-acceptance
          path: |
            evidence/*.json
            evidence/*.log
            evidence/*.png
            evidence/capture-*.zip
            evidence/helper-recovery-recordings.zip
            evidence/termination/
          retention-days: 90

  bpy-runtime:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    uses: ./.github/workflows/bpy-runtime-acceptance.yml
    with:
      packaging_producer_source_sha: ${{ needs.release.outputs.packaging_producer_source_sha }}
      packaging_provenance_artifact_id: ${{ needs.release.outputs.packaging_provenance_artifact_id }}
      packaging_provenance_artifact_sha256: ${{ needs.release.outputs.packaging_provenance_artifact_sha256 }}
      runtime_run_id: ${{ inputs.retained_product_source_sha != '' && github.run_id || '' }}
      expected_source_sha: ${{ inputs.retained_product_source_sha != '' && needs.release.outputs.product_source_sha || '' }}
      app_artifact_id: ${{ inputs.retained_product_source_sha != '' && needs.release.outputs.diagnostic_artifact_id || '' }}
      app_artifact_sha256: ${{ inputs.retained_product_source_sha != '' && needs.release.outputs.diagnostic_artifact_sha256 || '' }}
      artifact: diagnostic-release-evidence
      app_zip: diagnostic-app.zip
      distribution: true

  external-user-acceptance:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/external-gui-acceptance.yml
    with:
      packaging_producer_source_sha: ${{ needs.release.outputs.packaging_producer_source_sha }}
      packaging_provenance_artifact_id: ${{ needs.release.outputs.packaging_provenance_artifact_id }}
      packaging_provenance_artifact_sha256: ${{ needs.release.outputs.packaging_provenance_artifact_sha256 }}
      runtime_run_id: ${{ inputs.retained_product_source_sha != '' && github.run_id || '' }}
      product_source_sha: ${{ inputs.retained_product_source_sha != '' && needs.release.outputs.product_source_sha || '' }}
      runtime_artifact_id: ${{ inputs.retained_product_source_sha != '' && needs.release.outputs.journey_artifact_id || '' }}
      runtime_artifact_sha256: ${{ inputs.retained_product_source_sha != '' && needs.release.outputs.journey_artifact_sha256 || '' }}
      verified_pr_run_id: ${{ inputs.retained_product_source_sha != '' && inputs.verified_pr_run_id || '' }}
      runtime_artifact: release-user-journey-input
      artifact_mode: dmg
      expected_dmg_sha256: ${{ needs.release.outputs.dmg_sha256 }}
      interface_scale: '1'
      test_bundle_run_id: ${{ inputs.test_bundle_run_id }}
      test_bundle_artifact_id: ${{ inputs.test_bundle_artifact_id }}
      test_bundle_artifact_sha256: ${{ inputs.test_bundle_artifact_sha256 }}

  chat-hang-replay:
    needs: [release, diagnostic-acceptance, bpy-runtime]
    if: ${{ !cancelled() && inputs.artifact_only && needs.release.result == 'success' && needs.diagnostic-acceptance.result == 'success' && needs.bpy-runtime.result == 'success' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/chat-hang-replay.yml
    with:
      packaging_producer_source_sha: ${{ needs.release.outputs.packaging_producer_source_sha }}
      packaging_provenance_artifact_id: ${{ needs.release.outputs.packaging_provenance_artifact_id }}
      packaging_provenance_artifact_sha256: ${{ needs.release.outputs.packaging_provenance_artifact_sha256 }}
      runtime_run_id: ${{ inputs.retained_product_source_sha != '' && github.run_id || '' }}
      runtime_source_sha: ${{ inputs.retained_product_source_sha != '' && needs.release.outputs.product_source_sha || '' }}
      runtime_artifact_id: ${{ inputs.retained_product_source_sha != '' && needs.release.outputs.workspace_artifact_id || '' }}
      runtime_artifact_sha256: ${{ inputs.retained_product_source_sha != '' && needs.release.outputs.workspace_artifact_sha256 || '' }}
      verified_pr_run_id: ${{ inputs.retained_product_source_sha != '' && inputs.verified_pr_run_id || '' }}
      runtime_artifact: workspace-ui-app

  musicvideo-analysis-acceptance:
    needs: [release, diagnostic-acceptance, bpy-runtime]
    if: ${{ !cancelled() && inputs.artifact_only && needs.release.result == 'success' && needs.diagnostic-acceptance.result == 'success' && needs.bpy-runtime.result == 'success' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/private-example-analysis.yml
    with:
      packaging_producer_source_sha: ${{ needs.release.outputs.packaging_producer_source_sha }}
      packaging_provenance_artifact_id: ${{ needs.release.outputs.packaging_provenance_artifact_id }}
      packaging_provenance_artifact_sha256: ${{ needs.release.outputs.packaging_provenance_artifact_sha256 }}
      runtime_run_id: ${{ inputs.retained_product_source_sha != '' && github.run_id || '' }}
      runtime_source_sha: ${{ inputs.retained_product_source_sha != '' && needs.release.outputs.product_source_sha || '' }}
      runtime_artifact_id: ${{ inputs.retained_product_source_sha != '' && needs.release.outputs.workspace_artifact_id || '' }}
      runtime_artifact_sha256: ${{ inputs.retained_product_source_sha != '' && needs.release.outputs.workspace_artifact_sha256 || '' }}
      runtime_artifact: workspace-ui-app
      verified_pr_run_id: ${{ inputs.verified_pr_run_id }}
    secrets:
      NGV_GHCR_TOKEN: ${{ secrets.NGV_GHCR_TOKEN }}

  publish:
    needs: [release-gate, release, diagnostic-acceptance, bpy-runtime, external-user-acceptance]
    if: ${{ !cancelled() && inputs.artifact_only == false && inputs.dry_run == false && needs.release-gate.outputs.publication-resumed != 'true' && needs.release-gate.result == 'success' && needs.release.result == 'success' && needs.diagnostic-acceptance.result == 'success' && needs.bpy-runtime.result == 'success' && needs.external-user-acceptance.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download publication transaction
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-publication-${{ inputs.version }}
          path: .build/publication

      - name: Validate publication handoff
        env:
          GH_TOKEN: ${{ github.token }}
          REL_VERSION: ${{ inputs.version }}
          GUI_DMG_SHA256: ${{ needs.release.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          PUBLICATION_DIR=".build/publication"
          PENDING="$PUBLICATION_DIR/catalog-${REL_VERSION}.pending.json"
          TRANSACTION="$PUBLICATION_DIR/release-${REL_VERSION}.transaction.json"
          jq -e \
            --arg version "$REL_VERSION" \
            --arg tag "v$REL_VERSION" \
            --arg source "$GITHUB_SHA" \
            --arg guiDmg "$GUI_DMG_SHA256" \
            '.schema == "release-publication/3"
             and .version == $version
             and .tag == $tag
             and .source_sha == $source
             and (.build_number | test("^[1-9][0-9]*$"))
             and (.dmg_length | test("^[1-9][0-9]*$"))
             and (.dmg_sha256 | test("^[0-9a-f]{64}$"))
             and .dmg_sha256 == $guiDmg
             and (.ed_signature | type == "string" and length > 0)
             and (.catalog_sha256 | test("^[0-9a-f]{64}$"))
             and (.assets | type == "array" and length > 0)
             and all(.assets[];
               (.name | type == "string" and test("^[A-Za-z0-9._-]+$"))
               and (.sha256 | test("^[0-9a-f]{64}$")))
             and (([.assets[].name] | unique | length) == (.assets | length))' \
            "$TRANSACTION" >/dev/null \
            || { echo "::error::publication handoff is invalid"; exit 1; }
          EXPECTED_SHA="$(jq -r .catalog_sha256 "$TRANSACTION")"
          ACTUAL_SHA="$(sha256sum "$PENDING" | awk '{print $1}')"
          [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] \
            || { echo "::error::publication catalog checksum mismatch"; exit 1; }
          jq -e '.schema == "plugins/v2" and (.plugins | type == "array")' \
            "$PENDING" >/dev/null \
            || { echo "::error::publication catalog schema is invalid"; exit 1; }
          gh release view plugins \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' > "$PUBLICATION_DIR/plugin-assets.txt"
          asset_exists() {
            grep -Fxq "$1" "$PUBLICATION_DIR/plugin-assets.txt"
          }
          BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/plugins"
          while IFS= read -r ASSET_URL; do
            case "$ASSET_URL" in
              "$BASE"/*) ;;
              *) echo "::error::publication catalog references a non-stable channel"; exit 1 ;;
            esac
            asset_exists "${ASSET_URL##*/}" \
              || { echo "::error::publication catalog references missing asset ${ASSET_URL##*/}"; exit 1; }
          done < <(jq -r '.plugins[] | .url, (.badge // empty)' "$PENDING")
          ASSET_DIR="$PUBLICATION_DIR/assets"
          mkdir -p "$ASSET_DIR"
          while IFS=$'\t' read -r ASSET_NAME ASSET_SHA; do
            asset_exists "$ASSET_NAME" \
              || { echo "::error::publication transaction references missing asset $ASSET_NAME"; exit 1; }
            gh release download plugins \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET_NAME" \
              --dir "$ASSET_DIR"
            DOWNLOADED_SHA="$(sha256sum "$ASSET_DIR/$ASSET_NAME" | awk '{print $1}')"
            [ "$DOWNLOADED_SHA" = "$ASSET_SHA" ] \
              || { echo "::error::published asset checksum mismatch for $ASSET_NAME"; exit 1; }
          done < <(jq -r '.assets[] | [.name, .sha256] | @tsv' "$TRANSACTION")

      - name: Record completed native acceptance for publication recovery
        env:
          GH_TOKEN: ${{ github.token }}
          REL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TRANSACTION=".build/publication/release-${REL_VERSION}.transaction.json"
          jq -n --arg source "$GITHUB_SHA" --arg dmg "$(jq -r .dmg_sha256 "$TRANSACTION")" \
            '{schema: "nexgenvideo/release-runtime-acceptance/2", sourceSHA: $source, dmgSHA256: $dmg,
              runtimeAccepted: true, diagnosticAccepted: true, externalUserAccepted: true}' > .build/publication/runtime-acceptance.json
          gh release upload "v$REL_VERSION" --repo "$GITHUB_REPOSITORY" \
            .build/publication/runtime-acceptance.json --clobber

      - name: Publish protected release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TRANSACTION=".build/publication/release-${REL_VERSION}.transaction.json"
          scripts/publish_release_metadata.sh \
            "$REL_VERSION" \
            "$(jq -r .build_number "$TRANSACTION")" \
            "$(jq -r .dmg_length "$TRANSACTION")" \
            "$(jq -r .dmg_sha256 "$TRANSACTION")" \
            "$(jq -r .ed_signature "$TRANSACTION")" \
            "v$REL_VERSION" \
            "$(jq -r .source_sha "$TRANSACTION")"

      - name: Promote stable plugin catalog
        env:
          GH_TOKEN: ${{ github.token }}
          REL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PUBLICATION_DIR=".build/publication"
          PENDING_ASSET="catalog-${REL_VERSION}.pending.json"
          TRANSACTION_ASSET="release-${REL_VERSION}.transaction.json"
          COMPLETE_ASSET="release-${REL_VERSION}.complete.json"
          cp "$PUBLICATION_DIR/$PENDING_ASSET" "$PUBLICATION_DIR/catalog.json"
          for ATTEMPT in 1 2 3 4 5; do
            if gh release upload plugins \
              --repo "$GITHUB_REPOSITORY" \
              "$PUBLICATION_DIR/catalog.json" \
              --clobber; then
              break
            fi
            [ "$ATTEMPT" -lt 5 ] || exit 1
            sleep $((ATTEMPT * 2))
          done
          cp "$PUBLICATION_DIR/$TRANSACTION_ASSET" "$PUBLICATION_DIR/$COMPLETE_ASSET"
          gh release upload plugins \
            --repo "$GITHUB_REPOSITORY" \
            "$PUBLICATION_DIR/$COMPLETE_ASSET" \
            --clobber
