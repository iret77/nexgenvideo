name: Release (signed + notarized)

# ci-lint: allow-CI007 This workflow has workflow_dispatch only; push/PR appear solely in prohibition comments.
# ci-lint: allow-CI008 Manual workflow_dispatch releases have no path-filter semantics.

# Signs with OUR Developer ID (cert imported into a temp keychain, identity auto-detected),
# notarizes via the App Store Connect API key, staples, builds a DMG, EdDSA-signs it for Sparkle,
# and publishes a GitHub release + appcast entry. No local build — everything runs here.
#
# Secrets (repo): MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD, MACOS_NOTARY_KEY_ID,
# MACOS_NOTARY_ISSUER_ID, MACOS_NOTARY_KEY_P8_BASE64, SPARKLE_ED_PRIVATE_KEY (base64 of the DER
# Ed25519 private key; required for a published release, optional for a dry run).
# Repository setting: Allow GitHub Actions to create and approve pull requests must be enabled. The
# workflow creates but never approves its release-metadata PR; branch protection still owns merging.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version X.Y.Z"
        required: true
        type: string
      dry_run:
        description: "Build, sign, notarize, and publish an isolated preview channel; skip stable release/appcast/commit"
        required: false
        default: true
        type: boolean
      artifact_only:
        description: "Keep signed, notarized candidates in Actions only; requires dry_run and uses the stable catalog"
        required: false
        default: false
        type: boolean
      test_bundle_run_id:
        description: Optional original producer with identical compiled XCTest client inputs
        type: string
        default: ''
      test_bundle_artifact_id:
        description: Exact original external-gui-tests artifact ID
        type: string
        default: ''
      test_bundle_artifact_sha256:
        description: SHA-256 of that exact original client archive
        type: string
        default: ''
      completed_release_tests_run_id:
        description: Pinned completed Release tests for unchanged native inputs
        type: string
        default: ''
      completed_engine_tests_run_id:
        description: Pinned successful Engine backend from the failed Release test suite
        type: string
        default: ''
      signed_build_run_id:
        description: Same-source successful signed build to package without rebuilding
        type: string
        default: ''
      notary_progress_run_id:
        description: Same-source failed notarization to continue from its saved payload and Apple IDs
        type: string
        default: ''
      retained_product_source_sha:
        description: Original signed product commit for an artifact-only packaging correction
        type: string
        default: ''
      retained_product_source_pr_run_id:
        description: Complete original product PR source proof
        type: string
        default: ''
      prior_packaging_producer_source_sha:
        description: Actual harness commit of a previous retained packaging execution
        type: string
        default: ''
      prior_packaging_provenance_artifact_id:
        description: Exact previous retained packaging provenance artifact
        type: string
        default: ''
      prior_packaging_provenance_artifact_sha256:
        description: SHA256 of the complete previous packaging provenance ZIP
        type: string
        default: ''
      compiled_app_targets_json:
        description: Exact reviewed compiled App target products for artifact-only RC assembly
        type: string
        default: ''
      verified_pr_run_id:
        description: Successful PR source checks for this exact merge tree
        type: string
        default: ''
  # `workflow_dispatch` is the ONLY trigger. Nothing a commit, a merge, or a PR touches may start a
  # signed build — not the bundling scripts, not the pack manifests, not this file. A build happens
  # when a human asks for one, never as a side effect of changing code. Do not add `push:` or
  # `pull_request:` here: correctness of the app is verified by ci.yml (build + test) in the approved
  # ci-batch.yml run; this workflow only produces and publishes artifacts, and that is a deliberate act.

permissions: {}

jobs:
  release-gate:
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      publication-resumed: ${{ steps.publication-state.outputs.resumed }}
      restored-build-run: ${{ steps.prior-notary.outputs.build_run_id }}
      product-source-sha: ${{ steps.retained-product.outputs.product_source_sha || github.sha }}
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Validate release input
        env:
          REL_VERSION: ${{ inputs.version }}
          ARTIFACT_ONLY: ${{ inputs.artifact_only }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TEST_RUN: ${{ inputs.completed_release_tests_run_id }}
          RELEASE_ENGINE_RUN: ${{ inputs.completed_engine_tests_run_id }}
          SIGNED_BUILD_RUN: ${{ inputs.signed_build_run_id }}
          NOTARY_PROGRESS_RUN: ${{ inputs.notary_progress_run_id }}
          RETAINED_PRODUCT_SOURCE: ${{ inputs.retained_product_source_sha }}
          RETAINED_PRODUCT_SOURCE_RUN: ${{ inputs.retained_product_source_pr_run_id }}
          VERIFIED_PR_RUN: ${{ inputs.verified_pr_run_id }}
          TEST_BUNDLE_RUN: ${{ inputs.test_bundle_run_id }}
          PRIOR_PACKAGING_SOURCE: ${{ inputs.prior_packaging_producer_source_sha }}
          PRIOR_PACKAGING_ARTIFACT: ${{ inputs.prior_packaging_provenance_artifact_id }}
          PRIOR_PACKAGING_DIGEST: ${{ inputs.prior_packaging_provenance_artifact_sha256 }}
        run: |
          set -euo pipefail
          echo "$REL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be X.Y.Z"; exit 1; }
          if [ -n "${RELEASE_ENGINE_RUN:-}" ] && { [ "$ARTIFACT_ONLY" != "true" ] || [ "$DRY_RUN" != "true" ] || [ -n "${RELEASE_TEST_RUN:-}" ] || [ -n "${SIGNED_BUILD_RUN:-}" ] || [ -n "${NOTARY_PROGRESS_RUN:-}" ]; }; then
            echo "::error::Engine backend continuation requires artifact_only and fresh App tests"
            exit 1
          fi
          if [ -n "${RELEASE_TEST_RUN:-}" ] && { [ -n "${SIGNED_BUILD_RUN:-}" ] || [ -n "${NOTARY_PROGRESS_RUN:-}" ]; }; then
            echo "::error::Select completed native tests or an existing signed build, never both"
            exit 1
          fi
          if [ -n "${SIGNED_BUILD_RUN:-}" ] && [ -n "${NOTARY_PROGRESS_RUN:-}" ]; then
            echo "::error::Notary continuation already selects its original signed build"
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ] && [ "$ARTIFACT_ONLY" != "true" ] && { [ -n "${SIGNED_BUILD_RUN:-}" ] || [ -n "${NOTARY_PROGRESS_RUN:-}" ]; }; then
            echo "::error::Preview channels are run-specific; use artifact_only or stable mode for continuation"
            exit 1
          fi
          if [ "$ARTIFACT_ONLY" = "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::artifact_only requires dry_run=true"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate every retained product selector before publication or runner allocation
        run: python3 scripts/retained_packaging.py validate-inputs

      - name: Validate exact compiled App product selectors
        run: python3 scripts/compiled_app_release.py validate-inputs

      - name: Validate exact external XCTest client selectors
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_CLIENT_RUN: ${{ inputs.test_bundle_run_id }}
          TEST_CLIENT_ARTIFACT: ${{ inputs.test_bundle_artifact_id }}
          TEST_CLIENT_SHA256: ${{ inputs.test_bundle_artifact_sha256 }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts/external-gui')
          from test_bundle import validate_client_source
          validate_client_source(os.environ['TEST_CLIENT_RUN'], os.environ['TEST_CLIENT_ARTIFACT'],
              os.environ['TEST_CLIENT_SHA256'], os.environ['GITHUB_SHA'])
          PY

      - name: Require the default branch for stable publication
        if: ${{ inputs.artifact_only == false && inputs.dry_run == false }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "$REF_NAME" = "$DEFAULT_BRANCH" ] \
            || { echo "::error::Stable releases must run from $DEFAULT_BRANCH"; exit 1; }

      - name: Reject open release blockers
        if: ${{ inputs.artifact_only == false && inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LABEL_COUNT="$(gh label list \
            --repo iret77/nexgenvideo \
            --search release-blocker \
            --limit 100 \
            --json name \
            --jq 'map(select(.name == "release-blocker")) | length')"
          if [ "$LABEL_COUNT" -ne 1 ]; then
            echo "::error::Required release-blocker label is missing"
            exit 1
          fi
          BLOCKERS="$(gh issue list \
            --repo iret77/nexgenvideo \
            --state open \
            --label release-blocker \
            --limit 100 \
            --json number,title \
            --jq '.[] | "#\(.number) \(.title)"')"
          if [ -n "$BLOCKERS" ]; then
            echo "::error::Release blocked before macOS runner allocation"
            echo "$BLOCKERS"
            exit 1
          fi

      - name: Require release merge strategy
        if: ${{ inputs.artifact_only == false && inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ALLOW_MERGE_COMMIT="$(gh api \
            "repos/$GITHUB_REPOSITORY" \
            --jq .allow_merge_commit)"
          [ "$ALLOW_MERGE_COMMIT" = "true" ] \
            || { echo "::error::Release metadata requires repository merge commits"; exit 1; }

      - name: Bind exact PR source checks
        if: inputs.verified_pr_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_PR_RUN: ${{ inputs.verified_pr_run_id }}
        run: |
          python3 scripts/verified_pr_source_checks.py prepare --run-id "$VERIFIED_PR_RUN" \
            --output "$RUNNER_TEMP/release-pr-source"

      - name: Bind retained product packaging
        id: retained-product
        if: inputs.retained_product_source_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/retained_packaging.py bind --root "$RUNNER_TEMP/retained-packaging"

      - name: Bind completed Release tests
        if: inputs.completed_release_tests_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TEST_RUN: ${{ inputs.completed_release_tests_run_id }}
        run: python3 scripts/release_native_proof.py prepare --run-id "$RELEASE_TEST_RUN" --root "$RUNNER_TEMP/release-native"

      - name: Retain completed Release test proof
        if: always() && inputs.completed_release_tests_run_id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-native-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/release-native
          if-no-files-found: error
          retention-days: 7

      - name: Bind completed Release Engine tests
        if: inputs.completed_engine_tests_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENGINE_RUN: ${{ inputs.completed_engine_tests_run_id }}
        run: python3 scripts/release_engine_resume.py prepare --run-id "$RELEASE_ENGINE_RUN" --root "$RUNNER_TEMP/release-engine"

      - name: Retain completed Release Engine proof
        if: always() && inputs.completed_engine_tests_run_id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-engine-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/release-engine
          if-no-files-found: error
          retention-days: 7

      - name: Validate prior signed build
        if: inputs.signed_build_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_BUILD_RUN: ${{ inputs.signed_build_run_id }}
        run: python3 scripts/release_checkpoint.py prepare --run-id "$SIGNED_BUILD_RUN" --root "$RUNNER_TEMP/prior-release-signed-input"

      - name: Validate prior notarization
        id: prior-notary
        if: inputs.notary_progress_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARY_PROGRESS_RUN: ${{ inputs.notary_progress_run_id }}
        run: python3 scripts/release_checkpoint.py prepare-notary --run-id "$NOTARY_PROGRESS_RUN" --root "$RUNNER_TEMP/prior-notary"

      - name: Enforce AppTheme
        if: inputs.verified_pr_run_id == ''
        run: python3 scripts/lint_app_theme.py

      - name: Verify private fixture bundle tooling
        if: inputs.verified_pr_run_id == ''
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Retain exact PR source proof
        if: always() && inputs.verified_pr_run_id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-pr-source-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-pr-source
          if-no-files-found: error
          retention-days: 7

      - name: Inspect or resume release publication
        if: ${{ inputs.artifact_only == false && inputs.dry_run == false }}
        id: publication-state
        env:
          GH_TOKEN: ${{ github.token }}
          REL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$REL_VERSION"
          PENDING_ASSET="catalog-${REL_VERSION}.pending.json"
          TRANSACTION_ASSET="release-${REL_VERSION}.transaction.json"
          COMPLETE_ASSET="release-${REL_VERSION}.complete.json"
          STATE_DIR="$RUNNER_TEMP/release-state"
          mkdir -p "$STATE_DIR"

          PLUGIN_ASSETS=""
          if gh release view plugins \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' > "$STATE_DIR/plugin-assets.txt" 2>/dev/null; then
            PLUGIN_ASSETS="$(cat "$STATE_DIR/plugin-assets.txt")"
          fi
          asset_exists() {
            echo "$PLUGIN_ASSETS" | grep -Fxq "$1"
          }

          if asset_exists "$COMPLETE_ASSET"; then
            echo "::error::Release $REL_VERSION is already completely published"
            exit 1
          fi

          HAS_RELEASE=false
          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets,isDraft > "$STATE_DIR/release.json" 2>/dev/null; then
            HAS_RELEASE=true
            jq -e 'any(.assets[]; .name == "NexGenVideo.dmg")' \
              "$STATE_DIR/release.json" >/dev/null \
              || { echo "::error::release $TAG exists without NexGenVideo.dmg"; exit 1; }
          fi
          HAS_APPCAST=false
          if python3 - "$REL_VERSION" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          version = sys.argv[1]
          root = ET.parse("appcast.xml").getroot()
          namespace = "{http://www.andymatuschak.org/xml-namespaces/sparkle}"
          found = any(
              item.findtext(f"{namespace}shortVersionString") == version
              for item in root.findall("./channel/item")
          )
          raise SystemExit(0 if found else 1)
          PY
          then
            HAS_APPCAST=true
          fi

          if [ "$HAS_RELEASE" = "false" ] && [ "$HAS_APPCAST" = "false" ]; then
            echo "resumed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HAS_RELEASE" = "false" ]; then
            echo "::error::appcast.xml already advertises $REL_VERSION but release $TAG is absent"
            exit 1
          fi
          if ! asset_exists "$PENDING_ASSET" || ! asset_exists "$TRANSACTION_ASSET"; then
            echo "::error::Release $TAG already exists without a resumable plugin publication transaction"
            exit 1
          fi

          gh release download plugins \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$PENDING_ASSET" \
            --pattern "$TRANSACTION_ASSET" \
            --dir "$STATE_DIR"
          TRANSACTION="$STATE_DIR/$TRANSACTION_ASSET"
          PENDING="$STATE_DIR/$PENDING_ASSET"
          jq -e '
            .schema == "release-publication/3"
            and (.source_sha | test("^[0-9a-f]{40}$"))
            and (.build_number | test("^[1-9][0-9]*$"))
            and (.dmg_length | test("^[1-9][0-9]*$"))
            and (.dmg_sha256 | test("^[0-9a-f]{64}$"))
            and (.ed_signature | type == "string" and length > 0)
            and (.catalog_sha256 | test("^[0-9a-f]{64}$"))
            and (.assets | type == "array" and length > 0)
            and all(.assets[];
              (.name | type == "string" and test("^[A-Za-z0-9._-]+$"))
              and (.sha256 | test("^[0-9a-f]{64}$"))
            )
            and (([.assets[].name] | unique | length) == (.assets | length))
          ' "$TRANSACTION" >/dev/null \
            || { echo "::error::publication transaction schema mismatch"; exit 1; }
          [ "$(jq -r .version "$TRANSACTION")" = "$REL_VERSION" ] \
            || { echo "::error::publication transaction version mismatch"; exit 1; }
          [ "$(jq -r .tag "$TRANSACTION")" = "$TAG" ] \
            || { echo "::error::publication transaction tag mismatch"; exit 1; }
          EXPECTED_CATALOG_SHA="$(jq -r .catalog_sha256 "$TRANSACTION")"
          ACTUAL_CATALOG_SHA="$(sha256sum "$PENDING" | awk '{print $1}')"
          [ "$ACTUAL_CATALOG_SHA" = "$EXPECTED_CATALOG_SHA" ] \
            || { echo "::error::pending catalog checksum mismatch"; exit 1; }
          jq -e '.schema == "plugins/v2" and (.plugins | type == "array")' "$PENDING" >/dev/null \
            || { echo "::error::pending catalog schema is invalid"; exit 1; }
          BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/plugins"
          while IFS= read -r ASSET_URL; do
            case "$ASSET_URL" in
              "$BASE"/*) ;;
              *) echo "::error::pending catalog references a non-stable channel"; exit 1 ;;
            esac
            asset_exists "${ASSET_URL##*/}" \
              || { echo "::error::pending catalog references missing asset ${ASSET_URL##*/}"; exit 1; }
          done < <(jq -r '.plugins[] | .url, (.badge // empty)' "$PENDING")
          ASSET_DIR="$STATE_DIR/assets"
          mkdir -p "$ASSET_DIR"
          while IFS=$'\t' read -r ASSET_NAME ASSET_SHA; do
            asset_exists "$ASSET_NAME" \
              || { echo "::error::publication transaction references missing asset $ASSET_NAME"; exit 1; }
            gh release download plugins \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET_NAME" \
              --dir "$ASSET_DIR"
            DOWNLOADED_SHA="$(sha256sum "$ASSET_DIR/$ASSET_NAME" | awk '{print $1}')"
            [ "$DOWNLOADED_SHA" = "$ASSET_SHA" ] \
              || { echo "::error::published asset checksum mismatch for $ASSET_NAME"; exit 1; }
          done < <(jq -r '.assets[] | [.name, .sha256] | @tsv' "$TRANSACTION")

          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern runtime-acceptance.json --dir "$STATE_DIR"; then
            echo "::error::Resume the failed acceptance jobs in the original release run before publication"
            exit 1
          fi
          jq -e --arg source "$(jq -r .source_sha "$TRANSACTION")" \
            --arg dmg "$(jq -r .dmg_sha256 "$TRANSACTION")" \
            '.schema == "nexgenvideo/release-runtime-acceptance/2" and .sourceSHA == $source and .dmgSHA256 == $dmg
             and .runtimeAccepted == true and .diagnosticAccepted == true and .externalUserAccepted == true' \
            "$STATE_DIR/runtime-acceptance.json" >/dev/null

          python3 scripts/verify_bpy_runtime.py --distribution
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern NexGenVideo-bpy-5.2.2-corresponding-source.tar \
            --pattern NexGenVideo-bpy-5.2.2-corresponding-source.manifest.json --dir "$STATE_DIR"
          python3 scripts/verify_bpy_distributable_source.py \
            "$STATE_DIR/NexGenVideo-bpy-5.2.2-corresponding-source.tar" \
            "$STATE_DIR/NexGenVideo-bpy-5.2.2-corresponding-source.manifest.json"

          BUILD_NUMBER="$(jq -r .build_number "$TRANSACTION")"
          DMG_LENGTH="$(jq -r .dmg_length "$TRANSACTION")"
          DMG_SHA256="$(jq -r .dmg_sha256 "$TRANSACTION")"
          ED_SIGNATURE="$(jq -r .ed_signature "$TRANSACTION")"
          SOURCE_SHA="$(jq -r .source_sha "$TRANSACTION")"
          scripts/publish_release_metadata.sh \
            "$REL_VERSION" "$BUILD_NUMBER" "$DMG_LENGTH" "$DMG_SHA256" \
            "$ED_SIGNATURE" "$TAG" "$SOURCE_SHA"

          cp "$PENDING" "$STATE_DIR/catalog.json"
          for ATTEMPT in 1 2 3 4 5; do
            if gh release upload plugins \
              --repo "$GITHUB_REPOSITORY" \
              "$STATE_DIR/catalog.json" \
              --clobber; then
              break
            fi
            [ "$ATTEMPT" -lt 5 ] || exit 1
            sleep $((ATTEMPT * 2))
          done
          cp "$TRANSACTION" "$STATE_DIR/$COMPLETE_ASSET"
          gh release upload plugins \
            --repo "$GITHUB_REPOSITORY" \
            "$STATE_DIR/$COMPLETE_ASSET" \
            --clobber
          echo "resumed=true" >> "$GITHUB_OUTPUT"
          echo "Publication for $REL_VERSION resumed without allocating a macOS runner"

      - name: Require distributable bpy before macOS allocation
        if: ${{ steps.publication-state.outputs.resumed != 'true' }}
        run: python3 scripts/verify_bpy_runtime.py --distribution

      - name: Release source preflight
        if: ${{ steps.publication-state.outputs.resumed != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CATALOG_DIR="$RUNNER_TEMP/plugin-channel"
          mkdir -p "$CATALOG_DIR"
          if gh release view plugins \
            --repo "$GITHUB_REPOSITORY" \
            --json assets > "$CATALOG_DIR/assets.json" 2>/dev/null; then
            if jq -e 'any(.assets[]; .name == "catalog.json")' \
              "$CATALOG_DIR/assets.json" >/dev/null; then
              gh release download plugins \
                --repo "$GITHUB_REPOSITORY" \
                --pattern catalog.json \
                --dir "$CATALOG_DIR"
            else
              if jq -e 'any(.assets[]; .name | test("^release-.*[.]complete[.]json$"))' \
                "$CATALOG_DIR/assets.json" >/dev/null; then
                echo "::error::stable plugin catalog is missing after a completed publication"
                exit 1
              fi
              printf '%s\n' '{"schema":"plugins/v2","plugins":[]}' > "$CATALOG_DIR/catalog.json"
            fi
          else
            printf '%s\n' '{"schema":"plugins/v2","plugins":[]}' > "$CATALOG_DIR/catalog.json"
          fi
          python3 scripts/release_preflight.py "$REL_VERSION" "$CATALOG_DIR/catalog.json"

  bpy-source:
    permissions:
      contents: read
      actions: read
    needs: release-gate
    if: ${{ needs.release-gate.outputs.publication-resumed != 'true' && inputs.signed_build_run_id == '' && inputs.notary_progress_run_id == '' && inputs.compiled_app_targets_json == '' }}
    uses: ./.github/workflows/bpy-qualified-source.yml

  release-build:
    needs: [release-gate, bpy-source]
    if: ${{ !cancelled() && needs.release-gate.result == 'success' && (inputs.compiled_app_targets_json != '' || needs.bpy-source.result == 'success') && needs.release-gate.outputs.publication-resumed != 'true' && inputs.signed_build_run_id == '' && inputs.notary_progress_run_id == '' }}
    runs-on: macrunner
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-native-test-python
      - uses: ./.github/actions/setup-xcode-27

      - name: Resolve version + mode
        env:
          ARTIFACT_ONLY: ${{ inputs.artifact_only }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must be X.Y.Z (got '$V')"; exit 1; }
          DRY="${{ inputs.dry_run }}"
          {
            echo "REL_VERSION=$V"
            echo "REL_DRY=$DRY"
          } >> "$GITHUB_ENV"
          if [ "$DRY" = "true" ] && [ "$ARTIFACT_ONLY" != "true" ]; then
            PREVIEW_TAG="preview-${{ github.run_id }}"
            {
              echo "PLUGIN_CHANNEL_TAG=$PREVIEW_TAG"
              echo "PLUGIN_CATALOG_URL=${{ github.server_url }}/${{ github.repository }}/releases/download/$PREVIEW_TAG/catalog.json"
            } >> "$GITHUB_ENV"
          else
            {
              echo "PLUGIN_CHANNEL_TAG=plugins"
              echo "PLUGIN_CATALOG_URL=${{ github.server_url }}/${{ github.repository }}/releases/download/plugins/catalog.json"
            } >> "$GITHUB_ENV"
          fi
          echo "Building $V (dry=${{ inputs.dry_run }})"

