name: Research release probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/research-date-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-xcode-27
      - name: Check the production date policy with and without optimization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('Sources/NexGenVideo/Generation/Capabilities/ModelCapabilityResearchSchema.swift').read_text()
          policy = source.split('enum ModelCapabilityResearchDatePolicy {', 1)[1].split('enum ModelCapabilityResearchEvidencePolicy', 1)[0]
          main = '''
          for value in ["2026-08-31", "2026-09-08", "2024-02-29"] {
              let date = ModelCapabilityResearchDatePolicy.date(value)!
              let formatted = ModelCapabilityResearchDatePolicy.string(date)
              print("input=\\(value) epoch=\\(date.timeIntervalSince1970) output=\\(formatted)")
              precondition(formatted == value)
          }
          '''
          Path('/tmp/research-date.swift').write_text('import Foundation\nenum ModelCapabilityResearchDatePolicy {' + policy + main)
          PY
          swiftc -Onone /tmp/research-date.swift -o /tmp/research-date-debug
          /tmp/research-date-debug
          swiftc -O /tmp/research-date.swift -o /tmp/research-date-release
          /tmp/research-date-release
      - name: Validate the public fixtures across the actual module boundary
        run: |
          mkdir -p "$RUNNER_TEMP/research-probe"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('Sources/NexGenVideo/Generation/Capabilities/ModelCapabilityResearchSchema.swift').read_text()
          source = source.replace('throw ModelCapabilityResearchValidationError.invalidEvidence(field)',
              'print("invalid evidence branch \\(#line)")\n            throw ModelCapabilityResearchValidationError.invalidEvidence(field)')
          Path(os.environ['RUNNER_TEMP'], 'research-probe/schema.swift').write_text(source)
          PY
          cat > "$RUNNER_TEMP/research-probe/main.swift" <<'SWIFT'
          import Foundation
          import NexGenEngine
          for (name, host) in [("image-gemini-2.5", "ai.google.dev"), ("video-seedance-2.5", "docs.dev.runwayml.com"), ("music-eleven-v1", "elevenlabs.io")] {
              let data = try Data(contentsOf: URL(fileURLWithPath: "Tests/NexGenVideoTests/Fixtures/ModelCapabilityResearch/\(name).json"))
              let candidate = try JSONDecoder().decode(ModelCapabilityResearchCandidateV1.self, from: data)
              let request = ModelCapabilityResearchRequestV1(binding: candidate.binding, scope: candidate.scope,
                  trigger: .inheritedProfile, fallbackResolution: .inherited, fallbackProfileID: "fixture-fallback",
                  allowedSourceHosts: [host], observedAt: ModelCapabilityResearchDatePolicy.date("2026-08-31")!)
              print("request date=\(request.observedAt)")
              print(String(data: try JSONEncoder().encode(candidate), encoding: .utf8)!)
              if let evidence = candidate.fields.integers.values.first?.evidence.first {
                  let title = evidence.sourceTitle.trimmingCharacters(in: .whitespacesAndNewlines)
                  print("evidence checks", evidence.kind != .defensive, evidence.kind != .empirical,
                      evidence.confidence.isFinite, (0...1).contains(evidence.confidence),
                      evidence.observedAt == request.observedAt, title == evidence.sourceTitle,
                      title.isEmpty, title.count,
                      title.unicodeScalars.contains(where: CharacterSet.controlCharacters.contains))
              }
              do {
                  _ = try ModelCapabilityResearchValidator.decodeCandidate(data, for: request)
                  print("validated \(name)")
              } catch { print("validation failed: \(error)"); exit(1) }
          }
          SWIFT
          for optimization in Onone O; do
            swiftc -swift-version 6 -$optimization -enable-testing -emit-module -emit-library -module-name NexGenEngine \
              Engine/Sources/NexGenEngine/Capabilities/*.swift \
              -emit-module-path "$RUNNER_TEMP/research-probe/NexGenEngine.swiftmodule" \
              -o "$RUNNER_TEMP/research-probe/libNexGenEngine.dylib"
            swiftc -swift-version 6 -$optimization -enable-testing \
              -I "$RUNNER_TEMP/research-probe" -L "$RUNNER_TEMP/research-probe" -lNexGenEngine \
              -Xlinker -rpath -Xlinker "$RUNNER_TEMP/research-probe" \
              "$RUNNER_TEMP/research-probe/schema.swift" \
              "$RUNNER_TEMP/research-probe/main.swift" -o "$RUNNER_TEMP/research-probe/probe"
            "$RUNNER_TEMP/research-probe/probe"
          done
