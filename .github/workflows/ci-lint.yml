name: ci-lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-lint:
    name: ci-lint
    # ci-lint: allow-CI006 Only owner PRs from this repository use an ephemeral Mac. All external contributors require approval.
    # ci-lint: allow-CI008 This bounded source check qualifies the RC merge tree on the requested Mac.
    runs-on: ${{ github.event_name == 'pull_request' && github.actor == 'iret77' && github.repository == 'iret77/nexgenvideo' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'iret77/rc-delivery-base-795' && 'macrunner' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check workflow policy and syntax
        env:
          CI_LINT_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          bash script/ci-lint --tier solo --strict --visibility "$CI_LINT_VISIBILITY"
          ruby -ryaml -e 'Dir[".github/workflows/*.{yml,yaml}"].each { |path| YAML.load_file(path) }'
      - name: Select pinned CI tooling compiler and dependency cache
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: script/actionlint-tool/go.sum
      - name: Validate GitHub Actions expressions and workflow grammar
        run: bash script/actionlint
