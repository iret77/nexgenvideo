name: Signing preflight

# Validates the signing secrets BEFORE a real release: the imported cert is a
# "Developer ID Application" identity (not Apple Distribution), and the App Store Connect API key
# authenticates. Fails loudly if not — per the task's "ZUERST PRÜFEN, sonst stoppen" rule.
# Runs from the CI batch and on demand.

on:
  workflow_call:
    inputs:
      dmg_copy_probe:
        type: boolean
        default: false
      dmg_probe_mode:
        type: string
        default: copy
  workflow_dispatch:
    inputs:
      dmg_copy_probe:
        description: Check the fixed DMG copy using the existing signed App without compilation
        type: boolean
        default: false
      dmg_probe_mode:
        description: Copy verification or capacity measurement without copying
        type: choice
        options: [copy, capacity]
        default: copy

permissions:
  contents: read

concurrency:
  group: signing-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: inputs.dmg_copy_probe
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify DMG copy tooling and bind the existing signed App
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_PROBE_MODE: ${{ inputs.dmg_probe_mode }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_dmg_packaging.py' -v
          python3 scripts/release_dmg_probe.py bind --mode "$DMG_PROBE_MODE" --root "$RUNNER_TEMP/dmg-probe-binding"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dmg-probe-binding-${{ github.run_id }}
          path: ${{ runner.temp }}/dmg-probe-binding/
          if-no-files-found: error
          retention-days: 7

  dmg-copy-probe:
    needs: source
    if: inputs.dmg_copy_probe
    permissions:
      contents: read
      actions: read
    runs-on: macrunner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-native-test-python
      - uses: ./.github/actions/setup-xcode-27
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dmg-probe-binding-${{ github.run_id }}
          path: ${{ runner.temp }}/dmg-probe
      - name: Prepare pinned DMG tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet --disable-pip-version-check "dmgbuild==1.6.7"
          echo "DMGBUILD_BIN=$RUNNER_TEMP/dmgvenv/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: Verify the exact retained signed App survives the fixed DMG copy
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_PROBE_MODE: ${{ inputs.dmg_probe_mode }}
        run: |
          set -euo pipefail
          python3 scripts/release_dmg_probe.py inspect --mode "$DMG_PROBE_MODE" --root "$RUNNER_TEMP/dmg-probe" \
            2>&1 | tee "$RUNNER_TEMP/dmg-probe/probe.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dmg-copy-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dmg-probe/probe.log
            ${{ runner.temp }}/dmg-probe/binding.json
            ${{ runner.temp }}/dmg-probe/report/
          if-no-files-found: error
          retention-days: 90

  preflight:
    if: ${{ !inputs.dmg_copy_probe }}
    # macOS is required for Keychain, codesign, and notarytool verification.
    runs-on: macrunner
    timeout-minutes: 15
    steps:
      - name: Verify Developer ID cert + notary API key
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/preflight.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          echo "== codesigning identities in the imported cert =="
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::Imported cert is NOT a 'Developer ID Application' identity — cannot sign for outside-App-Store distribution. Stop."
            exit 1
          fi
          echo "OK: 'Developer ID Application' identity present."

          printf '%s' "$NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "== notary API key authentication =="
          xcrun notarytool history \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            | head -n 8
          echo "OK: notary API key authenticates."

          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
