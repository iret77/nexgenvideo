      - uses: ./.github/actions/setup-native-test-python
      - uses: ./.github/actions/cache-swiftpm-dependencies
        with:
          restore-only: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: app-build-plan-source-binding
