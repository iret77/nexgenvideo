name: Verify existing diagnostic candidate

on:
  workflow_dispatch:
    inputs:
      candidate_kind:
        description: Signed release verification or only failed CI runtime checks
        type: choice
        options: [signed-release, ci-runtime]
        default: signed-release
      run_id:
        description: "Original producer workflow run"
        type: string
        required: true
      source_sha:
        description: "Exact source commit embedded in the original app"
        type: string
        required: true
      artifact_id:
        description: "Original diagnostic-release-evidence or NexGenVideo-app artifact ID"
        type: string
        required: true
      artifact_sha256:
        description: "SHA-256 of the original artifact archive"
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-acceptance-${{ inputs.run_id }}
  cancel-in-progress: false

env:
  CANDIDATE_RUN: ${{ inputs.run_id }}
  CANDIDATE_SOURCE: ${{ inputs.source_sha }}
  CANDIDATE_ARTIFACT: ${{ inputs.artifact_id }}
  CANDIDATE_DIGEST: ${{ inputs.artifact_sha256 }}

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify signed acceptance tooling
        if: inputs.candidate_kind != 'ci-runtime'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify changed runtime acceptance tooling
        if: inputs.candidate_kind == 'ci-runtime'
        run: |
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_verify_macho_dependencies.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
          python3 -m unittest discover -s scripts -p 'test_release_workflow.py'
      - name: Bind the successful release job and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_KIND: ${{ inputs.candidate_kind }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/candidate-metadata"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$RUNNER_TEMP/candidate-metadata/run.json"
          ATTEMPT="$(jq -r .run_attempt "$RUNNER_TEMP/candidate-metadata/run.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/attempts/$ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/candidate-metadata/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT" > "$RUNNER_TEMP/candidate-metadata/artifact.json"
          python3 scripts/verify_diagnostic_candidate.py "$CANDIDATE_RUN" "$CANDIDATE_SOURCE" \
            "$CANDIDATE_ARTIFACT" "$CANDIDATE_DIGEST" "$RUNNER_TEMP/candidate-metadata" \
            --candidate-kind "$CANDIDATE_KIND"
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-candidate-identity
          path: ${{ runner.temp }}/candidate-metadata/*.json
          if-no-files-found: error
          retention-days: 90

  acceptance:
    needs: source
    if: inputs.candidate_kind != 'ci-runtime'
    # ci-lint: allow-CI005 Runtime acceptance on the macOS 26 floor; macrunner boots only macOS 27.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the exact signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT/zip" > "$RUNNER_TEMP/candidate.zip"
          ACTUAL="$(shasum -a 256 "$RUNNER_TEMP/candidate.zip" | cut -d' ' -f1)"
          [ "$ACTUAL" = "$CANDIDATE_DIGEST" ]
          ditto -x -k "$RUNNER_TEMP/candidate.zip" "$RUNNER_TEMP/candidate"
          ditto -x -k "$RUNNER_TEMP/candidate/diagnostic-app.zip" .
          ditto -x -k "$RUNNER_TEMP/candidate/diagnostic-symbols.zip" .
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NGVSourceCommit' NexGenVideo.app/Contents/Info.plist)" = "$CANDIDATE_SOURCE" ]
          codesign --verify --strict --verbose=2 NexGenVideo.app
          xcrun stapler validate NexGenVideo.app
          [ "$(sw_vers -productVersion | cut -d. -f1)" = 26 ]
      - name: Verify signed capture, replay, startup and retained key bytes
        run: python3 scripts/hang_diagnostic_acceptance.py NexGenVideo.app diagnostic-symbols/NexGenVideo.dSYM --output evidence
      - name: Exercise native Export Cancel, Retry and Reveal actions
        run: python3 scripts/export_actions_acceptance.py NexGenVideo.app --output evidence/export-actions.json
      - name: Record candidate identity
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("evidence/candidate.json").write_text(json.dumps({
              key: os.environ[key] for key in (
                  "CANDIDATE_RUN", "CANDIDATE_SOURCE", "CANDIDATE_ARTIFACT", "CANDIDATE_DIGEST"
              )
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-runtime-acceptance
          path: |
            evidence/*.json
            evidence/helper-recovery*.log
            evidence/helper-recovery-recordings.zip
          if-no-files-found: error
          retention-days: 90

  ci-helper:
    needs: source
    if: inputs.candidate_kind == 'ci-runtime'
    # ci-lint: allow-CI005 Runtime acceptance on the macOS 26 product floor.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the original successful CI app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT/zip" > "$RUNNER_TEMP/candidate.zip"
          test "$(shasum -a 256 "$RUNNER_TEMP/candidate.zip" | cut -d' ' -f1)" = "$CANDIDATE_DIGEST"
          ditto -x -k "$RUNNER_TEMP/candidate.zip" "$RUNNER_TEMP/candidate"
          ditto -x -k "$RUNNER_TEMP/candidate/NexGenVideo.zip" "$RUNNER_TEMP/candidate"
          APP="$RUNNER_TEMP/candidate/NexGenVideo.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NGVSourceCommit' "$APP/Contents/Info.plist")" = "$CANDIDATE_SOURCE"
          codesign --verify --strict --verbose=2 "$APP"
      - name: Verify helper recovery on the original app
        run: python3 scripts/hang_diagnostic_acceptance.py "$RUNNER_TEMP/candidate/NexGenVideo.app" --helper-recovery-only --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-helper-recovery
          path: |
            evidence/helper-recovery*.json
            evidence/helper-recovery*.log
            evidence/helper-recovery-recordings.zip
          if-no-files-found: error
          retention-days: 90

  ci-bpy:
    needs: source
    if: inputs.candidate_kind == 'ci-runtime'
    uses: ./.github/workflows/bpy-runtime-acceptance.yml
    with:
      artifact: NexGenVideo-app
      app_zip: NexGenVideo.zip
      distribution: false
      runtime_run_id: ${{ inputs.run_id }}
      expected_source_sha: ${{ inputs.source_sha }}
      app_artifact_id: ${{ inputs.artifact_id }}
      app_artifact_sha256: ${{ inputs.artifact_sha256 }}
