name: Verify existing diagnostic candidate

on:
  workflow_dispatch:
    inputs:
      candidate_kind:
        description: Signed release verification or targeted failed CI diagnostics
        type: choice
        options: [signed-release, ci-runtime, ci-bpy-open-diagnostic, ci-app-test-diagnostic, ci-app-glow-replay, ci-app-full-replay, ci-builtin-blur, ci-builtin-blur-scribble, ci-builtin-blur-floor, ci-builtin-blur-preheat]
        default: signed-release
      run_id:
        description: "Original producer workflow run"
        type: string
        required: true
      source_sha:
        description: "Exact source commit of the original producer"
        type: string
        required: true
      artifact_id:
        description: "Original app or test diagnostic artifact ID"
        type: string
        required: true
      artifact_sha256:
        description: "SHA-256 of the original artifact archive"
        type: string
        required: true

      product_source_sha:
        description: Original product commit for replay, or normal blur experiment commit
        type: string
        default: ""
      products_artifact_id:
        description: Original compiled products artifact ID, or normal blur diagnostic artifact ID
        type: string
        default: ""
      products_artifact_sha256:
        description: SHA256 of compiled products, or the normal blur diagnostic archive
        type: string
        default: ""
      failure_artifact_id:
        description: Original failed test diagnostic artifact ID for retained replay
        type: string
        default: ""
      failure_artifact_sha256:
        description: Original failed test diagnostic SHA256 for retained replay
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-acceptance-${{ inputs.run_id }}
  cancel-in-progress: false

env:
  CANDIDATE_RUN: ${{ inputs.run_id }}
  CANDIDATE_SOURCE: ${{ inputs.source_sha }}
  CANDIDATE_ARTIFACT: ${{ inputs.artifact_id }}
  CANDIDATE_DIGEST: ${{ inputs.artifact_sha256 }}

  REPLAY_KIND: ${{ inputs.candidate_kind }}
  PRODUCER_RUN: ${{ inputs.run_id }}
  PRODUCER_SHA: ${{ inputs.source_sha }}
  PRODUCT_SHA: ${{ inputs.product_source_sha }}
  DIAGNOSTIC_ID: ${{ inputs.artifact_id }}
  DIAGNOSTIC_DIGEST: ${{ inputs.artifact_sha256 }}
  PRODUCTS_ID: ${{ inputs.products_artifact_id }}
  PRODUCTS_DIGEST: ${{ inputs.products_artifact_sha256 }}
  FAILURE_ID: ${{ inputs.failure_artifact_id }}
  FAILURE_DIGEST: ${{ inputs.failure_artifact_sha256 }}

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify signed acceptance tooling
        if: inputs.candidate_kind == 'signed-release'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify changed runtime acceptance tooling
        if: inputs.candidate_kind == 'ci-runtime'
        run: |
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_verify_macho_dependencies.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
          python3 -m unittest discover -s scripts -p 'test_release_workflow.py'
      - name: Verify isolated bpy diagnostic tooling
        if: inputs.candidate_kind == 'ci-bpy-open-diagnostic'
        run: |
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_bpy_open_diagnostic.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
      - name: Verify isolated App diagnostic tooling
        if: inputs.candidate_kind == 'ci-app-test-diagnostic'
        run: |
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_run_macos_tests.py'
          python3 -m unittest discover -s scripts -p 'test_app_host_zombie_diagnostic.py'
          python3 -m unittest discover -s scripts -p 'test_swift_test_failure_propagation.py'
          python3 -m unittest discover -s scripts -p 'test_appkit_host_stale_diagnostic.py'
          python3 -m unittest discover -s scripts -p 'test_runloop_probe_preparation.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
      - name: Verify and bind standalone preheat comparison
        if: inputs.candidate_kind == 'ci-builtin-blur-preheat'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_builtin_blur*.py'
          python3 -m unittest discover -s scripts -p 'test_run_macos_tests.py'
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
          python3 scripts/ci_builtin_blur_preheat.py bind --evidence "$RUNNER_TEMP/preheat-binding"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.candidate_kind == 'ci-builtin-blur-preheat'
        with:
          name: preheat-binding
          path: ${{ runner.temp }}/preheat-binding
          if-no-files-found: error
          retention-days: 90
      - name: Verify and bind original standalone floor runtime
        if: inputs.candidate_kind == 'ci-builtin-blur-floor'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_builtin_blur*.py'
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_run_macos_tests.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
          python3 scripts/ci_builtin_blur_floor.py bind --evidence "$RUNNER_TEMP/builtin-blur-floor-binding"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.candidate_kind == 'ci-builtin-blur-floor'
        with:
          name: builtin-blur-floor-binding
          path: ${{ runner.temp }}/builtin-blur-floor-binding
          if-no-files-found: error
          retention-days: 90
      - name: Verify and bind standalone blur experiment
        if: (inputs.candidate_kind == 'ci-builtin-blur' || inputs.candidate_kind == 'ci-builtin-blur-scribble')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_builtin_blur.py'
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_run_macos_tests.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
          python3 scripts/ci_builtin_blur.py bind --evidence "$RUNNER_TEMP/builtin-blur-binding"
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.candidate_kind == 'ci-builtin-blur' || inputs.candidate_kind == 'ci-builtin-blur-scribble')
        with:
          name: builtin-blur-binding
          path: ${{ runner.temp }}/builtin-blur-binding
          if-no-files-found: error
          retention-days: 90
      - name: Verify changed replay and shared test tooling
        if: (inputs.candidate_kind == 'ci-app-glow-replay' || inputs.candidate_kind == 'ci-app-full-replay')
        run: |
          python3 -m unittest discover -s scripts -p 'test_retained_app_test_products.py'
          python3 -m unittest discover -s scripts -p 'test_run_macos_tests.py'
          python3 -m unittest discover -s scripts -p 'test_app_host_zombie_diagnostic.py'
          python3 -m unittest discover -s scripts -p 'test_swift_test_failure_propagation.py'
          python3 -m unittest discover -s scripts -p 'test_appkit_host_stale_diagnostic.py'
          python3 -m unittest discover -s scripts -p 'test_runloop_probe_preparation.py'
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
      - name: Bind original failed and successful diagnostic producers
        if: (inputs.candidate_kind == 'ci-app-glow-replay' || inputs.candidate_kind == 'ci-app-full-replay')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/retained_app_test_products.py source --metadata "$RUNNER_TEMP/replay-metadata"
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.candidate_kind == 'ci-app-glow-replay' || inputs.candidate_kind == 'ci-app-full-replay')
        with:
          name: retained-glow-source
          path: ${{ runner.temp }}/replay-metadata
          if-no-files-found: error
          retention-days: 90

      - name: Bind the successful release job and immutable artifact
        if: inputs.candidate_kind != 'ci-app-glow-replay' && inputs.candidate_kind != 'ci-app-full-replay' && inputs.candidate_kind != 'ci-builtin-blur' && inputs.candidate_kind != 'ci-builtin-blur-scribble' && inputs.candidate_kind != 'ci-builtin-blur-floor' && inputs.candidate_kind != 'ci-builtin-blur-preheat'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_KIND: ${{ inputs.candidate_kind }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/candidate-metadata"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$RUNNER_TEMP/candidate-metadata/run.json"
          ATTEMPT="$(jq -r .run_attempt "$RUNNER_TEMP/candidate-metadata/run.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/attempts/$ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/candidate-metadata/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT" > "$RUNNER_TEMP/candidate-metadata/artifact.json"
          extra=()
          if [ "$CANDIDATE_KIND" = ci-app-test-diagnostic ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT/zip" > "$RUNNER_TEMP/original-test-diagnostic.zip"
            extra+=(--crash-archive "$RUNNER_TEMP/original-test-diagnostic.zip")
          fi
          python3 scripts/verify_diagnostic_candidate.py "$CANDIDATE_RUN" "$CANDIDATE_SOURCE" \
            "$CANDIDATE_ARTIFACT" "$CANDIDATE_DIGEST" "$RUNNER_TEMP/candidate-metadata" \
            --candidate-kind "$CANDIDATE_KIND" "${extra[@]}"
      - uses: actions/upload-artifact@v4
        if: inputs.candidate_kind != 'ci-app-glow-replay' && inputs.candidate_kind != 'ci-app-full-replay' && inputs.candidate_kind != 'ci-builtin-blur' && inputs.candidate_kind != 'ci-builtin-blur-scribble' && inputs.candidate_kind != 'ci-builtin-blur-floor' && inputs.candidate_kind != 'ci-builtin-blur-preheat'
        with:
          name: diagnostic-candidate-identity
          path: ${{ runner.temp }}/candidate-metadata/*.json
          if-no-files-found: error
          retention-days: 90

  ci-builtin-blur-floor:
    needs: source
    if: inputs.candidate_kind == 'ci-builtin-blur-floor'
    # ci-lint: allow-CI005 Run the original executable on the macOS 26 floor without rebuilding.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: builtin-blur-floor-binding
          path: ${{ runner.temp }}/builtin-blur-floor-binding
      - name: Run original executable on the product floor
        timeout-minutes: 25
        run: |
          python3 scripts/ci_builtin_blur_floor.py run --metadata "$RUNNER_TEMP/builtin-blur-floor-binding" \
            --evidence "$RUNNER_TEMP/builtin-blur-floor"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: builtin-blur-floor-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/builtin-blur-floor
          if-no-files-found: error
          retention-days: 90

  ci-builtin-blur:
    needs: source
    if: (inputs.candidate_kind == 'ci-builtin-blur' || inputs.candidate_kind == 'ci-builtin-blur-scribble')
    runs-on: macrunner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: builtin-blur-binding
          path: ${{ runner.temp }}/builtin-blur-binding
      - uses: ./.github/actions/setup-xcode-27
      - name: Compile and execute bounded standalone blur experiment
        timeout-minutes: 25
        run: |
          python3 scripts/ci_builtin_blur.py run --metadata "$RUNNER_TEMP/builtin-blur-binding" \
            --evidence "$RUNNER_TEMP/builtin-blur"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: builtin-blur-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/builtin-blur
          if-no-files-found: error
          retention-days: 90

  ci-builtin-blur-preheat-build:
    needs: source
    if: inputs.candidate_kind == 'ci-builtin-blur-preheat'
    runs-on: macrunner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preheat-binding
          path: ${{ runner.temp }}/preheat-binding
      - name: Compile standalone comparison executable
        run: python3 scripts/ci_builtin_blur_preheat.py compile --metadata "$RUNNER_TEMP/preheat-binding" --evidence "$RUNNER_TEMP/preheat-products"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preheat-products
          path: ${{ runner.temp }}/preheat-products
          if-no-files-found: error
          retention-days: 90

  ci-builtin-blur-preheat:
    needs: ci-builtin-blur-preheat-build
    if: inputs.candidate_kind == 'ci-builtin-blur-preheat'
    # ci-lint: allow-CI005 Compare the exact macOS 26 GPU runtime without rebuilding the App.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preheat-binding
          path: ${{ runner.temp }}/preheat-binding
      - uses: actions/download-artifact@v4
        with:
          name: preheat-products
          path: ${{ runner.temp }}/preheat-products
      - name: Run bounded standalone preheat comparison
        timeout-minutes: 25
        run: python3 scripts/ci_builtin_blur_preheat.py run --metadata "$RUNNER_TEMP/preheat-binding" --products "$RUNNER_TEMP/preheat-products" --evidence "$RUNNER_TEMP/preheat-runtime"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preheat-runtime-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/preheat-runtime
          if-no-files-found: error
          retention-days: 90

  ci-app-test:
    needs: source
    if: inputs.candidate_kind == 'ci-app-test-diagnostic'
    runs-on: macrunner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-candidate-identity
          path: ${{ runner.temp }}/candidate-metadata
      - name: Preserve the reviewed harness and bind the original test source
        env:
          HARNESS_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          metadata = json.loads((root / 'candidate-metadata/harness.json').read_text())
          assert metadata['candidateKind'] == 'ci-app-test-diagnostic'
          assert metadata['buildSourceSHA'] == os.environ['CANDIDATE_SOURCE']
          assert metadata['harnessSourceSHA'] == os.environ['HARNESS_SOURCE']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['HARNESS_SOURCE']
          harness = root / 'app-diagnostic-harness'
          harness.mkdir()
          hashes = {}
          for name in ('run_macos_tests.py', 'app_host_zombie_diagnostic.py', 'verify_swift_test_output.py',
                       'capture_render_review_test_diagnostic.py'):
              source = Path('scripts') / name
              shutil.copyfile(source, harness / name)
              hashes[name] = hashlib.sha256(source.read_bytes()).hexdigest()
          metadata['copiedHarnessSHA256'] = hashes
          metadata['originalRunID'] = os.environ['CANDIDATE_RUN']
          metadata['originalArtifactID'] = os.environ['CANDIDATE_ARTIFACT']
          metadata['originalArtifactSHA256'] = os.environ['CANDIDATE_DIGEST']
          (root / 'candidate-metadata/diagnostic-execution.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          git checkout --detach "$CANDIDATE_SOURCE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE"
          test -z "$(git status --porcelain)"
      - uses: ./.github/actions/setup-xcode-27
      - name: Check native diagnostic interfaces and ambient switches before compiling
        timeout-minutes: 1
        run: |
          python3 -I - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          module_path = root / 'app-diagnostic-harness/app_host_zombie_diagnostic.py'
          spec = importlib.util.spec_from_file_location('zombie_diagnostic', module_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          receipt = {'scope': 'prebuild current-process API and ambient-environment check; actual App proof remains required'}
          try:
              module.zombie_environment(os.environ)
              reader = module.NativeReader()
              assert reader.usage(os.getpid())['startAbsoluteTime'] > 0
              assert len(reader.arguments(os.getpid())) > 4
              receipt['status'] = 'available'
          except Exception as error:
              receipt.update(status='unavailable', errorType=type(error).__name__, errno=getattr(error, 'errno', None))
          (root / 'candidate-metadata/native-preflight.json').write_text(json.dumps(receipt, indent=2) + '\n')
          raise SystemExit(0 if receipt['status'] == 'available' else 1)
          PY
      - uses: ./.github/actions/cache-swiftpm-dependencies
        with:
          restore-only: 'true'
      - name: Compile unchanged original native test products
        timeout-minutes: 40
        run: |
          set -euo pipefail
          swift build --cache-path "$NGV_SWIFTPM_CACHE_PATH" --build-tests 2>&1 | tee "$RUNNER_TEMP/app-diagnostic-build.log"
          scripts/verify_tracked_source_state.sh
          scripts/stage_test_runtime.sh debug
      - name: Retain compiled products before diagnostic execution
        timeout-minutes: 10
        env:
          HARNESS_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          BIN_ROOT="$(swift build --cache-path "$NGV_SWIFTPM_CACHE_PATH" --show-bin-path)"
          export BIN_ROOT
          python3 -I - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          binary = Path(os.environ['BIN_ROOT']).resolve(strict=True)
          records = {}
          for relative in ('NexGenVideoAppKitTestHost', 'NexGenVideoTests.xctest/Contents/MacOS/NexGenVideoTests'):
              path = binary / relative
              records[relative] = {'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                                   'uuidOutput': subprocess.check_output(['xcrun', 'dwarfdump', '--uuid', str(path)], text=True)}
          record = {'productSourceSHA': os.environ['CANDIDATE_SOURCE'], 'harnessSourceSHA': os.environ['HARNESS_SOURCE'],
                    'binRoot': str(binary), 'binaries': records,
                    'toolchain': subprocess.check_output(['xcodebuild', '-version'], text=True),
                    'reuseStatus': 'Retained original products; relocation and consumer binding require verification'}
          (Path(os.environ['RUNNER_TEMP']) / 'candidate-metadata/compiled-products.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
          ditto -c -k --keepParent "$BIN_ROOT" "$RUNNER_TEMP/app-test-products.zip"
          shasum -a 256 "$RUNNER_TEMP/app-test-products.zip" > "$RUNNER_TEMP/candidate-metadata/compiled-products.sha256"
      - name: Diagnose the original full App SwiftTesting backend once
        id: app_test
        timeout-minutes: 30
        env:
          NGV_BLOCKOUT_ORIENTATION_EVIDENCE_DIR: ${{ runner.temp }}/blockout-orientation-evidence
        run: |
          set -euo pipefail
          export SWIFT_BACKTRACE=enable=yes,interactive=no,demangle=yes,cache=no
          python3 "$RUNNER_TEMP/app-diagnostic-harness/capture_render_review_test_diagnostic.py" \
            --evidence "$RUNNER_TEMP/app-zombie-diagnostic" --log "$RUNNER_TEMP/app-zombie-test.log" \
            --swift-testing-runs 1 --xctest-runs 0 --without-runloop-probe --app-only -- \
            python3 "$RUNNER_TEMP/app-diagnostic-harness/run_macos_tests.py" --cache-path "$NGV_SWIFTPM_CACHE_PATH" \
              --scope app-swift-testing --app-diagnostic zombies \
              --product-source-sha "$CANDIDATE_SOURCE" \
              --evidence "$RUNNER_TEMP/app-zombie-diagnostic/hosted-suite"
      - name: Verify diagnostic completion and unchanged source
        run: |
          set -euo pipefail
          scripts/verify_tracked_source_state.sh
          python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'app-zombie-diagnostic/hosted-suite'
          suite = json.loads((root / 'suite.json').read_text())
          assert suite['sourceSHA'] == suite['harnessSourceSHA'] == os.environ['GITHUB_SHA']
          assert suite['productSourceSHA'] == os.environ['CANDIDATE_SOURCE'] and suite['completed'] is True
          assert suite['scope'] == 'app-swift-testing' and suite['filter'] == ''
          assert len(suite['phases']) == 1
          phase = suite['phases'][0]
          assert phase['exitCode'] == 0 and phase['diagnostic']['status'] == 'verified'
          assert phase['diagnostic']['pid'] == phase['pid'] == phase['originalHostReceipt']['pid']
          ended = phase['events']['endedFunctionIDs']
          for method in ('neutralIsNoOp', 'bleedsLightIntoNeighbors', 'warmthTintsTheBleedRed'):
              assert sum(name.startswith('NexGenVideoTests.GlowKernelTests/' + method + '()/') for name in ended) == 1
          assert sum(name.startswith('NexGenVideoTests.BpyStorageBookmarkTests/') for name in ended) == 7
          (root / 'interpretation.json').write_text(json.dumps({
              'status': 'diagnostic-run-completed', 'rootCause': 'not-established-by-a-pass',
              'coreAcceptance': False, 'nativeUXAcceptance': False, 'releaseAcceptance': False,
          }, indent=2) + '\n')
          PY
      - name: Upload original App diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-zombie-diagnostic-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app-zombie-diagnostic
            ${{ runner.temp }}/app-zombie-test.log
            ${{ runner.temp }}/app-diagnostic-build.log
            ${{ runner.temp }}/candidate-metadata
            ${{ runner.temp }}/blockout-orientation-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Upload retained native test products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-products-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-test-products.zip
          if-no-files-found: ignore
          retention-days: 7

  acceptance:
    needs: source
    if: inputs.candidate_kind == 'signed-release'
    # ci-lint: allow-CI005 Runtime acceptance on the macOS 26 floor; macrunner boots only macOS 27.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the exact signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT/zip" > "$RUNNER_TEMP/candidate.zip"
          ACTUAL="$(shasum -a 256 "$RUNNER_TEMP/candidate.zip" | cut -d' ' -f1)"
          [ "$ACTUAL" = "$CANDIDATE_DIGEST" ]
          ditto -x -k "$RUNNER_TEMP/candidate.zip" "$RUNNER_TEMP/candidate"
          ditto -x -k "$RUNNER_TEMP/candidate/diagnostic-app.zip" .
          ditto -x -k "$RUNNER_TEMP/candidate/diagnostic-symbols.zip" .
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NGVSourceCommit' NexGenVideo.app/Contents/Info.plist)" = "$CANDIDATE_SOURCE" ]
          codesign --verify --strict --verbose=2 NexGenVideo.app
          xcrun stapler validate NexGenVideo.app
          [ "$(sw_vers -productVersion | cut -d. -f1)" = 26 ]
      - name: Verify signed capture, replay, startup and retained key bytes
        run: python3 scripts/hang_diagnostic_acceptance.py NexGenVideo.app diagnostic-symbols/NexGenVideo.dSYM --output evidence
      - name: Exercise native Export Cancel, Retry and Reveal actions
        run: python3 scripts/export_actions_acceptance.py NexGenVideo.app --output evidence/export-actions.json
      - name: Record candidate identity
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("evidence/candidate.json").write_text(json.dumps({
              key: os.environ[key] for key in (
                  "CANDIDATE_RUN", "CANDIDATE_SOURCE", "CANDIDATE_ARTIFACT", "CANDIDATE_DIGEST"
              )
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-runtime-acceptance
          path: |
            evidence/*.json
            evidence/helper-recovery*.log
            evidence/helper-recovery-recordings.zip
          if-no-files-found: error
          retention-days: 90

  ci-helper:
    needs: source
    if: inputs.candidate_kind == 'ci-runtime'
    # ci-lint: allow-CI005 Runtime acceptance on the macOS 26 product floor.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the original successful CI app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT/zip" > "$RUNNER_TEMP/candidate.zip"
          test "$(shasum -a 256 "$RUNNER_TEMP/candidate.zip" | cut -d' ' -f1)" = "$CANDIDATE_DIGEST"
          ditto -x -k "$RUNNER_TEMP/candidate.zip" "$RUNNER_TEMP/candidate"
          ditto -x -k "$RUNNER_TEMP/candidate/NexGenVideo.zip" "$RUNNER_TEMP/candidate"
          APP="$RUNNER_TEMP/candidate/NexGenVideo.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NGVSourceCommit' "$APP/Contents/Info.plist")" = "$CANDIDATE_SOURCE"
          codesign --verify --strict --verbose=2 "$APP"
      - name: Verify helper recovery on the original app
        run: python3 scripts/hang_diagnostic_acceptance.py "$RUNNER_TEMP/candidate/NexGenVideo.app" --helper-recovery-only --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-helper-recovery
          path: |
            evidence/helper-recovery*.json
            evidence/helper-recovery*.log
            evidence/helper-recovery-recordings.zip
          if-no-files-found: error
          retention-days: 90

  ci-bpy:
    needs: source
    if: inputs.candidate_kind == 'ci-runtime'
    uses: ./.github/workflows/bpy-runtime-acceptance.yml
    with:
      artifact: NexGenVideo-app
      app_zip: NexGenVideo.zip
      distribution: false
      runtime_run_id: ${{ inputs.run_id }}
      expected_source_sha: ${{ inputs.source_sha }}
      app_artifact_id: ${{ inputs.artifact_id }}
      app_artifact_sha256: ${{ inputs.artifact_sha256 }}

  ci-bpy-open-diagnostic:
    needs: source
    if: inputs.candidate_kind == 'ci-bpy-open-diagnostic'
    # ci-lint: allow-CI005 Diagnose the original macOS 26 runtime without rebuilding it.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-candidate-identity
          path: evidence/identity
      - name: Retrieve and verify the original app bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(uname -m)" = arm64
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT/zip" > "$RUNNER_TEMP/candidate.zip"
          test "$(shasum -a 256 "$RUNNER_TEMP/candidate.zip" | cut -d' ' -f1)" = "$CANDIDATE_DIGEST"
          ditto -x -k "$RUNNER_TEMP/candidate.zip" "$RUNNER_TEMP/candidate"
          mkdir -p "$RUNNER_TEMP/relocated"
          ditto -x -k "$RUNNER_TEMP/candidate/NexGenVideo.zip" "$RUNNER_TEMP/relocated"
          APP="$RUNNER_TEMP/relocated/NexGenVideo.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NGVSourceCommit' "$APP/Contents/Info.plist")" = "$CANDIDATE_SOURCE"
          codesign --verify --strict --verbose=2 "$APP"
          scripts/verify_bpy_bundle.sh "$APP" --development
          for slot in 0 1; do
            codesign -d --entitlements :- "$APP/Contents/XPCServices/NexGenVideoBpyService$slot.xpc" \
              > "evidence/service-$slot-entitlements.plist" 2> "evidence/service-$slot-signature.log"
          done
          mkdir -p "$RUNNER_TEMP/denied/foreign-project" "$RUNNER_TEMP/fake-bin" "$RUNNER_TEMP/approved-input"
          printf 'provider-secret' > "$RUNNER_TEMP/denied/provider-secret"
          printf 'canonical-project-truth' > "$RUNNER_TEMP/denied/canonical-artifact"
          printf 'foreign-project' > "$RUNNER_TEMP/denied/foreign-project/scene.blend"
          printf 'host-home-secret' > "$HOME/ngv-bpy-host-home-secret"
          printf '{"approved":true}' > "$RUNNER_TEMP/approved-input/fixture.json"
          ln -s "$RUNNER_TEMP/denied/provider-secret" "$RUNNER_TEMP/approved-input/symlink.json"
          printf 'hardlink' > "$RUNNER_TEMP/approved-input/hardlink-source"
          ln "$RUNNER_TEMP/approved-input/hardlink-source" "$RUNNER_TEMP/approved-input/hardlink.json"
          printf '#!/bin/sh\nexit 99\n' > "$RUNNER_TEMP/fake-bin/python3"
          printf '#!/bin/sh\nexit 99\n' > "$RUNNER_TEMP/fake-bin/blender"
          chmod +x "$RUNNER_TEMP/fake-bin/python3" "$RUNNER_TEMP/fake-bin/blender"
      - name: Observe the failed open on the original app
        id: probe
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 scripts/bpy_open_diagnostic.py "$RUNNER_TEMP/relocated/NexGenVideo.app" \
            --source-sha "$CANDIDATE_SOURCE" --output evidence/open-diagnostic \
            --probe-output "$RUNNER_TEMP/evidence/host-crash-before-authorization"
      - name: Retain the original runtime orphan check
        if: always() && steps.probe.outcome != 'skipped'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/relocated/NexGenVideo.app"
          status=0
          for _ in $(seq 1 200); do
            status=0
            pgrep -f "$APP/Contents/Helpers/NexGenVideoBpySupervisor|$APP/Contents/Resources/BpyRuntime/python" \
              > evidence/remaining-runtime-pids.log || status=$?
            [ "$status" -eq 0 ] || break
            sleep 0.05
          done
          printf '%s\n' "$status" > evidence/orphan-check-status.txt
          [ "$status" -eq 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpy-open-diagnostic-${{ inputs.run_id }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            evidence/
            ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 90

  ci-app-retained-replay:
    name: ${{ inputs.candidate_kind }}
    needs: source
    if: (inputs.candidate_kind == 'ci-app-glow-replay' || inputs.candidate_kind == 'ci-app-full-replay')
    runs-on: macrunner
    timeout-minutes: ${{ inputs.candidate_kind == 'ci-app-full-replay' && 60 || 20 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: retained-glow-source
          path: ${{ runner.temp }}/replay-metadata
      - name: Preserve the reviewed harness and select unchanged product source
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          metadata = root / 'replay-metadata'
          binding = json.loads((metadata / 'binding.json').read_text())
          if (binding['harnessSHA'] != os.environ['GITHUB_SHA']
                  or binding['productSHA'] != os.environ['PRODUCT_SHA']
                  or subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != binding['harnessSHA']):
              raise ValueError('Replay checkout or metadata differs')
          harness = root / 'replay-harness'
          harness.mkdir()
          names = ('run_macos_tests.py', 'app_host_zombie_diagnostic.py', 'verify_swift_test_output.py',
                   'capture_render_review_test_diagnostic.py', 'verify_diagnostic_candidate.py',
                   'retained_app_test_products.py')
          hashes = {}
          for name in names:
              source = Path('scripts') / name
              shutil.copyfile(source, harness / name)
              hashes[name] = hashlib.sha256(source.read_bytes()).hexdigest()
          (metadata / 'copied-harness.json').write_text(json.dumps(hashes, indent=2) + '\n')
          PY
          git checkout --detach "$PRODUCT_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain)"
      - uses: ./.github/actions/setup-xcode-27
      - name: Verify platform and restore the exact original products
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$RUNNER_TEMP/replay-harness/retained_app_test_products.py" restore \
            --metadata "$RUNNER_TEMP/replay-metadata"
      - name: Run the selected unchanged App tests once
        timeout-minutes: ${{ inputs.candidate_kind == 'ci-app-full-replay' && 30 || 10 }}
        run: |
          set -euo pipefail
          export SWIFT_BACKTRACE=enable=yes,interactive=no,demangle=yes,cache=no
          selection=(--app-diagnostic glow-reproduction --filter GlowKernelTests)
          if [[ "$REPLAY_KIND" == ci-app-full-replay ]]; then
            selection=(--app-diagnostic app-reproduction)
            test ! -e "$RUNNER_TEMP/blockout-orientation-evidence"
            test ! -L "$RUNNER_TEMP/blockout-orientation-evidence"
            export NGV_BLOCKOUT_ORIENTATION_EVIDENCE_DIR="$RUNNER_TEMP/blockout-orientation-evidence"
          fi
          python3 "$RUNNER_TEMP/replay-harness/capture_render_review_test_diagnostic.py" \
            --evidence "$RUNNER_TEMP/glow-replay" --log "$RUNNER_TEMP/glow-replay.log" \
            --swift-testing-runs 1 --xctest-runs 0 --without-runloop-probe --app-only -- \
            python3 "$RUNNER_TEMP/replay-harness/run_macos_tests.py" --cache-path "$RUNNER_TEMP/unused-cache" \
              --scope app-swift-testing "${selection[@]}" \
              --bin-root "$GITHUB_WORKSPACE/.build/out/Products/Debug" --product-source-sha "$PRODUCT_SHA" \
              --evidence "$RUNNER_TEMP/glow-replay/hosted-suite"
      - name: Verify exact exposure, actual loaded images and unchanged product bytes
        run: |
          set -euo pipefail
          scripts/verify_tracked_source_state.sh
          python3 "$RUNNER_TEMP/replay-harness/retained_app_test_products.py" verify \
            --metadata "$RUNNER_TEMP/replay-metadata" --evidence "$RUNNER_TEMP/glow-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-glow-diagnostic-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/glow-replay
            ${{ runner.temp }}/glow-replay.log
            ${{ runner.temp }}/replay-metadata/*.json
            ${{ runner.temp }}/replay-metadata/*.log
            ${{ runner.temp }}/blockout-orientation-evidence/
          if-no-files-found: error
          retention-days: 90
