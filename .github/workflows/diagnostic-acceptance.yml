  acceptance:
    needs: source
    if: inputs.candidate_kind == 'signed-release'
    runs-on: macrunner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-test-python
      - name: Rebind retained packaging before diagnostic app execution
        if: inputs.packaging_producer_source_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from retained_packaging import consumer_binding, consumer_harness, environment_selectors
          from retained_app_test_products import api
          from verify_diagnostic_candidate import CAPTURE_HARNESS_PATHS, verify
          run_id = int(os.environ['CANDIDATE_RUN'])
          selected = environment_selectors()
          bound = consumer_binding(run_id, os.environ['CANDIDATE_SOURCE'], selected, archive_root=Path('evidence/packaging-provenance'))
          consumer_harness(bound, os.environ['CANDIDATE_SOURCE'], CAPTURE_HARNESS_PATHS)
          verify(api('actions/runs/' + str(run_id)), api('actions/runs/' + str(run_id) + '/attempts/1/jobs?per_page=100'),
              api('actions/artifacts/' + os.environ['CANDIDATE_ARTIFACT']), run_id, os.environ['CANDIDATE_SOURCE'],
              int(os.environ['CANDIDATE_ARTIFACT']), os.environ['CANDIDATE_DIGEST'], [], packaging=selected)
          PYCODE
      - name: Retrieve the exact signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT/zip" > "$RUNNER_TEMP/candidate.zip"
          ACTUAL="$(shasum -a 256 "$RUNNER_TEMP/candidate.zip" | cut -d' ' -f1)"
          [ "$ACTUAL" = "$CANDIDATE_DIGEST" ]
          ditto -x -k "$RUNNER_TEMP/candidate.zip" "$RUNNER_TEMP/candidate"
          ditto -x -k "$RUNNER_TEMP/candidate/diagnostic-app.zip" .
          ditto -x -k "$RUNNER_TEMP/candidate/diagnostic-symbols.zip" .
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NGVSourceCommit' NexGenVideo.app/Contents/Info.plist)" = "$CANDIDATE_SOURCE" ]
          codesign --verify --strict --verbose=2 NexGenVideo.app
          xcrun stapler validate NexGenVideo.app
          [ "$(sw_vers -productVersion | cut -d. -f1)" -ge 26 ]
      - name: Verify signed capture, replay, startup and retained key bytes
        run: python3 scripts/hang_diagnostic_acceptance.py NexGenVideo.app diagnostic-symbols/NexGenVideo.dSYM --output evidence
      - name: Exercise native Export Cancel, Retry and Reveal actions
        run: python3 scripts/export_actions_acceptance.py NexGenVideo.app --output evidence/export-actions.json
      - name: Verify generation batch pricing recovery
        shell: bash
        run: |
          set -euo pipefail
          NGV_SELFTEST_GENERATION_BATCH_RECOVERY=1 \
            NexGenVideo.app/Contents/MacOS/NexGenVideo \
            | grep -qx 'SELFTEST_GENERATION_BATCH_RECOVERY_OK'
      - name: Verify asynchronous termination, cancellation and restart
        run: python3 scripts/app_termination_acceptance.py NexGenVideo.app --output evidence/termination --product-source "$CANDIDATE_SOURCE"
      - name: Record candidate identity
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("evidence/candidate.json").write_text(json.dumps({
              key: os.environ[key] for key in (
                  "CANDIDATE_RUN", "CANDIDATE_SOURCE", "CANDIDATE_ARTIFACT", "CANDIDATE_DIGEST"
              )
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-runtime-acceptance
          path: |
            evidence/*.json
            evidence/*.log
            evidence/capture-*.zip
            evidence/helper-recovery-recordings.zip
            evidence/termination/
            evidence/packaging-provenance/
          if-no-files-found: error
          retention-days: 90
      - name: Retain separately acquired original component evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: retained-origin-diagnostic-acceptance-${{ github.job }}-${{ strategy.job-index || 0 }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-packaging-supplements/
          if-no-files-found: ignore
          retention-days: 90

  ci-helper:
    needs: source
    if: inputs.candidate_kind == 'ci-runtime'
    runs-on: macrunner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the original successful CI app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT/zip" > "$RUNNER_TEMP/candidate.zip"
          test "$(shasum -a 256 "$RUNNER_TEMP/candidate.zip" | cut -d' ' -f1)" = "$CANDIDATE_DIGEST"
          ditto -x -k "$RUNNER_TEMP/candidate.zip" "$RUNNER_TEMP/candidate"
          ditto -x -k "$RUNNER_TEMP/candidate/NexGenVideo.zip" "$RUNNER_TEMP/candidate"
          APP="$RUNNER_TEMP/candidate/NexGenVideo.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NGVSourceCommit' "$APP/Contents/Info.plist")" = "$CANDIDATE_SOURCE"
          codesign --verify --strict --verbose=2 "$APP"
      - name: Verify helper recovery on the original app
        run: python3 scripts/hang_diagnostic_acceptance.py "$RUNNER_TEMP/candidate/NexGenVideo.app" --helper-recovery-only --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-helper-recovery
          path: |
            evidence/helper-recovery*.json
            evidence/helper-recovery*.log
            evidence/helper-recovery-recordings.zip
          if-no-files-found: error
          retention-days: 90

  ci-bpy:
