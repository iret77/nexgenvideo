name: Verify existing diagnostic candidate

on:
  workflow_dispatch:
    inputs:
      packaging_producer_source_sha:
        type: string
        default: ''
      packaging_provenance_artifact_id:
        type: string
        default: ''
      packaging_provenance_artifact_sha256:
        type: string
        default: ''
      candidate_kind:
        description: Signed release verification or targeted failed CI diagnostics
        type: choice
        options: [native-app-targets, native-app-build-plan, signed-release, signed-bpy, signed-journey, signed-transport, native-retained-failures, native-scene-history-hierarchy, native-scene-pointer-delivery, native-segment-geometry, native-button-query, native-button-query-crash, native-button-query-crash-reuse, native-export-color, ci-runtime, ci-bpy-open-diagnostic, ci-bpy-resource-diagnostic, ci-app-test-diagnostic, ci-app-glow-replay, ci-app-full-replay, ci-builtin-blur, ci-builtin-blur-scribble, ci-builtin-blur-floor, ci-builtin-blur-preheat, ci-glow-context]
        default: signed-release
      run_id:
        description: "Original producer workflow run"
        type: string
        required: true
      source_sha:
        description: "Exact source commit of the original producer"
        type: string
        required: true
      artifact_id:
        description: "Original app or test diagnostic artifact ID"
        type: string
        required: true
      artifact_sha256:
        description: "SHA-256 of the original artifact archive"
        type: string
        required: true
      expected_dmg_sha256:
        description: Exact signed DMG SHA256 for signed-journey continuation
        type: string
        default: ''
      interface_scale:
        description: Text size for signed-journey continuation
        type: choice
        options: ['1', '1.25', '1.5', all]
        default: '1'
      journey_scenario:
        description: Existing journey or fresh local Musicvideo installation from the exact DMG
        type: choice
        options: [journey, normal-fresh-local-musicvideo]
        default: journey
      expected_catalog_sha256:
        description: Exact normal catalog bytes for the fresh local Musicvideo case
        type: string
        default: ''
      verified_pr_run_id:
        description: Complete current merged PR source proof for public transport
        type: string
        default: ''
      journey_job_id:
        description: Passed normal journey job from the original release run
        type: string
        default: ''
      journey_artifact_id:
        description: Full original normal-journey evidence artifact
        type: string
        default: ''
      journey_artifact_sha256:
        description: Exact original normal-journey evidence ZIP digest
        type: string
        default: ''
      test_bundle_run_id:
        description: Original compiled UI test producer for signed journey or transport
        type: string
        default: ''
      test_bundle_artifact_id:
        description: Exact original compiled UI test artifact
        type: string
        default: ''
      test_bundle_artifact_sha256:
        description: SHA256 of the original compiled UI test archive
        type: string
        default: ''

      product_source_sha:
        description: Original product commit for replay, or normal blur experiment commit
        type: string
        default: ""
      products_artifact_id:
        description: Original compiled products artifact ID, or normal blur diagnostic artifact ID
        type: string
        default: ""
      products_artifact_sha256:
        description: SHA256 of compiled products, or the normal blur diagnostic archive
        type: string
        default: ""
      failure_artifact_id:
        description: Original failed test diagnostic artifact ID for retained replay
        type: string
        default: ""
      failure_artifact_sha256:
        description: Original failed test diagnostic SHA256 for retained replay
        type: string
        default: ""
      runtime_failure_binding:
        description: Exact Diagnostic and bpy failure job and artifact identities as JSON
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: diagnostic-acceptance-${{ inputs.run_id }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PACKAGING_PRODUCER_SOURCE: ${{ inputs.packaging_producer_source_sha }}
  PACKAGING_PROVENANCE_ARTIFACT_ID: ${{ inputs.packaging_provenance_artifact_id }}
  PACKAGING_PROVENANCE_ARTIFACT_SHA256: ${{ inputs.packaging_provenance_artifact_sha256 }}
  CANDIDATE_RUN: ${{ inputs.run_id }}
  CANDIDATE_SOURCE: ${{ inputs.source_sha }}
  CANDIDATE_ARTIFACT: ${{ inputs.artifact_id }}
  CANDIDATE_DIGEST: ${{ inputs.artifact_sha256 }}

  REPLAY_KIND: ${{ inputs.candidate_kind }}
  PRODUCER_RUN: ${{ inputs.run_id }}
  PRODUCER_SHA: ${{ inputs.source_sha }}
  PRODUCT_SHA: ${{ inputs.product_source_sha }}
  DIAGNOSTIC_ID: ${{ inputs.artifact_id }}
  DIAGNOSTIC_DIGEST: ${{ inputs.artifact_sha256 }}
  PRODUCTS_ID: ${{ inputs.products_artifact_id }}
  PRODUCTS_DIGEST: ${{ inputs.products_artifact_sha256 }}
  FAILURE_ID: ${{ inputs.failure_artifact_id }}
  FAILURE_DIGEST: ${{ inputs.failure_artifact_sha256 }}

jobs:
  source:
    outputs:
      plan-binding-id: ${{ steps.plan-binding-upload.outputs.artifact-id }}
      plan-binding-digest: ${{ steps.plan-binding-upload.outputs.artifact-digest }}
      target-binding-id: ${{ steps.target-binding-upload.outputs.artifact-id }}
      target-binding-digest: ${{ steps.target-binding-upload.outputs.artifact-digest }}
    runs-on: ubuntu-24.04
    # Signed acceptance runs the full six-minute suite; targeted diagnostic modes keep their bound.
    timeout-minutes: ${{ (inputs.candidate_kind == 'signed-release' || inputs.candidate_kind == 'signed-transport') && 10 || 5 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact compiled UI client selectors
        env:
          KIND: ${{ inputs.candidate_kind }}
          JOURNEY_SCENARIO: ${{ inputs.journey_scenario }}
          TEST_BUNDLE_RUN_ID: ${{ inputs.test_bundle_run_id }}
          TEST_BUNDLE_ARTIFACT_ID: ${{ inputs.test_bundle_artifact_id }}
          TEST_BUNDLE_ARTIFACT_SHA256: ${{ inputs.test_bundle_artifact_sha256 }}
        run: |
          python3 - <<'PY'
          import os, sys
          values = [os.environ[key] for key in ('TEST_BUNDLE_RUN_ID', 'TEST_BUNDLE_ARTIFACT_ID', 'TEST_BUNDLE_ARTIFACT_SHA256')]
          kind = os.environ['KIND']
          if kind not in {'signed-journey', 'signed-transport'}:
              if any(values):
                  raise ValueError('Compiled UI client selectors cannot be ignored by another mode')
          else:
              local = kind == 'signed-journey' and os.environ.get('JOURNEY_SCENARIO') == 'normal-fresh-local-musicvideo'
              if (kind == 'signed-transport' or local) and not all(values):
                  raise ValueError('This continuation requires the exact original compiled UI client run, artifact and digest')
              sys.path.insert(0, 'scripts/external-gui')
              from test_bundle import validate_client_source
              validate_client_source(*values, os.environ['GITHUB_SHA'])
          PY
      - name: Require exact local Musicvideo continuation inputs
        env:
          KIND: ${{ inputs.candidate_kind }}
          JOURNEY_SCENARIO: ${{ inputs.journey_scenario }}
          CATALOG_DIGEST: ${{ inputs.expected_catalog_sha256 }}
          SCALE: ${{ inputs.interface_scale }}
          VERIFIED_PR: ${{ inputs.verified_pr_run_id }}
          DMG_DIGEST: ${{ inputs.expected_dmg_sha256 }}
          PRODUCER_RUN: ${{ inputs.run_id }}
          PRODUCER_SOURCE: ${{ inputs.source_sha }}
          RUNTIME_ARTIFACT: ${{ inputs.artifact_id }}
          RUNTIME_DIGEST: ${{ inputs.artifact_sha256 }}
        run: |
          python3 - <<'PY'
          import os, re
          scenario = os.environ.get('JOURNEY_SCENARIO') or 'journey'
          catalog = os.environ.get('CATALOG_DIGEST', '')
          if scenario not in {'journey', 'normal-fresh-local-musicvideo'}:
              raise ValueError('Unknown installed-app journey scenario')
          if scenario == 'normal-fresh-local-musicvideo':
              if (os.environ['KIND'] != 'signed-journey' or os.environ['SCALE'] != '1.5'
                      or not all(re.fullmatch('[a-f0-9]{64}', os.environ[key]) for key in ('CATALOG_DIGEST', 'DMG_DIGEST', 'RUNTIME_DIGEST'))
                      or not all(re.fullmatch('[1-9][0-9]*', os.environ[key]) for key in ('VERIFIED_PR', 'PRODUCER_RUN', 'RUNTIME_ARTIFACT'))
                      or not re.fullmatch('[a-f0-9]{40}', os.environ['PRODUCER_SOURCE'])):
                  raise ValueError('Local Musicvideo requires the exact DMG, producer, catalog, source proof and 150% scale')
          elif catalog:
              raise ValueError('Normal catalog identity cannot be ignored by another scenario')
          PY
      - name: Require exact public transport continuation inputs
        env:
          KIND: ${{ inputs.candidate_kind }}
          VERIFIED_PR: ${{ inputs.verified_pr_run_id }}
          JOURNEY_JOB: ${{ inputs.journey_job_id }}
          JOURNEY_ARTIFACT: ${{ inputs.journey_artifact_id }}
          JOURNEY_DIGEST: ${{ inputs.journey_artifact_sha256 }}
          SCALE: ${{ inputs.interface_scale }}
          DMG_DIGEST: ${{ inputs.expected_dmg_sha256 }}
          EXTRA_SOURCE: ${{ inputs.product_source_sha }}
          EXTRA_PRODUCTS: ${{ inputs.products_artifact_id }}
          EXTRA_FAILURE: ${{ inputs.failure_artifact_id }}
          EXTRA_PRODUCTS_SHA: ${{ inputs.products_artifact_sha256 }}
          EXTRA_FAILURE_SHA: ${{ inputs.failure_artifact_sha256 }}
          RUNTIME_FAILURE_BINDING: ${{ inputs.runtime_failure_binding }}
          JOURNEY_SCENARIO: ${{ inputs.journey_scenario }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          sys.path.insert(0, 'scripts')
          from retained_packaging import environment_selectors
          packaging = environment_selectors()
          if os.environ['KIND'] == 'native-retained-failures':
              from retained_runtime_failure_diagnostic import validate_inputs
              validate_inputs(os.environ)
          elif os.environ['KIND'] == 'native-button-query-crash-reuse':
              from button_query_diagnostic import validate_reuse_request
              try:
                  validate_reuse_request(os.environ)
              except (ValueError, KeyError, TypeError) as error:
                  raise ValueError('Runtime failure binding cannot be ignored by this mode; exact compiler reuse required') from error
          elif os.environ['KIND'] == 'native-button-query-crash':
              from button_query_diagnostic import crash_request
              try:
                  crash_request(os.environ)
              except (ValueError, KeyError, TypeError) as error:
                  raise ValueError('Runtime failure binding cannot be ignored by this mode; exact crash request required') from error
          elif os.environ['KIND'] == 'native-app-targets':
              from native_app_target_build import validate_inputs
              try:
                  validate_inputs(os.environ)
              except (ValueError, KeyError, TypeError) as error:
                  raise ValueError('Runtime failure binding cannot be ignored by this mode; exact compiler selectors required') from error
          elif os.environ['RUNTIME_FAILURE_BINDING']:
              raise ValueError('Runtime failure binding cannot be ignored by another mode')
          if packaging is not None and (os.environ['KIND'] not in {'signed-release', 'signed-bpy', 'signed-journey', 'signed-transport', 'native-retained-failures'}
                  or not re.fullmatch('[1-9][0-9]*', os.environ['VERIFIED_PR'])):
              raise ValueError('Packaging continuation needs signed mode and current exact PR source proof')
          fields = [os.environ[key] for key in ('VERIFIED_PR', 'JOURNEY_JOB', 'JOURNEY_ARTIFACT', 'JOURNEY_DIGEST')]
          if os.environ['KIND'] == 'native-app-targets':
              from native_app_target_build import validate_inputs
              validate_inputs(os.environ)
          elif os.environ['KIND'] == 'native-app-build-plan':
              from native_app_build_plan import validate_inputs
              validate_inputs(os.environ)
          elif os.environ['KIND'] == 'native-scene-pointer-delivery':
              from scene_pointer_delivery import validate_inputs
              validate_inputs(os.environ)
          elif os.environ['KIND'] == 'native-scene-history-hierarchy':
              from scene_history_hierarchy import validate_inputs
              validate_inputs(os.environ)
          elif os.environ['KIND'] in ('native-button-query', 'native-button-query-crash', 'native-button-query-crash-reuse'):
              from button_query_diagnostic import validate_inputs
              validate_inputs(os.environ)
          elif os.environ['KIND'] == 'signed-transport':
              if (any(not re.fullmatch('[1-9][0-9]*', value) for value in fields[:3])
                      or not re.fullmatch('[a-f0-9]{64}', fields[3]) or os.environ['SCALE'] != '1.5'
                      or not re.fullmatch('[a-f0-9]{64}', os.environ['DMG_DIGEST'])
                      or any(os.environ[key] for key in ('EXTRA_SOURCE', 'EXTRA_PRODUCTS', 'EXTRA_FAILURE', 'EXTRA_PRODUCTS_SHA', 'EXTRA_FAILURE_SHA'))):
                  raise SystemExit('Public transport requires one passed journey, exact DMG, current source proof and no diagnostic reuse inputs.')
          elif any(fields[1:]) or fields[0] and packaging is None and os.environ['KIND'] != 'signed-release' and not (
                  os.environ['KIND'] == 'signed-journey' and os.environ.get('JOURNEY_SCENARIO') == 'normal-fresh-local-musicvideo'):
              raise SystemExit('Public transport inputs cannot be silently ignored by another mode.')
          PY
      - name: Reuse complete current merged PR source proof
        if: inputs.candidate_kind == 'native-app-targets' || inputs.candidate_kind == 'native-app-build-plan' || inputs.candidate_kind == 'signed-transport' || inputs.candidate_kind == 'native-button-query' || inputs.candidate_kind == 'native-button-query-crash' || inputs.candidate_kind == 'native-button-query-crash-reuse' || (inputs.candidate_kind == 'signed-release' && inputs.verified_pr_run_id != '') || (inputs.candidate_kind == 'signed-journey' && inputs.journey_scenario == 'normal-fresh-local-musicvideo') || inputs.packaging_producer_source_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_PR: ${{ inputs.verified_pr_run_id }}
        run: |
          python3 scripts/verified_pr_source_checks.py prepare --run-id "$VERIFIED_PR" \
            --output "$RUNNER_TEMP/transport-source-proof"
      - name: Bind reviewed App sources for description-only planning
        if: inputs.candidate_kind == 'native-app-build-plan'
        env:
          KIND: ${{ inputs.candidate_kind }}
          VERIFIED_PR: ${{ inputs.verified_pr_run_id }}
          SCALE: ${{ inputs.interface_scale }}
        run: python3 scripts/native_app_build_plan.py bind --output "$RUNNER_TEMP/app-build-plan-source-binding"
      - name: Bind exact App target recipes and retained compiler products
        if: inputs.candidate_kind == 'native-app-targets'
        env:
          KIND: ${{ inputs.candidate_kind }}
          VERIFIED_PR: ${{ inputs.verified_pr_run_id }}
          SCALE: ${{ inputs.interface_scale }}
          RUNTIME_FAILURE_BINDING: ${{ inputs.runtime_failure_binding }}
        run: python3 scripts/native_app_target_build.py bind --output "$RUNNER_TEMP/app-target-source-binding"
      - uses: actions/upload-artifact@v4
        id: target-binding-upload
        if: always() && inputs.candidate_kind == 'native-app-targets'
        with:
          name: app-target-source-binding
          path: ${{ runner.temp }}/app-target-source-binding/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        id: plan-binding-upload
        if: always() && inputs.candidate_kind == 'native-app-build-plan'
        with:
          name: app-build-plan-source-binding
          path: ${{ runner.temp }}/app-build-plan-source-binding/
          if-no-files-found: error
          retention-days: 90
      - name: Bind the original failed button query and unchanged framework sources
        if: inputs.candidate_kind == 'native-button-query' || inputs.candidate_kind == 'native-button-query-crash' || inputs.candidate_kind == 'native-button-query-crash-reuse'
        env:
          KIND: ${{ inputs.candidate_kind }}
          VERIFIED_PR: ${{ inputs.verified_pr_run_id }}
          SCALE: ${{ inputs.interface_scale }}
          DMG_DIGEST: ${{ inputs.expected_dmg_sha256 }}
          JOURNEY_JOB: ${{ inputs.journey_job_id }}
          JOURNEY_ARTIFACT: ${{ inputs.journey_artifact_id }}
          JOURNEY_DIGEST: ${{ inputs.journey_artifact_sha256 }}
          EXTRA_SOURCE: ${{ inputs.product_source_sha }}
          EXTRA_PRODUCTS: ${{ inputs.products_artifact_id }}
          EXTRA_FAILURE: ${{ inputs.failure_artifact_id }}
          EXTRA_PRODUCTS_SHA: ${{ inputs.products_artifact_sha256 }}
          EXTRA_FAILURE_SHA: ${{ inputs.failure_artifact_sha256 }}
          RUNTIME_FAILURE_BINDING: ${{ inputs.runtime_failure_binding }}
        run: |
          python3 scripts/button_query_diagnostic.py bind --source-proof "$RUNNER_TEMP/transport-source-proof" \
            --evidence "$RUNNER_TEMP/button-query-source-binding"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.candidate_kind == 'native-button-query'
        with:
          name: native-button-query-source-binding
          path: ${{ runner.temp }}/button-query-source-binding/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && inputs.candidate_kind == 'native-button-query-crash'
        with:
          name: native-button-query-crash-source-binding
          path: ${{ runner.temp }}/button-query-source-binding/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && inputs.candidate_kind == 'native-button-query-crash-reuse'
        with:
          name: native-button-query-crash-reuse-source-binding
          path: ${{ runner.temp }}/button-query-source-binding/
          if-no-files-found: error
          retention-days: 90
      - name: Verify signed acceptance tooling
        if: inputs.candidate_kind == 'signed-release' && inputs.verified_pr_run_id == ''
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Bind exact retained runtime failures
        if: inputs.candidate_kind == 'native-retained-failures'
        env:
          KIND: ${{ inputs.candidate_kind }}
          VERIFIED_PR: ${{ inputs.verified_pr_run_id }}
          SCALE: ${{ inputs.interface_scale }}
          DMG_DIGEST: ${{ inputs.expected_dmg_sha256 }}
          RUNTIME_FAILURE_BINDING: ${{ inputs.runtime_failure_binding }}
        run: python3 scripts/retained_runtime_failure_diagnostic.py bind --output "$RUNNER_TEMP/runtime-failure-binding"
      - name: Bind the exact failed History step and current Source receipt
        if: inputs.candidate_kind == 'native-scene-history-hierarchy'
        env:
          VERIFIED_PR: ${{ inputs.verified_pr_run_id }}
          SCALE: ${{ inputs.interface_scale }}
          DMG_DIGEST: ${{ inputs.expected_dmg_sha256 }}
          RUNTIME_FAILURE_BINDING: ${{ inputs.runtime_failure_binding }}
        run: python3 scripts/scene_history_hierarchy.py bind --output "$RUNNER_TEMP/scene-history-source-binding"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.candidate_kind == 'native-scene-history-hierarchy'
        with:
          name: scene-history-hierarchy-source-binding
          path: ${{ runner.temp }}/scene-history-source-binding/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Bind the exact failed compact Undo step and current Source receipt
        if: inputs.candidate_kind == 'native-scene-pointer-delivery'
        env:
          VERIFIED_PR: ${{ inputs.verified_pr_run_id }}
          SCALE: ${{ inputs.interface_scale }}
          DMG_DIGEST: ${{ inputs.expected_dmg_sha256 }}
          RUNTIME_FAILURE_BINDING: ${{ inputs.runtime_failure_binding }}
        run: python3 scripts/scene_pointer_delivery.py bind --output "$RUNNER_TEMP/scene-pointer-source-binding"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.candidate_kind == 'native-scene-pointer-delivery'
        with:
          name: scene-pointer-source-binding
          path: ${{ runner.temp }}/scene-pointer-source-binding/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && inputs.candidate_kind == 'native-retained-failures'
        with:
          name: retained-runtime-failure-source-binding
          path: ${{ runner.temp }}/runtime-failure-binding/
          if-no-files-found: error
          retention-days: 90
      - name: Verify changed runtime acceptance tooling
        if: inputs.candidate_kind == 'ci-runtime'
        run: |
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_verify_macho_dependencies.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
          python3 -m unittest discover -s scripts -p 'test_release_workflow.py'
      - name: Verify retained signed bpy acceptance tooling
        if: inputs.candidate_kind == 'signed-bpy' && inputs.packaging_producer_source_sha == ''
        run: |
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
          python3 -m unittest discover -s scripts -p 'test_release_workflow.py'
          python3 -m unittest discover -s scripts -p 'test_consume_bpy_distributable_source.py'
      - name: Verify isolated bpy diagnostic tooling
        if: inputs.candidate_kind == 'ci-bpy-open-diagnostic'
        run: |
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_bpy_open_diagnostic.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
      - name: Bind original bpy resource diagnostic
        if: inputs.candidate_kind == 'ci-bpy-resource-diagnostic'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_bpy_resource_diagnostic.py'
          python3 -m unittest discover -s scripts -p 'test_bpy_open_diagnostic.py'
          python3 -m unittest discover -s scripts -p 'test_bpy_runtime_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
          python3 scripts/bpy_resource_diagnostic.py bind --evidence "$RUNNER_TEMP/bpy-resource-identity"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.candidate_kind == 'ci-bpy-resource-diagnostic'
        with:
          name: bpy-resource-identity
          path: ${{ runner.temp }}/bpy-resource-identity/
          if-no-files-found: error
          retention-days: 90
      - name: Verify isolated App diagnostic tooling
        if: inputs.candidate_kind == 'ci-app-test-diagnostic'
        run: |
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_run_macos_tests.py'
          python3 -m unittest discover -s scripts -p 'test_app_host_zombie_diagnostic.py'
          python3 -m unittest discover -s scripts -p 'test_swift_test_failure_propagation.py'
          python3 -m unittest discover -s scripts -p 'test_appkit_host_stale_diagnostic.py'
          python3 -m unittest discover -s scripts -p 'test_runloop_probe_preparation.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
      - name: Verify and bind exact Glow context comparison
        if: inputs.candidate_kind == 'ci-glow-context'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_glow_context.py'
          python3 -m unittest discover -s scripts -p 'test_runtime_staging.py'
          python3 -m unittest discover -s scripts -p 'test_ci_builtin_blur*.py'
          python3 -m unittest discover -s scripts -p 'test_run_macos_tests.py'
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
          python3 scripts/ci_glow_context.py bind --evidence "$RUNNER_TEMP/glow-context-binding"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.candidate_kind == 'ci-glow-context'
        with:
          name: glow-context-binding
          path: ${{ runner.temp }}/glow-context-binding
          if-no-files-found: error
          retention-days: 90
      - name: Verify and bind standalone preheat comparison
        if: inputs.candidate_kind == 'ci-builtin-blur-preheat'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_builtin_blur*.py'
          python3 -m unittest discover -s scripts -p 'test_run_macos_tests.py'
          python3 -m unittest discover -s scripts -p 'test_diagnostic_acceptance.py'
          python3 -m unittest discover -s scripts -p 'test_ci_workflow.py'
          python3 scripts/ci_builtin_blur_preheat.py bind --evidence "$RUNNER_TEMP/preheat-binding"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.candidate_kind == 'ci-builtin-blur-preheat'
        with:
          name: preheat-binding
          path: ${{ runner.temp }}/preheat-binding
          if-no-files-found: error
          retention-days: 90
      - name: Verify and bind original standalone floor runtime
        if: inputs.candidate_kind == 'ci-builtin-blur-floor'
        env:
