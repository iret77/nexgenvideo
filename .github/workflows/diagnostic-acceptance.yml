  ci-app-test:
    needs: source
    if: inputs.candidate_kind == 'ci-app-test-diagnostic'
    runs-on: macrunner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-test-python
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-candidate-identity
          path: ${{ runner.temp }}/candidate-metadata
      - name: Preserve the reviewed harness and bind the original test source
        env:
          HARNESS_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          metadata = json.loads((root / 'candidate-metadata/harness.json').read_text())
          assert metadata['candidateKind'] == 'ci-app-test-diagnostic'
          assert metadata['buildSourceSHA'] == os.environ['CANDIDATE_SOURCE']
          assert metadata['harnessSourceSHA'] == os.environ['HARNESS_SOURCE']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['HARNESS_SOURCE']
          harness = root / 'app-diagnostic-harness'
          harness.mkdir()
          hashes = {}
          for name in ('run_macos_tests.py', 'app_host_zombie_diagnostic.py', 'verify_swift_test_output.py',
                       'capture_render_review_test_diagnostic.py'):
              source = Path('scripts') / name
              shutil.copyfile(source, harness / name)
              hashes[name] = hashlib.sha256(source.read_bytes()).hexdigest()
          metadata['copiedHarnessSHA256'] = hashes
          metadata['originalRunID'] = os.environ['CANDIDATE_RUN']
          metadata['originalArtifactID'] = os.environ['CANDIDATE_ARTIFACT']
          metadata['originalArtifactSHA256'] = os.environ['CANDIDATE_DIGEST']
          (root / 'candidate-metadata/diagnostic-execution.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          git checkout --detach "$CANDIDATE_SOURCE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE"
          test -z "$(git status --porcelain)"
      - uses: ./.github/actions/setup-xcode-27
      - name: Check native diagnostic interfaces and ambient switches before compiling
        timeout-minutes: 1
        run: |
          python3 -I - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          module_path = root / 'app-diagnostic-harness/app_host_zombie_diagnostic.py'
          spec = importlib.util.spec_from_file_location('zombie_diagnostic', module_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          receipt = {'scope': 'prebuild current-process API and ambient-environment check; actual App proof remains required'}
          try:
              module.zombie_environment(os.environ)
              reader = module.NativeReader()
              assert reader.usage(os.getpid())['startAbsoluteTime'] > 0
              assert len(reader.arguments(os.getpid())) > 4
              receipt['status'] = 'available'
          except Exception as error:
              receipt.update(status='unavailable', errorType=type(error).__name__, errno=getattr(error, 'errno', None))
          (root / 'candidate-metadata/native-preflight.json').write_text(json.dumps(receipt, indent=2) + '\n')
          raise SystemExit(0 if receipt['status'] == 'available' else 1)
          PY
      - uses: ./.github/actions/cache-swiftpm-dependencies
        with:
          restore-only: 'true'
      - name: Compile unchanged original native test products
        timeout-minutes: 40
        run: |
          set -euo pipefail
          swift build --cache-path "$NGV_SWIFTPM_CACHE_PATH" --build-tests 2>&1 | tee "$RUNNER_TEMP/app-diagnostic-build.log"
          scripts/verify_tracked_source_state.sh
          scripts/stage_test_runtime.sh debug
      - name: Retain compiled products before diagnostic execution
        timeout-minutes: 10
        env:
          HARNESS_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          BIN_ROOT="$(swift build --cache-path "$NGV_SWIFTPM_CACHE_PATH" --show-bin-path)"
          export BIN_ROOT
          python3 -I - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          binary = Path(os.environ['BIN_ROOT']).resolve(strict=True)
          records = {}
          for relative in ('NexGenVideoAppKitTestHost', 'NexGenVideoTests.xctest/Contents/MacOS/NexGenVideoTests'):
              path = binary / relative
              records[relative] = {'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                                   'uuidOutput': subprocess.check_output(['xcrun', 'dwarfdump', '--uuid', str(path)], text=True)}
          record = {'productSourceSHA': os.environ['CANDIDATE_SOURCE'], 'harnessSourceSHA': os.environ['HARNESS_SOURCE'],
                    'binRoot': str(binary), 'binaries': records,
                    'toolchain': subprocess.check_output(['xcodebuild', '-version'], text=True),
                    'reuseStatus': 'Retained original products; relocation and consumer binding require verification'}
          (Path(os.environ['RUNNER_TEMP']) / 'candidate-metadata/compiled-products.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
          ditto -c -k --keepParent "$BIN_ROOT" "$RUNNER_TEMP/app-test-products.zip"
          shasum -a 256 "$RUNNER_TEMP/app-test-products.zip" > "$RUNNER_TEMP/candidate-metadata/compiled-products.sha256"
      - name: Diagnose the original full App SwiftTesting backend once
        id: app_test
        timeout-minutes: 30
        env:
          NGV_BLOCKOUT_ORIENTATION_EVIDENCE_DIR: ${{ runner.temp }}/blockout-orientation-evidence
        run: |
          set -euo pipefail
          export SWIFT_BACKTRACE=enable=yes,interactive=no,demangle=yes,cache=no
          python3 "$RUNNER_TEMP/app-diagnostic-harness/capture_render_review_test_diagnostic.py" \
            --evidence "$RUNNER_TEMP/app-zombie-diagnostic" --log "$RUNNER_TEMP/app-zombie-test.log" \
            --swift-testing-runs 1 --xctest-runs 0 --without-runloop-probe --app-only -- \
            python3 "$RUNNER_TEMP/app-diagnostic-harness/run_macos_tests.py" --cache-path "$NGV_SWIFTPM_CACHE_PATH" \
              --scope app-swift-testing --app-diagnostic zombies \
              --product-source-sha "$CANDIDATE_SOURCE" \
              --evidence "$RUNNER_TEMP/app-zombie-diagnostic/hosted-suite"
      - name: Verify diagnostic completion and unchanged source
        run: |
          set -euo pipefail
          scripts/verify_tracked_source_state.sh
          python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'app-zombie-diagnostic/hosted-suite'
          suite = json.loads((root / 'suite.json').read_text())
          assert suite['sourceSHA'] == suite['harnessSourceSHA'] == os.environ['GITHUB_SHA']
          assert suite['productSourceSHA'] == os.environ['CANDIDATE_SOURCE'] and suite['completed'] is True
          assert suite['scope'] == 'app-swift-testing' and suite['filter'] == ''
          assert len(suite['phases']) == 1
          phase = suite['phases'][0]
          assert phase['exitCode'] == 0 and phase['diagnostic']['status'] == 'verified'
          assert phase['diagnostic']['pid'] == phase['pid'] == phase['originalHostReceipt']['pid']
          ended = phase['events']['endedFunctionIDs']
          for method in ('neutralIsNoOp', 'bleedsLightIntoNeighbors', 'warmthTintsTheBleedRed'):
              assert sum(name.startswith('NexGenVideoTests.GlowKernelTests/' + method + '()/') for name in ended) == 1
          assert sum(name.startswith('NexGenVideoTests.BpyStorageBookmarkTests/') for name in ended) == 7
          (root / 'interpretation.json').write_text(json.dumps({
              'status': 'diagnostic-run-completed', 'rootCause': 'not-established-by-a-pass',
              'coreAcceptance': False, 'nativeUXAcceptance': False, 'releaseAcceptance': False,
          }, indent=2) + '\n')
          PY
      - name: Upload original App diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-zombie-diagnostic-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app-zombie-diagnostic
            ${{ runner.temp }}/app-zombie-test.log
            ${{ runner.temp }}/app-diagnostic-build.log
            ${{ runner.temp }}/candidate-metadata
            ${{ runner.temp }}/blockout-orientation-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Upload retained native test products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-products-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-test-products.zip
          if-no-files-found: ignore
          retention-days: 7

  app-target-build:
    needs: source
    if: inputs.candidate_kind == 'native-app-targets'
    runs-on: macrunner
    timeout-minutes: 50
    env:
      VERIFIED_PR: ${{ inputs.verified_pr_run_id }}
      SCALE: ${{ inputs.interface_scale }}
      RUNTIME_FAILURE_BINDING: ${{ inputs.runtime_failure_binding }}
      TARGET_BINDING_ARTIFACT_ID: ${{ needs.source.outputs.target-binding-id }}
      TARGET_BINDING_DIGEST: ${{ needs.source.outputs.target-binding-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare artifact service probe
        run: |
          printf '{"repository":"%s","runID":"%s","attempt":"%s","sourceSHA":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            > "$RUNNER_TEMP/app-target-artifact-probe.json"
          cat "$RUNNER_TEMP/app-target-artifact-probe.json"
      - name: Require working artifact service before native work
        id: artifact_probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 3
        with:
          name: app-target-artifact-probe
          path: ${{ runner.temp }}/app-target-artifact-probe.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: ./.github/actions/setup-xcode-27
      - uses: ./.github/actions/setup-native-test-python
      - uses: ./.github/actions/cache-swiftpm-dependencies
        with:
          restore-only: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: app-target-source-binding
          path: ${{ runner.temp }}/app-target-source-binding
      - name: Restore exact recipes and unchanged product bank
        run: |
          python3 scripts/native_app_target_build.py prepare \
            --source-binding "$RUNNER_TEMP/app-target-source-binding/binding.json" \
            --output "$RUNNER_TEMP/app-target-build"
      - name: Select immutable retained product uploads
        id: retained_products
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'app-target-build'
          prepared = json.loads((root / 'prepared.json').read_bytes())
          decisions = {}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for phase in ('production', 'testable', 'tests'):
                  resumed = prepared['resumedProducts'].get(phase, {})
                  state = resumed.get('receipt', {}).get('state', {})
                  retained = state.get('compileComplete') is True and state.get('linkComplete') is True
                  selector = None
                  if retained:
                      original = resumed['origin']['selected']
                      selector = {key: original[key] for key in (
                          'runID', 'sourceSHA', 'artifactID', 'artifactSHA256', 'receiptSHA256')}
                  decisions[phase] = {'retained': retained, 'selector': selector}
                  output.write(f'{phase}={str(retained).lower()}\n')
          (root / 'upload-selection.json').write_text(json.dumps({
              'schema': 'native-app-target-upload-selection/v1', 'roles': decisions}, indent=2) + '\n')
          PY
      - name: Build only the current production App target
        id: production
        run: python3 scripts/native_app_target_build.py production --output "$RUNNER_TEMP/app-target-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.production.outcome != 'skipped' && (steps.retained_products.outputs.production != 'true' || steps.production.outcome != 'success')
        id: production_upload
        with:
          name: app-target-production-products
          path: ${{ runner.temp }}/app-target-build/production-products.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Build only the current testable App target
        id: testable
        run: python3 scripts/native_app_target_build.py testable --output "$RUNNER_TEMP/app-target-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.testable.outcome != 'skipped' && (steps.retained_products.outputs.testable != 'true' || steps.testable.outcome != 'success')
        id: testable_upload
        with:
          name: app-target-testable-products
          path: ${{ runner.temp }}/app-target-build/testable-products.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Build only the dependent App tests target
        id: tests
        run: python3 scripts/native_app_target_build.py tests --output "$RUNNER_TEMP/app-target-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.tests.outcome != 'skipped' && (steps.retained_products.outputs.tests != 'true' || steps.tests.outcome != 'success')
        id: tests_upload
        with:
          name: app-target-tests-products
          path: ${{ runner.temp }}/app-target-build/tests-products.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Select required fallback directories
        id: fallback_selection
        if: always() && steps.artifact_probe.outcome == 'success'
        env:
          PRODUCTION_FALLBACK: ${{ steps.production.outcome != 'skipped' && (steps.retained_products.outputs.production != 'true' || steps.production.outcome != 'success') && steps.production_upload.outcome != 'success' }}
          TESTABLE_FALLBACK: ${{ steps.testable.outcome != 'skipped' && (steps.retained_products.outputs.testable != 'true' || steps.testable.outcome != 'success') && steps.testable_upload.outcome != 'success' }}
          TESTS_FALLBACK: ${{ steps.tests.outcome != 'skipped' && (steps.retained_products.outputs.tests != 'true' || steps.tests.outcome != 'success') && steps.tests_upload.outcome != 'success' }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, stat
          from pathlib import Path

          temporary = Path(os.environ['RUNNER_TEMP'])
          root = temporary / 'app-target-build'
          root.mkdir(parents=True, exist_ok=True)
          roles = [phase for phase in ('production', 'testable', 'tests')
              if os.environ.get(phase.upper() + '_FALLBACK') != 'false']
          paths = []
          if roles:
              prepared = json.loads((root / 'prepared.json').read_bytes())
              references = {}
              def remember(files, origin, prefix):
                  for name, item in files.items():
                      if item['kind'] == 'file':
                          references.setdefault((item['sha256'], item['bytes']), dict(origin, member=prefix + name))
              for phase, resumed in prepared['resumedProducts'].items():
                  receipt = resumed['receipt']
                  if receipt['state']['compileComplete'] is True and receipt['state']['linkComplete'] is True:
                      remember(receipt['files'], {'kind': 'retained-role', 'role': phase,
                          'selector': resumed['origin']['selected']}, phase + '-products.zip!/outputs/')
              source = temporary / 'app-target-source-binding'
              manifest_raw = (source / 'bank-runtime-manifest.json').read_bytes()
              manifest = json.loads(manifest_raw)
              binding = json.loads((source / 'binding.json').read_bytes())
              bank = binding['retainedBank']['runtimeArtifact']
              remember(manifest['files'], {'kind': 'retained-runtime-bank', 'artifactID': bank['id'],
                  'artifactSHA256': bank['digest'].removeprefix('sha256:'),
                  'runID': bank['workflow_run']['id'], 'sourceSHA': bank['workflow_run']['head_sha'],
                  'manifestSHA256': hashlib.sha256(manifest_raw).hexdigest()}, 'runtime-products.zip!/Release/')
              staging = temporary / 'app-target-fallback-stage'
              staging.mkdir()
              candidates = [root / 'tests-driver-plan', temporary / 'app-build-plan-evidence']
              candidates.extend(root / phase for phase in roles)
              candidates.extend(root / (phase + '-products.zip') for phase in roles)
              candidates.extend(path for pattern in ('*.json', '*.stdout', '*.stderr') for path in root.glob(pattern))
              copied, reused, links, seen = {}, {}, {}, set()
              for candidate in candidates:
                  entries = [candidate, *sorted(candidate.rglob('*'))] if candidate.is_dir() and not candidate.is_symlink() else [candidate]
                  for path in entries:
                      if not path.exists() and not path.is_symlink():
                          continue
                      relative = path.relative_to(temporary).as_posix()
                      if relative in seen:
                          continue
                      seen.add(relative)
                      mode = stat.S_IMODE(path.lstat().st_mode)
                      if path.is_symlink():
                          links[relative] = {'target': os.readlink(path), 'mode': mode}
                          continue
                      if not path.is_file():
                          continue
                      descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
                      with os.fdopen(descriptor, 'rb') as stream:
                          before = os.fstat(stream.fileno())
                          assert stat.S_ISREG(before.st_mode)
                          digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                          item = {'sha256': digest, 'bytes': before.st_size, 'mode': mode}
                          original = references.get((digest, before.st_size))
                          if original is not None:
                              reused[relative] = dict(item, original=original)
                          else:
                              destination = staging / relative
                              destination.parent.mkdir(parents=True, exist_ok=True)
                              stream.seek(0)
                              with destination.open('xb') as output:
                                  shutil.copyfileobj(stream, output)
                              os.chmod(destination, mode)
                              copied[relative] = item
                          after = os.fstat(stream.fileno())
                          assert (before.st_size, before.st_mtime_ns) == (after.st_size, after.st_mtime_ns)
              index = json.dumps({
                  'schema': 'native-app-target-differential-fallback/v1', 'roles': roles,
                  'copiedFiles': copied, 'retainedReferences': reused, 'symlinks': links}, indent=2) + '\n'
              (staging / 'fallback-index.json').write_text(index)
              (root / 'fallback-index.json').write_text(index)
              paths = [staging]
          (root / 'fallback-selection.json').write_text(json.dumps({
              'schema': 'native-app-target-fallback-selection/v1', 'roles': roles,
              'paths': [str(path) for path in paths]}, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'required={str(bool(roles)).lower()}\npaths<<NGV_FALLBACK_PATHS\n')
              output.write(''.join(str(path) + '\n' for path in paths))
              output.write('NGV_FALLBACK_PATHS\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.artifact_probe.outcome == 'success' && steps.fallback_selection.outputs.required != 'false'
        with:
          name: app-target-retention-fallback
          path: |
            ${{ steps.fallback_selection.outputs.paths || format('{0}/app-target-build/', runner.temp) }}
            ${{ steps.fallback_selection.outputs.paths == '' && format('{0}/app-build-plan-evidence/', runner.temp) || '' }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.artifact_probe.outcome == 'success'
        with:
          name: app-target-build-evidence
          path: |
            ${{ runner.temp }}/app-target-build/tests-driver-plan/
            ${{ runner.temp }}/app-target-build/partial-driver-cache/
            ${{ runner.temp }}/app-target-build/*.json
            ${{ runner.temp }}/app-target-build/*.stdout
            ${{ runner.temp }}/app-target-build/*.stderr
            ${{ runner.temp }}/app-target-build/production/*.json
            ${{ runner.temp }}/app-target-build/production/*.stdout
            ${{ runner.temp }}/app-target-build/production/*.stderr
            ${{ runner.temp }}/app-target-build/testable/*.json
            ${{ runner.temp }}/app-target-build/testable/*.stdout
            ${{ runner.temp }}/app-target-build/testable/*.stderr
            ${{ runner.temp }}/app-target-build/tests/*.json
            ${{ runner.temp }}/app-target-build/tests/*.stdout
            ${{ runner.temp }}/app-target-build/tests/*.stderr
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  app-build-plan:
    needs: source
    if: inputs.candidate_kind == 'native-app-build-plan'
    runs-on: macrunner
    timeout-minutes: 15
