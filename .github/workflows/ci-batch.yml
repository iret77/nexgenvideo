name: CI Batch

# The only entry point for heavy verification: one owner-approved manual run covering several merges.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Initial verification, exact-app followup, or managed bpy qualification
        type: choice
        options: [initial, followup, qualification]
        default: initial
      followup_workflow:
        description: Only this acceptance runs in followup mode; initial mode requires none
        type: choice
        options: [none, externalgui, settings, smartsearch]
        default: none
      runtime_run_id:
        description: Same-source producer run required in followup mode
        type: string
        default: ''
      qualification_binary_run_id:
        description: Optional prior qualification run; reuse its passing binary evidence without another Mac job
        type: string
        default: ''
      qualification_source_run_id:
        description: Optional exact qualification run with retained verified source downloads, including a failed partial run
        type: string
        default: ''
      settings_scope:
        description: Settings or Recovery cases for a settings followup
        type: choice
        options: [all, settings, settings100, settings125, settings150, packrecovery, packrecovery100, packrecovery125, packrecovery150, packresume172, packresume172100, packresume172125, packresume172150]
        default: all
      interface_scale:
        description: Text size for an externalgui followup
        type: choice
        options: [all, '1', '1.25', '1.5']
        default: all
      test_bundle_run_id:
        description: Optional same-source external UI test producer for an externalgui followup
        type: string
        default: ''
      hang_replays:
        description: Run the chat and recorded hang replays
        type: boolean
        default: true
      recorded_hang_replay:
        description: Include optimized recorded replay; disable when already verified in this build incident
        type: boolean
        default: true
      signing_preflight:
        description: Run the Developer ID signing preflight
        type: boolean
        default: true
      workspace_ui_acceptance:
        description: Run the workspace UI acceptance
        type: boolean
        default: true
      settings_owner_acceptance:
        description: Run native Settings and genuine pack Recovery/restart acceptance
        type: boolean
        default: true
      smart_search_owner_acceptance:
        description: Run actual Smart Search download, CoreML, Storage and warm layouts
        type: boolean
        default: true
      musicvideo_analysis_acceptance:
        description: Run real audio analysis and startup handoffs with the private fixture
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate verification mode and inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.inputs.outputs.mode }}
    steps:
      - name: Reject incomplete or incompatible dispatch inputs
        id: inputs
        env:
          NGV_MODE: ${{ inputs.mode }}
          NGV_FOLLOWUP: ${{ inputs.followup_workflow }}
          NGV_RUNTIME_RUN: ${{ inputs.runtime_run_id }}
          NGV_QUALIFICATION_RUN: ${{ inputs.qualification_binary_run_id }}
          NGV_SOURCE_RUN: ${{ inputs.qualification_source_run_id }}
          NGV_SETTINGS_SCOPE: ${{ inputs.settings_scope }}
          NGV_INTERFACE_SCALE: ${{ inputs.interface_scale }}
          NGV_TEST_BUNDLE_RUN: ${{ inputs.test_bundle_run_id }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          mode = os.environ['NGV_MODE']
          followup = os.environ['NGV_FOLLOWUP']
          run_id = os.environ['NGV_RUNTIME_RUN']
          binary_run_id = os.environ['NGV_QUALIFICATION_RUN']
          source_run_id = os.environ['NGV_SOURCE_RUN']
          settings = os.environ['NGV_SETTINGS_SCOPE']
          scale = os.environ['NGV_INTERFACE_SCALE']
          test_run = os.environ.get('NGV_TEST_BUNDLE_RUN', '')
          if test_run and (mode != 'followup' or followup != 'externalgui'
                           or not re.fullmatch(r'[1-9][0-9]*', test_run)):
              raise SystemExit('UI test producer applies only to an externalgui followup.')
          scopes = {'all', 'settings', 'settings100', 'settings125', 'settings150',
                    'packrecovery', 'packrecovery100', 'packrecovery125', 'packrecovery150',
                    'packresume172', 'packresume172100', 'packresume172125', 'packresume172150'}
          if mode not in {'initial', 'followup', 'qualification'}:
              raise SystemExit('Select initial, followup or qualification mode.')
          if settings not in scopes or scale not in {'all', '1', '1.25', '1.5'}:
              raise SystemExit('Select a supported Settings case and interface scale.')
          if mode != 'qualification' and (binary_run_id or source_run_id):
              raise SystemExit('Qualification run IDs apply only to qualification mode.')
          if mode == 'qualification':
              if followup != 'none' or run_id or settings != 'all' or scale != 'all':
                  raise SystemExit('Qualification requires no app followup/run ID and default acceptance selectors.')
              if binary_run_id and not re.fullmatch(r'[1-9][0-9]*', binary_run_id):
                  raise SystemExit('qualification_binary_run_id must identify a positive prior producer run.')
              if source_run_id and not re.fullmatch(r'[1-9][0-9]*', source_run_id):
                  raise SystemExit('qualification_source_run_id must identify a positive prior source run.')
          elif mode == 'initial':
              if followup != 'none' or run_id or settings != 'all' or scale != 'all':
                  raise SystemExit('Initial mode requires no followup/run ID and default acceptance selectors.')
          else:
              if followup not in {'externalgui', 'settings', 'smartsearch'}:
                  raise SystemExit('Followup mode requires externalgui, settings or smartsearch.')
              if not re.fullmatch(r'[1-9][0-9]*', run_id):
                  raise SystemExit('Followup mode requires a positive producer runtime_run_id.')
              if followup != 'settings' and settings != 'all':
                  raise SystemExit('settings_scope applies only to a settings followup.')
              if followup != 'externalgui' and scale != 'all':
                  raise SystemExit('interface_scale applies only to an externalgui followup.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('mode=' + mode + '\n')
          PYTHON
      - uses: actions/checkout@v4
        if: inputs.mode == 'followup'
      - name: Require an existing exact same-source app before allocating Mac jobs
        if: inputs.mode == 'followup'
        env:
          GH_TOKEN: ${{ github.token }}
          NGV_RUNTIME_RUN: ${{ inputs.runtime_run_id }}
        run: |
          python3 scripts/workspace_native_ci.py resolve --run-id "$NGV_RUNTIME_RUN" \
            --artifact workspace-ui-app --identity "$RUNNER_TEMP/followup-runtime-identity.json"

  bpy-qualification:
    needs: validate
    if: needs.validate.outputs.mode == 'qualification'
    name: bpy-qualification
    uses: ./.github/workflows/bpy-source-closure.yml
    with:
      distribution: false
      source_only: ${{ inputs.qualification_binary_run_id != '' }}
      binary_evidence_run_id: ${{ inputs.qualification_binary_run_id }}
      source_evidence_run_id: ${{ inputs.qualification_source_run_id }}

  ci:
    needs: validate
    if: needs.validate.outputs.mode == 'initial'
    name: Compile, unit tests, app and native bpy acceptance
    uses: ./.github/workflows/ci.yml

  chat-hang-replay:
    needs: [validate, ci]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.ci.result == 'success' && needs.validate.outputs.mode == 'initial' && inputs.hang_replays }}
    uses: ./.github/workflows/chat-hang-replay.yml
    with:
      runtime_artifact: workspace-ui-app

  recorded-hang-replay:
    needs: validate
    if: needs.validate.outputs.mode == 'initial' && inputs.hang_replays && inputs.recorded_hang_replay
    uses: ./.github/workflows/recorded-hang-replay.yml
    secrets: inherit

  signing-preflight:
    needs: validate
    if: needs.validate.outputs.mode == 'initial' && inputs.signing_preflight
    uses: ./.github/workflows/signing-preflight.yml
    secrets: inherit

  workspace-ui-acceptance:
    needs: [validate, ci]
    if: needs.validate.outputs.mode == 'initial' && inputs.workspace_ui_acceptance
    uses: ./.github/workflows/workspace-ui-acceptance.yml
    with:
      runtime_artifact: workspace-ui-app

  external-gui-acceptance:
    needs: [validate, ci]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
          ((needs.validate.outputs.mode == 'initial' && needs.ci.result == 'success' && inputs.workspace_ui_acceptance) ||
           (needs.validate.outputs.mode == 'followup' && needs.ci.result == 'skipped' && inputs.followup_workflow == 'externalgui')) }}
    uses: ./.github/workflows/external-gui-acceptance.yml
    with:
      runtime_run_id: ${{ inputs.runtime_run_id }}
      interface_scale: ${{ inputs.interface_scale }}
      test_bundle_run_id: ${{ inputs.test_bundle_run_id }}

  settings-owner-acceptance:
    needs: [validate, ci]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
          ((needs.validate.outputs.mode == 'initial' && needs.ci.result == 'success' && inputs.settings_owner_acceptance) ||
           (needs.validate.outputs.mode == 'followup' && needs.ci.result == 'skipped' && inputs.followup_workflow == 'settings')) }}
    uses: ./.github/workflows/settings-owner-acceptance.yml
    with:
      runtime_artifact: workspace-ui-app
      runtime_run_id: ${{ inputs.runtime_run_id }}
      acceptance_scope: ${{ inputs.settings_scope }}

  musicvideo-analysis-acceptance:
    needs: [validate, ci]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.ci.result == 'success' && needs.validate.outputs.mode == 'initial' && inputs.musicvideo_analysis_acceptance }}
    uses: ./.github/workflows/private-example-analysis.yml
    with:
      runtime_artifact: workspace-ui-app
    secrets:
      NGV_GHCR_TOKEN: ${{ secrets.NGV_GHCR_TOKEN }}

  smart-search-owner-acceptance:
    needs: [validate, ci]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
          ((needs.validate.outputs.mode == 'initial' && needs.ci.result == 'success' && inputs.smart_search_owner_acceptance) ||
           (needs.validate.outputs.mode == 'followup' && needs.ci.result == 'skipped' && inputs.followup_workflow == 'smartsearch')) }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/smart-search-owner-acceptance.yml
    with:
      runtime_run_id: ${{ inputs.runtime_run_id }}
