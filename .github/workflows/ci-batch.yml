name: CI Batch

# The only entry point for heavy verification: one owner-approved manual run covering several merges.
on:
  workflow_dispatch:
    inputs:
      hang_replays:
        description: Run the chat and recorded hang replays
        type: boolean
        default: true
      recorded_hang_replay:
        description: Include optimized recorded replay; disable when already verified in this build incident
        type: boolean
        default: true
      signing_preflight:
        description: Run the Developer ID signing preflight
        type: boolean
        default: true
      workspace_ui_acceptance:
        description: Run the workspace UI acceptance
        type: boolean
        default: true
      musicvideo_analysis_acceptance:
        description: Run real audio analysis and startup handoffs with the private fixture
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  chat-hang-replay:
    needs: workspace-ui-acceptance
    if: ${{ !cancelled() && inputs.hang_replays }}
    uses: ./.github/workflows/chat-hang-replay.yml
    with:
      runtime_artifact: ${{ inputs.workspace_ui_acceptance && 'workspace-ui-app' || '' }}

  recorded-hang-replay:
    if: inputs.hang_replays && inputs.recorded_hang_replay
    uses: ./.github/workflows/recorded-hang-replay.yml
    secrets: inherit

  signing-preflight:
    if: inputs.signing_preflight
    uses: ./.github/workflows/signing-preflight.yml
    secrets: inherit

  workspace-ui-acceptance:
    if: inputs.workspace_ui_acceptance
    uses: ./.github/workflows/workspace-ui-acceptance.yml

  musicvideo-analysis-acceptance:
    needs: workspace-ui-acceptance
    if: ${{ !cancelled() && inputs.musicvideo_analysis_acceptance }}
    uses: ./.github/workflows/private-example-analysis.yml
    with:
      runtime_artifact: ${{ inputs.workspace_ui_acceptance && 'workspace-ui-app' || '' }}
    secrets:
      NGV_GHCR_TOKEN: ${{ secrets.NGV_GHCR_TOKEN }}
