name: Private Example Audio Analysis

# ci-lint: allow-CI008 Only manual dispatch or the owner-approved CI batch starts this macOS job.

# Real media never enters git or public Actions artifacts. A manually dispatched run pulls a
# private, unlinked GHCR OCI artifact by immutable digest, executes the real bundled app + pack,
# and pushes the analysis and provenance record into a second private, unlinked GHCR package.
on:
  workflow_dispatch:
    inputs:
      packaging_producer_source_sha:
        type: string
        default: ''
      packaging_provenance_artifact_id:
        type: string
        default: ''
      packaging_provenance_artifact_sha256:
        type: string
        default: ''
      dataset:
        description: "Dataset id from the private fixture manifest"
        required: true
        default: "claude_mouse"
        type: string
      runtime_run_id:
        description: Original signed release producer run
        type: string
        default: ''
      runtime_source_sha:
        description: Original App source commit
        type: string
        default: ''
      runtime_artifact_id:
        description: Immutable original workspace-ui-app artifact ID
        type: string
        default: ''
      runtime_artifact_sha256:
        description: Original GitHub artifact SHA256
        type: string
        default: ''
      verified_pr_run_id:
        description: Successful exact-tree PR source checks
        type: string
        default: ''
  workflow_call:
    inputs:
      packaging_producer_source_sha:
        type: string
        default: ''
      packaging_provenance_artifact_id:
        type: string
        default: ''
      packaging_provenance_artifact_sha256:
        type: string
        default: ''
      dataset:
        type: string
        default: "claude_mouse"
      runtime_artifact:
        description: Already-built app and external pack from this CI batch
        type: string
        default: ""
      verified_pr_run_id:
        description: Successful PR source checks for this exact merge tree
        type: string
        default: ""
      runtime_run_id:
        type: string
        default: ''
      runtime_source_sha:
        type: string
        default: ''
      runtime_artifact_id:
        type: string
        default: ''
      runtime_artifact_sha256:
        type: string
        default: ''
    secrets:
      NGV_GHCR_TOKEN:
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  PACKAGING_PRODUCER_SOURCE: ${{ inputs.packaging_producer_source_sha }}
  PACKAGING_PROVENANCE_ARTIFACT_ID: ${{ inputs.packaging_provenance_artifact_id }}
  PACKAGING_PROVENANCE_ARTIFACT_SHA256: ${{ inputs.packaging_provenance_artifact_sha256 }}
  VERIFIED_PR_RUN: ${{ inputs.verified_pr_run_id }}
  ORIGINAL_RUN: ${{ inputs.runtime_run_id }}
  ORIGINAL_SOURCE: ${{ inputs.runtime_source_sha }}
  ORIGINAL_ARTIFACT: ${{ inputs.runtime_artifact_id }}
  ORIGINAL_DIGEST: ${{ inputs.runtime_artifact_sha256 }}

concurrency:
  group: private-example-analysis-${{ github.ref }}-${{ inputs.dataset }}
  cancel-in-progress: false

jobs:
  source-gate:
    name: Private Fixture Gate
    runs-on: ubuntu-24.04
    # The full source suite alone took 363 seconds; fixture download and isolation checks run here too.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate dispatch contract
        env:
          FIXTURE_DIGEST: ${{ vars.NGV_EXAMPLE_FIXTURE_DIGEST }}
          DATASET: ${{ inputs.dataset }}
          NGV_GHCR_TOKEN: ${{ secrets.NGV_GHCR_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$FIXTURE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::fixture_digest must be an exact lowercase sha256 digest"; exit 1; }
          [[ "$DATASET" =~ ^[a-z0-9][a-z0-9_-]*$ ]] \
            || { echo "::error::dataset must be a stable manifest id"; exit 1; }
          [ -n "$NGV_GHCR_TOKEN" ] \
            || { echo "::error::NGV_GHCR_TOKEN is not configured"; exit 1; }

      - name: Verify private package isolation
        env:
          GH_TOKEN: ${{ secrets.NGV_GHCR_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_JSON="$(gh api /users/iret77/packages/container/nexgenvideo-examples)"
          [ "$(jq -r '.visibility' <<<"$PACKAGE_JSON")" = "private" ] \
            || { echo "::error::input fixture package is not private"; exit 1; }
          [ "$(jq -r '.repository // empty' <<<"$PACKAGE_JSON")" = "" ] \
            || { echo "::error::input fixture package is linked to a repository"; exit 1; }
          REPORT_PACKAGE_JSON="$(gh api /users/iret77/packages/container/nexgenvideo-analysis-reports)"
          [ "$(jq -r '.visibility' <<<"$REPORT_PACKAGE_JSON")" = "private" ] \
            || { echo "::error::analysis report package is not private"; exit 1; }
          [ "$(jq -r '.repository // empty' <<<"$REPORT_PACKAGE_JSON")" = "" ] \
            || { echo "::error::analysis report package is linked to a repository"; exit 1; }

      - name: Bind the original signed App before macOS allocation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$PACKAGING_PRODUCER_SOURCE$PACKAGING_PROVENANCE_ARTIFACT_ID$PACKAGING_PROVENANCE_ARTIFACT_SHA256" ]; then
            [[ "$VERIFIED_PR_RUN" =~ ^[1-9][0-9]*$ ]] || { echo 'Retained packaging requires complete current PR source proof'; exit 1; }
          fi
          if [ -z "$ORIGINAL_RUN" ]; then
            test -z "$ORIGINAL_SOURCE$ORIGINAL_ARTIFACT$ORIGINAL_DIGEST$PACKAGING_PRODUCER_SOURCE$PACKAGING_PROVENANCE_ARTIFACT_ID$PACKAGING_PROVENANCE_ARTIFACT_SHA256"
          else
            if [ -z "$VERIFIED_PR_RUN" ]; then
              python3 -m unittest discover -s scripts -p 'test_retained_release_runtime.py'
            fi
            python3 scripts/retained_release_runtime.py bind --run-id "$ORIGINAL_RUN" \
              --source-sha "$ORIGINAL_SOURCE" --artifact-id "$ORIGINAL_ARTIFACT" \
              --packaging-producer-source "$PACKAGING_PRODUCER_SOURCE" --packaging-provenance-artifact-id "$PACKAGING_PROVENANCE_ARTIFACT_ID" --packaging-provenance-artifact-sha256 "$PACKAGING_PROVENANCE_ARTIFACT_SHA256" \
              --artifact-sha256 "$ORIGINAL_DIGEST" --receipt "$RUNNER_TEMP/retained-audio-input.json"
          fi

      - name: Bind exact PR source checks
        if: inputs.verified_pr_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_PR_RUN: ${{ inputs.verified_pr_run_id }}
        run: |
          python3 scripts/verified_pr_source_checks.py prepare --run-id "$VERIFIED_PR_RUN" \
            --output "$RUNNER_TEMP/private-analysis-pr-source"

      - name: Verify fixture bundle tooling
        if: inputs.verified_pr_run_id == ''
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Install pinned ORAS CLI
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Authenticate to private GHCR packages
        env:
          NGV_GHCR_TOKEN: ${{ secrets.NGV_GHCR_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$NGV_GHCR_TOKEN" | oras login ghcr.io \
            --username iret77 \
            --password-stdin \
            --registry-config "$RUNNER_TEMP/oras-auth.json"

      - name: Reject private fixture content in the repository
        env:
          FIXTURE_DIGEST: ${{ vars.NGV_EXAMPLE_FIXTURE_DIGEST }}
        run: |
          set -euo pipefail
          PACKAGE_DIR="$RUNNER_TEMP/source-fixture-package"
          EXTRACT_DIR="$RUNNER_TEMP/source-fixture-data"
          mkdir -p "$PACKAGE_DIR"
          oras pull \
            --no-tty \
            --registry-config "$RUNNER_TEMP/oras-auth.json" \
            --output "$PACKAGE_DIR" \
            "ghcr.io/iret77/nexgenvideo-examples@$FIXTURE_DIGEST"
          python3 scripts/example_fixture_bundle.py extract \
            --archive "$PACKAGE_DIR/examples.tar.gz" \
            --manifest "$PACKAGE_DIR/fixtures.manifest.json" \
            --destination "$EXTRACT_DIR"
          python3 scripts/example_fixture_bundle.py check-repository \
            --repository "$GITHUB_WORKSPACE" \
            --manifest "$PACKAGE_DIR/fixtures.manifest.json"

      - name: Remove private source-gate data and credentials
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/source-fixture-package" "$RUNNER_TEMP/source-fixture-data"
          rm -f "$RUNNER_TEMP/oras-auth.json"

  build-runtime-harness:
    name: Build Private Analysis Harness
    needs: source-gate
    if: inputs.runtime_artifact == '' && inputs.runtime_run_id == ''
    # Compilation and bundling stay on the designated Xcode 27 build runner.
    runs-on: macrunner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-xcode-27

      - uses: ./.github/actions/cache-swiftpm-dependencies

      - name: Bundle real app and external pack
        run: |
          set -euo pipefail
          scripts/bundle.sh debug --without-bpy-runtime-for-ci-transfer
          scripts/assemble_ngvpack.sh plugins/musicvideo.json debug .build/plugins
          tar -czf "$RUNNER_TEMP/runtime-harness.tar.gz" \
            -C .build \
            NexGenVideo.app \
            plugins/musicvideo.ngvpack

      - name: Transfer runtime harness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-analysis-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-harness.tar.gz
          if-no-files-found: error
          retention-days: 1

  analyze:
    name: Analyze Private Example
    needs: [source-gate, build-runtime-harness]
    if: ${{ !cancelled() && needs.source-gate.result == 'success' && (needs.build-runtime-harness.result == 'success' || (needs.build-runtime-harness.result == 'skipped' && (inputs.runtime_artifact != '' || inputs.runtime_run_id != ''))) }}
    runs-on: macrunner
    # Bootstrap ceiling for the first measured real-file run; replace with p90 × 2 once run data exists.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-native-test-python
        if: inputs.runtime_run_id != ''

      - name: Verify supported runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="$(sw_vers -productVersion)"
          runtime_major="${runtime_version%%.*}"
          RUNTIME_PRODUCT_VERSION="$runtime_version" python3 - <<'PYTHON'
          import json, os, pathlib, platform, subprocess
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'analysis-runtime' / 'runtime-environment.json'
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps({
              'productVersion': os.environ['RUNTIME_PRODUCT_VERSION'],
              'osBuild': subprocess.check_output(['sw_vers', '-buildVersion'], text=True).strip(),
              'architecture': platform.machine(),
              'runnerName': os.environ.get('RUNNER_NAME'),
              'sourceSHA': os.environ.get('ORIGINAL_SOURCE') or os.environ['GITHUB_SHA'],
              'harnessSHA': os.environ['GITHUB_SHA'],
          }, indent=2) + '\n')
          PYTHON
          if [ "$runtime_major" -lt 26 ]; then
            echo "::error::Private audio analysis requires macOS 26 or later; this runner boots macOS $runtime_version."
            exit 1
          fi
          test "$(uname -m)" = arm64
          sw_vers

      - name: Retain actual runtime identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-analysis-runtime-environment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/analysis-runtime/runtime-environment.json
          if-no-files-found: error
          retention-days: 14

      - name: Download runtime harness
        if: inputs.runtime_run_id == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.runtime_artifact || format('private-analysis-runtime-{0}-{1}', github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/runtime-harness

      - name: Restore runtime harness
        if: inputs.runtime_run_id == ''
        run: |
          set -euo pipefail
          mkdir -p .build
          archives=("$RUNNER_TEMP/runtime-harness/"*.tar.gz)
          [ "${#archives[@]}" -eq 1 ]
          tar -xzf "${archives[0]}" -C .build
          [ -x .build/NexGenVideo.app/Contents/MacOS/NexGenVideo ]
          [ -d .build/plugins/musicvideo.ngvpack ]

      - name: Restore the original signed App and external pack without rebuilding
        if: inputs.runtime_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/retained_release_runtime.py restore --run-id "$ORIGINAL_RUN" \
            --source-sha "$ORIGINAL_SOURCE" --artifact-id "$ORIGINAL_ARTIFACT" \
            --packaging-producer-source "$PACKAGING_PRODUCER_SOURCE" \
            --packaging-provenance-artifact-id "$PACKAGING_PROVENANCE_ARTIFACT_ID" \
            --packaging-provenance-artifact-sha256 "$PACKAGING_PROVENANCE_ARTIFACT_SHA256" \
            --artifact-sha256 "$ORIGINAL_DIGEST" --destination .build \
            --receipt "$RUNNER_TEMP/analysis-runtime/execution-provenance.json"

      - name: Install pinned ORAS CLI
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Authenticate to private GHCR packages
        env:
          NGV_GHCR_TOKEN: ${{ secrets.NGV_GHCR_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$NGV_GHCR_TOKEN" | oras login ghcr.io \
            --username iret77 \
            --password-stdin \
            --registry-config "$RUNNER_TEMP/oras-auth.json"

      - name: Pull and verify immutable fixtures
        env:
          FIXTURE_DIGEST: ${{ vars.NGV_EXAMPLE_FIXTURE_DIGEST }}
        run: |
          set -euo pipefail
          FIXTURE_REFERENCE="ghcr.io/iret77/nexgenvideo-examples@$FIXTURE_DIGEST"
          PACKAGE_DIR="$RUNNER_TEMP/fixture-package"
          EXTRACT_DIR="$RUNNER_TEMP/fixture-data"
          mkdir -p "$PACKAGE_DIR"
          oras pull \
            --no-tty \
            --registry-config "$RUNNER_TEMP/oras-auth.json" \
            --output "$PACKAGE_DIR" \
            "$FIXTURE_REFERENCE"
          python3 scripts/example_fixture_bundle.py extract \
            --archive "$PACKAGE_DIR/examples.tar.gz" \
            --manifest "$PACKAGE_DIR/fixtures.manifest.json" \
            --destination "$EXTRACT_DIR"

      - name: Run exact-file analysis through the real app and pack
        env:
          NGV_EXAMPLE_ANALYSIS_PACK: ${{ github.workspace }}/.build/plugins/musicvideo.ngvpack
          NGV_EXAMPLE_FIXTURE_ROOT: ${{ runner.temp }}/fixture-data/examples
          NGV_EXAMPLE_FIXTURE_MANIFEST: ${{ runner.temp }}/fixture-package/fixtures.manifest.json
          NGV_EXAMPLE_REGISTRY_REFERENCE: ghcr.io/iret77/nexgenvideo-examples@${{ vars.NGV_EXAMPLE_FIXTURE_DIGEST }}
          NGV_EXAMPLE_DATASET: ${{ inputs.dataset }}
          NGV_EXAMPLE_REPORT_DIR: ${{ runner.temp }}/analysis-report
          NGV_GIT_COMMIT: ${{ inputs.runtime_source_sha || github.sha }}
        run: .build/NexGenVideo.app/Contents/MacOS/NexGenVideo -ApplePersistenceIgnoreState YES

      - name: Verify actual optional material intake
        run: python3 scripts/musicvideo_intake_evidence.py "$RUNNER_TEMP/analysis-report"

      - name: Publish private analysis report
        if: ${{ always() }}
        id: report
        env:
          REPORT_REFERENCE: ghcr.io/iret77/nexgenvideo-analysis-reports:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/analysis-report/provenance.json" ]; then
            echo "No private analysis provenance was produced."
            exit 0
          fi
          cd "$RUNNER_TEMP/analysis-report"
          if [ -f "$RUNNER_TEMP/analysis-runtime/execution-provenance.json" ]; then
            cp "$RUNNER_TEMP/analysis-runtime/execution-provenance.json" retained-runtime.json
          fi
          layers=(
            provenance.json:application/vnd.nexgenvideo.example-analysis-provenance.v6+json
          )
          tar -czf "$RUNNER_TEMP/musicvideo-acceptance.tar.gz" .
          mv "$RUNNER_TEMP/musicvideo-acceptance.tar.gz" musicvideo-acceptance.tar.gz
          layers+=(musicvideo-acceptance.tar.gz:application/vnd.nexgenvideo.musicvideo-acceptance.v1+tar+gzip)
          if [ -s analysis.json ]; then
            analysis_media="application/vnd.nexgenvideo.analysis-evidence.v1+json"
            if jq -e '.analysis != null' provenance.json >/dev/null; then
              analysis_media="application/vnd.nexgenvideo.analysis.v3+json"
            fi
            layers=(
              "analysis.json:$analysis_media"
              "${layers[@]}"
            )
          fi
          if [ -s measurement-proof.json ]; then
            layers=(
              measurement-proof.json:application/vnd.nexgenvideo.analysis-measurement-proof.v1+json
              "${layers[@]}"
            )
          fi
          REPORT_DIGEST="$(oras push \
            --no-tty \
            --registry-config "$RUNNER_TEMP/oras-auth.json" \
            --artifact-type application/vnd.nexgenvideo.example-analysis-report.v6 \
            --format 'go-template={{.digest}}' \
            "$REPORT_REFERENCE" \
            "${layers[@]}")"
          echo "reference=${REPORT_REFERENCE%:*}@$REPORT_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify report package isolation
        if: ${{ always() && steps.report.outputs.reference != '' }}
        env:
          GH_TOKEN: ${{ secrets.NGV_GHCR_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_JSON="$(gh api /users/iret77/packages/container/nexgenvideo-analysis-reports)"
          [ "$(jq -r '.visibility' <<<"$PACKAGE_JSON")" = "private" ] \
            || { echo "::error::analysis report package is not private"; exit 1; }
          [ "$(jq -r '.repository // empty' <<<"$PACKAGE_JSON")" = "" ] \
            || { echo "::error::analysis report package is linked to a repository"; exit 1; }
          printf 'Private report: `%s`\n' '${{ steps.report.outputs.reference }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private runner data and credentials
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/fixture-package" "$RUNNER_TEMP/fixture-data" "$RUNNER_TEMP/analysis-report"
          rm -rf "$RUNNER_TEMP/runtime-harness" .build/NexGenVideo.app .build/plugins
          rm -f "$RUNNER_TEMP/oras-auth.json"
