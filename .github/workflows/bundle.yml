name: Bundle .app

# Split out of ci.yml so it can be PATH-GATED. This job re-builds and bundles on a macOS runner
# (~4.5 min = ~45 quota-minutes at the 10x macOS multiplier), and what it guards — the pack linking
# the SHARED engine, the @executable_path rpath, the phase contract, and the real load-time cast — can
# only be broken by the build graph, engine, pack sources, bundling scripts, or the explicit host
# loader/contract paths below. The relaunch and Home overlay lifecycle files are separate exceptions
# because this job exercises the real What's New dismissal and Home restart through native mouse events.
#
# NOTE the coverage this trades away: the load test also happens to smoke-test that the app BINARY
# launches. A Sources/NexGenVideo-only PR no longer gets that. `swift test` still runs on every PR.
#
# Add a path here whenever something new can influence linkage or bundling.
on:
  pull_request:
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Engine/**'
      - 'Metal/**'
      - 'Sources/MusicvideoPlugin/**'
      - 'Sources/FixtureFictionPlugin/**'
      - 'Sources/NexGenVideo/Agent/Intake/HardStepManifest.swift'
      - 'Sources/NexGenVideo/Agent/Pipeline/**'
      - 'Sources/NexGenVideo/Agent/Tools/ToolDefinitions.swift'
      - 'Sources/NexGenVideo/Agent/Tools/ToolExecutor*.swift'
      - 'Sources/NexGenVideo/App/AppDelegate.swift'
      - 'Sources/NexGenVideo/App/Changelog.swift'
      - 'Sources/NexGenVideo/App/AppRelaunch.swift'
      - 'Sources/NexGenVideo/App/AppRelaunchSelfTest.swift'
      - 'Sources/NexGenVideo/App/ExampleAudioAnalysisSelfTest.swift'
      - 'Sources/NexGenVideo/App/main.swift'
      - 'Sources/NexGenVideo/Utilities/HangDiagnostic*.swift'
      - 'Sources/NexGenVideo/Project/HomeView.swift'
      - 'Sources/NexGenVideo/Project/UpdateOverlay.swift'
      - 'Sources/NexGenVideo/Inspector/Cockpit/NativeCockpitReader.swift'
      - 'Sources/NexGenVideo/Inspector/Cockpit/NativeGateWriter.swift'
      - 'Sources/NexGenVideo/Plugins/**'
      - 'Sources/NexGenVideo/Resources/**'
      - 'scripts/**'
      - 'plugins/**'
      - '.github/actions/cache-swiftpm-dependencies/**'
      - '.github/actions/setup-xcode-27/**'
      - '.github/workflows/bundle.yml'
  workflow_dispatch:

concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    name: Source Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Enforce AppTheme
        run: python3 scripts/lint_app_theme.py

      - name: Validate pack pipeline contracts
        run: |
          for manifest in plugins/*.json; do
            python3 scripts/validate_pipeline_contract.py "$manifest"
          done

      - name: Verify private fixture bundle tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  bundle-app:
    name: Bundle .app
    needs: source-gate
    # Smoke-test that the debug .app still assembles (no secrets, no local build) and keep it as a CI
    # artifact. The public `dev-latest` download is the SIGNED + notarized DMG published by release.yml
    # — ci.yml no longer writes that release.
    # Xcode 27 compiles the macOS 26 app and its availability-gated macOS 27 adapter.
    runs-on: xcode-27
    # Cost ceiling on a 10x-billed runner; the real job takes ~4.5 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-xcode-27

      - uses: ./.github/actions/cache-swiftpm-dependencies

      - name: Bundle (debug, ad-hoc signed)
        run: scripts/bundle.sh debug

      - name: Verify app build did not mutate tracked source
        run: scripts/verify_tracked_source_state.sh

      - name: Assemble format pack (.ngvpack, ad-hoc) + catalog
        run: |
          set -euo pipefail
          # Secret-free validation of the whole pack pipeline: assemble the ad-hoc-signed
          # .ngvpack, then merge it into a catalog the app decodes.
          scripts/assemble_ngvpack.sh plugins/musicvideo.json debug .build/plugins
          swift build --cache-path "$NGV_SWIFTPM_CACHE_PATH" --product FixtureFictionPlugin
          scripts/assemble_ngvpack.sh plugins/fixture-fiction.json debug .build/pack-fixtures
          # Merge against a channel that already carries an OLDER version: the append-only
          # promise #168 rests on (older versions survive, so an older app keeps its last
          # compatible pack) is what makes the multi-version selection meaningful.
          cat > .build/existing.json <<'JSON'
          {"schema":"plugins/v2","plugins":[{"id":"musicvideo","displayName":"Music Video",
           "tagline":"older","version":"0.0.1","minAppVersion":"0.1.0",
           "url":"https://example.com/plugins/musicvideo-0.0.1.ngvpack.zip","sha256":"deadbeef"}]}
          JSON
          python3 scripts/publish_plugin_catalog.py .build/plugins "https://example.com/plugins" \
            .build/plugins/catalog.json --existing .build/existing.json
          cat .build/plugins/catalog.json
          python3 - <<'PY'
          import json, sys
          plugins = json.load(open(".build/plugins/catalog.json"))["plugins"]
          versions = [p["version"] for p in plugins if p["id"] == "musicvideo"]
          assert "0.0.1" in versions, f"append-only violated — older version dropped: {versions}"
          assert len(versions) > 1, f"the freshly built version was not appended: {versions}"
          fresh = next(p for p in plugins if p["id"] == "musicvideo" and p["version"] != "0.0.1")
          assert fresh["projectSchema"] == "musicvideo/2.0.0", fresh
          assert fresh["migratesFrom"] == ["musicvideo/legacy", "musicvideo/1.0.0"], fresh
          for p in plugins:
              assert p["url"].endswith(f"{p['id']}-{p['version']}.ngvpack.zip"), f"unversioned asset URL: {p['url']}"
          print(f"catalog carries {len(versions)} musicvideo version(s): {versions}")
          PY

      - name: Verify pack links the SHARED engine (guards the PackEntry-cast regression)
        run: |
          set -euo pipefail
          # A `.ngvpack` must link NexGenEngine as ONE shared dynamic image with the app —
          # not statically absorb it. If it absorbs the engine, the pack carries its own
          # `PackEntry` (ObjC `NGVPackEntry`) class, so the host's load-time
          # `bundle.principalClass as? PackEntry.Type` cast fails ("entry point not found")
          # and the pack silently never activates. No test inside the package graph can
          # catch this (they link the pack statically → one class), so we assert the
          # Mach-O invariant on the assembled bundle here.
          APP_BIN=".build/NexGenVideo.app/Contents/MacOS/NexGenVideo"
          while IFS= read -r PACK_BIN; do
            echo "pack binary: $PACK_BIN"
            # 1) every pack references the shared engine dylib dynamically
            otool -L "$PACK_BIN" | grep -q '@rpath/libNexGenEngine.dylib' \
              || { echo "::error::$PACK_BIN does not dynamically link libNexGenEngine.dylib"; exit 1; }
            # 2) no pack carries its own copy of the engine's PackEntry class
            if nm "$PACK_BIN" | grep -E ' [SDTtbd] _OBJC_CLASS_\$_NGVPackEntry$'; then
              echo "::error::$PACK_BIN statically absorbs NexGenEngine"; exit 1
            fi
          done < <(find .build/plugins .build/pack-fixtures -path '*.ngvpack/Contents/MacOS/*' -type f | sort)
          # 3) the app links the engine dynamically too (else the shared image never loads)
          otool -L "$APP_BIN" | grep -q '@rpath/libNexGenEngine.dylib' \
            || { echo "::error::app does not dynamically link libNexGenEngine.dylib"; exit 1; }
          echo "OK: NexGenEngine is one shared dynamic image across app + pack"

      - name: Load-test — the app actually loads the pack from an EXTERNAL dir (guards the load-time cast)
        run: |
          set -euo pipefail
          # The static checks above are necessary but NOT sufficient — they missed the 0.7.6 rpath
          # regression where the pack couldn't resolve the shared engine at load time. This reproduces
          # the FIELD layout: the pack lives OUTSIDE the app bundle, so its @rpath/libNexGenEngine.dylib
          # must resolve to the host's Contents/Frameworks via @executable_path/../Frameworks. The REAL
          # app binary loads it (gate → Bundle.load() → principalClass cast → makePack()) and exits 0
          # only on success.
          EXTDIR="$(mktemp -d)/packs"; mkdir -p "$EXTDIR"
          for PACK in .build/plugins/musicvideo.ngvpack .build/pack-fixtures/fixture-fiction.ngvpack; do
            PACK_BIN="$(find "$PACK/Contents/MacOS" -maxdepth 1 -type f | head -1)"
            otool -l "$PACK_BIN" | grep -q 'path @executable_path/../Frameworks' \
              || { echo "::error::$PACK is missing the host-engine rpath"; exit 1; }
            EXTERNAL="$EXTDIR/$(basename "$PACK")"
            cp -R "$PACK" "$EXTERNAL"
            echo "loading $EXTERNAL with the real app binary…"
            NGV_SELFTEST_PACK="$EXTERNAL" .build/NexGenVideo.app/Contents/MacOS/NexGenVideo
          done
          echo "OK: the app loaded both packs from an external directory"

      - name: Relaunch-test — historical ABI gate and same-contract restart keep Home interactive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS_DIR="$(mktemp -d)"
          PREVIOUS_PACK="$(bash scripts/fetch_previous_pack.sh \
            .build/plugins/musicvideo.ngvpack "$PREVIOUS_DIR")"
          while IFS= read -r COMPATIBLE_PACK; do
            NGV_SELFTEST_LOAD_ONLY=1 NGV_SELFTEST_PACK="$COMPATIBLE_PACK" \
              .build/NexGenVideo.app/Contents/MacOS/NexGenVideo
          done < <(find "$PREVIOUS_DIR/compatible" -maxdepth 1 -type d -name '*.ngvpack' | sort)
          while IFS= read -r INCOMPATIBLE_PACK; do
            NGV_SELFTEST_EXPECT_ENGINE_INCOMPATIBLE=1 \
              NGV_SELFTEST_PACK="$INCOMPATIBLE_PACK" \
              .build/NexGenVideo.app/Contents/MacOS/NexGenVideo
          done < <(find "$PREVIOUS_DIR/incompatible" -maxdepth 1 -type d -name '*.ngvpack' | sort)
          bash scripts/relaunch_selftest.sh \
            .build/NexGenVideo.app \
            "$PREVIOUS_PACK" \
            .build/plugins/musicvideo.ngvpack

      - name: Verify bundling did not mutate tracked source
        run: scripts/verify_tracked_source_state.sh

      - name: Zip .app
        run: ditto -c -k --keepParent .build/NexGenVideo.app .build/NexGenVideo.zip

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexGenVideo-app
          path: .build/NexGenVideo.zip
          if-no-files-found: error

  diagnostic-startup:
    needs: bundle-app
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-release-evidence
          run-id: 34175620480
          github-token: ${{ github.token }}
          path: control
      - name: Prove shipped build 97 misses normal recorder startup
        run: |
          ditto -x -k control/diagnostic-app.zip control
          python3 scripts/verify_hang_startup.py control/NexGenVideo.app --expect-missing-recorder --output evidence/control.json
      - uses: actions/download-artifact@v4
        with:
          name: NexGenVideo-app
          path: candidate
      - name: Verify normal startup and disabled preference
        run: |
          ditto -x -k candidate/NexGenVideo.zip candidate
          python3 scripts/verify_hang_startup.py candidate/NexGenVideo.app --output evidence/candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-normal-startup
          path: evidence/*.json
