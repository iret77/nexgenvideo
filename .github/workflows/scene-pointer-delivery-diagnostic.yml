name: Measure retained compact-scene pointer delivery

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      artifact_id:
        type: string
        required: true
      artifact_sha256:
        type: string
        required: true
      failure_artifact_id:
        type: string
        required: true
      failure_artifact_sha256:
        type: string
        required: true
      expected_dmg_sha256:
        type: string
        required: true
      verified_pr_run_id:
        type: string
        required: true
      observer_source_sha:
        type: string
        required: false
        default: ''
      observer_artifact_id:
        type: string
        required: false
        default: ''
      observer_artifact_sha256:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: scene-pointer-delivery-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  measurement:
    runs-on: macrunner
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      KIND: native-scene-pointer-delivery
      PRODUCER_RUN: ${{ inputs.run_id }}
      PRODUCER_SHA: ${{ inputs.source_sha }}
      DIAGNOSTIC_ID: ${{ inputs.artifact_id }}
      DIAGNOSTIC_DIGEST: ${{ inputs.artifact_sha256 }}
      FAILURE_ID: ${{ inputs.failure_artifact_id }}
      FAILURE_DIGEST: ${{ inputs.failure_artifact_sha256 }}
      DMG_DIGEST: ${{ inputs.expected_dmg_sha256 }}
      VERIFIED_PR: ${{ inputs.verified_pr_run_id }}
      PRODUCT_SHA: ${{ inputs.observer_source_sha }}
      PRODUCTS_ID: ${{ inputs.observer_artifact_id }}
      PRODUCTS_DIGEST: ${{ inputs.observer_artifact_sha256 }}
      SCALE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-xcode-27
      - name: Measure one HID intervention during the retained full bpy harness
        run: |
          set -euo pipefail
          python3 scripts/scene_pointer_delivery.py run \
            --output "$RUNNER_TEMP/scene-pointer-delivery" </dev/null \
            > "$RUNNER_TEMP/scene-pointer-wrapper.log" 2>&1
      - name: Require unchanged diagnostic source
        run: git diff --exit-code HEAD --
      - name: Retain the complete one-shot observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-scene-pointer-delivery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scene-pointer-delivery/
            ${{ runner.temp }}/scene-pointer-wrapper.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
