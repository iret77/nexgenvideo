name: Record verified source checkout
description: Preserve the exact PR checkout tree after successful source checks.
inputs:
  step-results:
    description: Actual outcome and conclusion of each required source check.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NGV_SOURCE_CHECK_RESULTS: ${{ inputs.step-results }}
      run: python3 scripts/verified_pr_source_checks.py record --output "$RUNNER_TEMP/verified-source-checks"
