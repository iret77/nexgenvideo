name: Cache SwiftPM dependencies
description: Cache resolved dependency sources and binary artifacts without reusing build products.

inputs:
  restore-only:
    description: Restore dependencies without saving in the job post phase.
    default: 'false'

outputs:
  cache-path:
    description: Isolated dependency cache directory.
    value: ${{ steps.cache-path.outputs.path }}
  cache-hit:
    description: Exact cache match in restore-only mode.
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: Original cache key in restore-only mode.
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Fingerprint Apple toolchain
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        xcode_identity="$(xcodebuild -version)"
        swift_identity="$(swift --version)"
        identity="$(printf '%s\n%s\n' "$xcode_identity" "$swift_identity" | shasum -a 256 | awk '{ print $1 }')"
        [ -n "$identity" ]
        echo "identity=$identity" >> "$GITHUB_OUTPUT"

    - name: Isolate dependency cache
      id: cache-path
      shell: bash
      run: |
        set -euo pipefail
        path="$RUNNER_TEMP/swiftpm-dependency-cache"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "NGV_SWIFTPM_CACHE_PATH=$path" >> "$GITHUB_ENV"

    - name: Cache resolved dependencies
      if: inputs.restore-only != 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.cache-path.outputs.path }}
        key: spm-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Engine/Package.swift') }}

    - name: Restore resolved dependencies
      id: restore
      if: inputs.restore-only == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.cache-path.outputs.path }}
        key: spm-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Engine/Package.swift') }}
