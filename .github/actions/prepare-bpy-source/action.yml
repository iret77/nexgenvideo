name: Prepare original qualified bpy source
description: Fetch the pinned original source pair and validate current distribution pins without republishing its bytes.
inputs:
  directory:
    description: Local output directory without a source pair; an input receipt may already exist
    required: true
  receipt:
    description: Optional exact same-source upstream handoff receipt
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_DIRECTORY: ${{ inputs.directory }}
        SOURCE_RECEIPT: ${{ inputs.receipt }}
      run: |
        set -euo pipefail
        ngv_bpy_source_sha="$GITHUB_SHA"
        if [ -n "${RETAINED_PACKAGING_ROOT:-}${RETAINED_PACKAGING_INPUT_SHA256:-}" ]; then
          ngv_bpy_source_sha="$(python3 scripts/retained_packaging.py source)"
        fi
        if [ "${NGV_CURRENT_COMPILED_SOURCE_REUSE:-}" = true ]; then
          python3 scripts/compiled_app_release.py prepare-resumed-source \
            --root "$RUNNER_TEMP/release-signed-binding" --output "$SOURCE_DIRECTORY"
          exit 0
        fi
        args=(--output-directory "$SOURCE_DIRECTORY" --source-sha "$ngv_bpy_source_sha")
        if [ -n "$SOURCE_RECEIPT" ]; then args+=(--receipt "$SOURCE_RECEIPT"); fi
        python3 scripts/consume_bpy_distributable_source.py "${args[@]}"
