name: Prepare exact native acceptance runtime
description: Verify the immutable shared app, pack and corresponding-source identity on macOS 26.
inputs:
  artifact-id:
    description: Immutable runtime artifact ID
    required: true
  run-id:
    description: Runtime producer run ID
    required: true
  identity-artifact-id:
    description: Validated runtime identity artifact
    required: true
  identity-sha:
    description: Exact identity JSON digest from its producer job
    required: true
outputs:
  executable:
    description: Verified app executable
    value: ${{ steps.runtime.outputs.executable }}
  identity:
    description: Verified identity JSON
    value: ${{ steps.runtime.outputs.identity }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        artifact-ids: ${{ inputs.artifact-id }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/native-runtime
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        artifact-ids: ${{ inputs.identity-artifact-id }}
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/native-identity
    - name: Verify same artifact bytes and source commit
      id: runtime
      shell: bash
      env:
        NGV_NATIVE_IDENTITY_SHA: ${{ inputs.identity-sha }}
      run: |
        set -euo pipefail
        test "$(sw_vers -productVersion | cut -d. -f1)" = 26
        test "$(uname -m)" = arm64
        python3 scripts/workspace_native_ci.py verify-runtime "$RUNNER_TEMP/native-runtime" "$RUNNER_TEMP/native-identity/identity.json" "$NGV_NATIVE_IDENTITY_SHA"
        tar -xzf "$RUNNER_TEMP/native-runtime/workspace-ui.tar.gz" -C "$RUNNER_TEMP/native-runtime"
        [ "$(/usr/libexec/PlistBuddy -c 'Print :NGVSourceCommit' "$RUNNER_TEMP/native-runtime/NexGenVideo.app/Contents/Info.plist")" = "$GITHUB_SHA" ]
        echo "NGV_WORKSPACE_UI_PACK=$RUNNER_TEMP/native-runtime/plugins/musicvideo.ngvpack" >> "$GITHUB_ENV"
        echo "NGV_NATIVE_IDENTITY_FILE=$RUNNER_TEMP/native-identity/identity.json" >> "$GITHUB_ENV"
        echo "executable=$RUNNER_TEMP/native-runtime/NexGenVideo.app/Contents/MacOS/NexGenVideo" >> "$GITHUB_OUTPUT"
        echo "identity=$RUNNER_TEMP/native-identity/identity.json" >> "$GITHUB_OUTPUT"
