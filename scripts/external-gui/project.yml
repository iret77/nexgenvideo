name: NexGenVideoExternalGUI
options:
  bundleIdPrefix: de.h5ventures.nexgenvideo.acceptance
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_APP_SANDBOX: NO
targets:
  NexGenVideoExternalUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [NexGenVideoExternalUITests]
    entitlements:
      path: NexGenVideoExternalUITests.entitlements
      properties:
        com.apple.security.app-sandbox: false
schemes:
  NexGenVideoExternalGUI:
    build:
      targets:
        NexGenVideoExternalUITests: [test]
    test:
      targets: [NexGenVideoExternalUITests]
